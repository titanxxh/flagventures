timeline:
  duration: 10
  basis: illustration
  note: 10 秒只安排区域和指示线的讲解显隐，不安排人物先后起跑，不模拟动态跟防。
keyframes:
  - id: start
    at: 0
    label: 初始站位
    cue: 找到五名防守者。D1–D4 是教学编号，R 保留原图标记。
    view:
      zoneIds: []
      assignmentIds: []
  - id: front
    at: 3.3
    label: 前方两区
    cue: 看前方的两片区域及各自对应的防守者；区域表示职责。
    view:
      zoneIds:
        - front-left
        - front-right
      assignmentIds:
        - cover-D1
        - cover-D4
  - id: deep
    at: 6.6
    label: 后方两区
    cue: 看后方的两片区域。人物不用沿椭圆边界跑动。
    view:
      zoneIds:
        - deep-left
        - deep-right
      assignmentIds:
        - cover-D2
        - cover-D3
  - id: all
    at: 10
    label: 合看分工
    cue: 一起看四片覆盖区域与 R 的箭头，指出每人的职责。
    view:
      zoneIds:
        - front-left
        - deep-left
        - deep-right
        - front-right
      assignmentIds:
        - cover-D1
        - cover-D2
        - cover-D3
        - cover-D4
        - rush-R
notes:
  - 保留 p59 原观看方向：进攻方向朝画面下方，后方覆盖区也在画面下方。
  - 所有坐标与半径是原型数据除以 10；原型已分别归一化原 PDF 场地区，因此这些数值不是实际码数。
  - 区域指示线和 R 冲传方向线都是静态 guide；从原始线段起点出发，不强改为球员中心，也不触发人物跑动。
  - R 的箭头实际终点在 C 左上方，未追加冲到 Q 的路线或盯人对象。
translations:
  en:
    title.zh: NFL FLAG COVER 2
    summary: >-
      Use four keyframes to explore the four coverage zones and R’s rush direction. Players remain at their
      known positions.
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Based on the supplied PDF. The Chinese study translation is unofficial; drawing coordinates are not
      actual yards.
    timeline.note: >-
      The timeline reveals teaching layers only; it does not represent defender start order or simulate
      pursuit.
    notes.0: >-
      Page 59 keeps its original orientation: the offense attacks downward and the back coverage zones are
      also below.
    notes.1: >-
      Coordinates and radii are scaled from the normalized PDF field area. They are drawing units, not actual
      yards.
    notes.2: >-
      Zone and rush guides are static. They keep their original starting points and do not trigger player
      movement.
    notes.3: R’s arrow ends above and left of C. No extra route to Q or matchup has been added.
    players.Q.label.zh: Movement not specified
    players.Q.label.description: Only Q’s starting position is shown. Later movement is not specified.
    players.Q.motion.note: >-
      Only the known starting position is shown. Later movement is unspecified; this does not require standing
      still.
