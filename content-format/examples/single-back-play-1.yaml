# UTF-8; display translations share the same routes and timing.
format: flag-lesson
version: 1
id: single-back-play-1
kind: offense
title:
  zh: 单跑卫阵型 · 第 1 号战术
  en: SINGLE BACK PLAY 1
summary: X、Z 向内切，Y 向侧面展开；其他接球手没有空位时，中锋再提供接应。
teaching:
  goal: 横向拉开，保留中锋的条件接应。
  cooperation: X、Z 与 Y 分向展开；C 是否加入取决于其他接球点是否被盯住。
  cue: 我跑好自己的方向，也给队友留地方。
  question: 如果三名接球手都被跟住，谁还可以出来接应？
source:
  title: NFL FLAG 2024 中英文对照学习译本（用户附件）
  page: 7
  note: 跑位坐标来自用户附件，归一化后重绘，非实际码数；路线称呼与配合讲解补充自 NFL FLAG 官网和视频。儿童口令、提问与播放节奏为教学改写。
  references:
    - title: NFL FLAG · Single Back 战术说明
      url: https://nflflag.com/coaches/flag-football-rules/5-on-5-flag-football-playbook
      locator: Single Back · Play 1
      note: 官网的战术意图和相对先后建议；不作为精确秒表。
    - title: NFL FLAG · Single Back 视频
      url: https://www.youtube.com/watch?v=Qa3p35cThJ4&t=34s
      locator: 0:34–0:55
      note: 时间用于定位解说；逐人讲述不表示逐人启动。
