timeline:
  duration: 10
  basis: illustration
  note: >-
    C 的启动有条件：其他三名接球手都没有空位。由家长先选择演示情形；满足条件的分支示范等待 2 秒后跑完路线，另一个分支仅保留已知站位。2 秒、总时长 10
    秒及其他球员同时起跑均为教学设置，不是比赛规则或完整时序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 选情形
    cue: 先选定 C 是否满足释放条件，再指出 X、Y、Z 的起点。
  - id: spread
    at: 2
    label: 按情形展开
    cue: 比较 X、Z 的内切与 Y 的侧向展开；C 取决于所选情形。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 找到两侧接球点，再看是否需要 C 加入。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 如果三名接球手都被跟住，谁还可以出来接应？
notes:
  - 画面只演示进攻路线，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p7 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
translations:
  en:
    title.zh: SINGLE BACK PLAY 1
    summary: X and Z cut inside while Y breaks wide. C joins only if the other three receivers are covered.
    teaching.goal: Spread out and keep a conditional outlet.
    teaching.cooperation: X and Z cut inside while Y breaks wide. C joins only if the other three receivers are covered.
    teaching.cue: Run your route and leave room for teammates.
    teaching.question: Who can offer another option if all three receivers are covered?
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork explanations also
      use NFL FLAG’s official article and videos. Child-friendly cues, questions and animation timing are
      teaching adaptations.
    source.references.0.title: NFL FLAG · Single Back play explanations
    source.references.0.locator: Single Back · Play 1
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
    source.references.1.title: NFL FLAG · Single Back video
    source.references.1.locator: 0:34–0:55
    source.references.1.note: Timestamps locate the narration; its order does not define player start order.
    timeline.note: >-
      C releases conditionally: the other three receivers are covered. Choose a situation first. The release
      branch waits two teaching seconds; the other branch only shows the known position. Ten seconds total,
      wait lengths and other players starting together are illustrative, not game rules or a complete timing
      sequence.
    notes.0: >-
      This shows offensive routes without simulating defenders. Creating space is the play’s intent, not a
      guaranteed outcome.
    notes.1: The cues and questions are teaching adaptations. Agree on crossing order before practicing on the field.
    notes.2: >-
      Relative positions follow source page 7. Short connections approximate parts hidden beneath markers;
      they are not extra actions or measured yards.
    notes.3: >-
      No complete QB read order, mandatory target or pass timing is specified. Crossing routes do not imply a
      handoff.
    players.Q.label.zh: No route shown
    players.Q.label.description: Only Q’s starting position is shown. Later movement is not specified.
    players.Q.label.note: Based on the diagram on page 7; later movement is not implied.
    players.Q.coaching.cooperation: Observe the receiving areas offered by teammates. No fixed read order or mandatory target is specified.
    players.Q.coaching.timing: The diagram does not specify Q’s later movement or when to pass.
    players.Q.motion.note: >-
      Only the known starting position is shown. Later movement is unspecified; this does not require standing
      still.
    players.C.label.zh: Corner
    players.C.label.description: Run forward, then break diagonally toward the right sideline.
    players.C.label.note: >-
      Name follows the official NFL FLAG explanation (0:34–0:55); direction and geometry retain the supplied
      diagram on page 7.
    players.C.coaching.cooperation: Join on a Corner if the other receivers are covered.
    players.C.coaching.timing: >-
      Release if all three other receivers are covered. Choose the situation before playing. The two-second
      wait is a teaching setting.
    players.C.motion.prompt: >-
      Choose a teaching situation first: C releases if all three other receivers are covered. This animation
      does not judge the defense.
    players.C.motion.options.released.title: 'All three receivers covered: C joins'
    players.C.motion.options.released.note: >-
      Wait two demonstration seconds, then follow the route. The condition comes from the official article;
      two seconds is a teaching setting.
    players.C.motion.options.not-shown.title: Do not show C’s later release
    players.C.motion.options.not-shown.note: >-
      Only the known starting position is shown. Subsequent movement is unspecified; C is not required to
      stand still throughout the play.
    players.X.label.zh: Post
    players.X.label.description: Run forward a short distance, then cut diagonally toward the middle.
    players.X.label.note: >-
      Name follows the official NFL FLAG explanation (0:34–0:55); direction and geometry retain the supplied
      diagram on page 7.
    players.X.coaching.cooperation: Run a Post toward the middle, working with Z on the other side.
    players.X.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.Y.label.zh: Corner
    players.Y.label.description: Start behind Q, run diagonally forward-left, then break toward the left side.
    players.Y.label.note: >-
      Name follows the official NFL FLAG explanation (0:34–0:55); direction and geometry retain the supplied
      diagram on page 7.
    players.Y.coaching.cooperation: Break out from the backfield to offer a different direction from X and Z.
    players.Y.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.Z.label.zh: Post
    players.Z.label.description: Run forward a short distance, then cut diagonally toward the middle.
    players.Z.label.note: >-
      Name follows the official NFL FLAG explanation (0:34–0:55); direction and geometry retain the supplied
      diagram on page 7.
    players.Z.coaching.cooperation: Run a Post toward the middle, giving Q another option alongside X.
    players.Z.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    keyframes.start.label: Line up · Choose a situation
    keyframes.start.cue: >-
      Choose the situation first. Find Q, C, X, Y and Z. X and Z cut inside while Y breaks wide. C joins only
      if the other three receivers are covered.
    keyframes.spread.label: Follow the selected situation
    keyframes.spread.cue: >-
      C’s movement depends on the selected situation. X and Z cut inside while Y breaks wide. C joins only if
      the other three receivers are covered.
    keyframes.middle.label: Pause · See the teamwork
    keyframes.middle.cue: Pause and compare teammates’ routes. Who can offer another option if all three receivers are covered?
    keyframes.end.label: Recall · Explain it
    keyframes.end.cue: Who can offer another option if all three receivers are covered?
