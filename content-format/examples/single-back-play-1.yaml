      basis: source
      note: 名称依据 NFL FLAG Single Back 视频第 1 套（0:34–0:55）；路径保留附件 p7 图形，未按标准码数重画。
    motion:
      type: choice
      startAt: 0
      prompt: 家长先选择演示情形：其他三名接球手都没有空位时，C 才释放；动画不自动判断防守。
      options:
