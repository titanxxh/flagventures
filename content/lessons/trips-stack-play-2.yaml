timeline:
  duration: 10
  basis: illustration
  note: >-
    C 的启动有条件：其他三名接球手都没有空位。由家长先选择演示情形；满足条件的分支示范等待 2 秒后跑完路线，另一个分支仅保留已知站位。2 秒、总时长 10
    秒及其他球员同时起跑均为教学设置，不是比赛规则或完整时序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 选情形
    cue: 先选定 C 是否满足释放条件，再指出 X、Y、Z 的起点。
  - id: spread
    at: 2
    label: 按情形展开
    cue: 先观察 X、Y、Z 的三条接应路线，C 取决于所选情形。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 比较两个情形：C 加入深跑，或来源未说明其后续动作。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 哪种情形下，中锋才加入深处的 Fly？
notes:
  - 跑位与可选球路都是教学演示，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p24 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
