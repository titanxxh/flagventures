  initialOwner: C
  defaultScenario: pass-x
  note: >-
    球路是本应用补充的教学示例，可分别选择传给 C、X、Y、Z；不代表官网规定唯一目标或 QB 阅读顺序。球在 0 秒离开 C，0.35 秒到达 QB；C 可在出球后跑动。QB
    本次保留图示站位。出手、飞行和接球秒数仅为慢放编排，不是比赛用时；接球后沿已有路线继续，不补画额外跑动。
  scenarios:
    - id: pass-c
      title: 传给 C
      basis: illustration
      note: 本次示范选择 C，在他持续向前跑动时接球；没有判断防守或保证空位。本次采用 C 已满足释放条件的情形。第 5.5 秒出手、第 6.2 秒接球仅为教学节奏，接球后继续原路线。
      choices:
        C: released
      motions:
        - player: Q
