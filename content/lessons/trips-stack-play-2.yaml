summary: X、Y、Z 先形成三处接应；三人都没有空位时，中锋再直上跑 Fly。
teaching:
  goal: 理解中锋是有条件加入的后续接应。
  cooperation: X 的短 Post、Y 的短 Out 与 Z 的 Hitch 先展开；C 是否跑 Fly 取决于他们是否被盯住。
  cue: 先看队友，有需要我再接应。
  question: 哪种情形下，中锋才加入深处的 Fly？
