  en:
    title.zh: TRIPS STACK PLAY 2
    summary: >-
      X's short Post, Y's shallow Out and Z's Hitch go first. C releases on a Fly only if all three are
      covered.
    teaching.goal: Understand the center's conditional deep outlet.
    teaching.cooperation: >-
      X's short Post, Y's shallow Out and Z's Hitch go first. C releases on a Fly only if all three are
      covered.
    teaching.cue: Look at teammates first; join when needed.
    teaching.question: When does C join on a deep Fly?
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork explanations also
      use NFL FLAG’s official article and videos. Child-friendly cues, questions and animation timing are
      teaching adaptations.
    source.references.0.title: NFL FLAG · Trips Stack play explanations
    source.references.0.locator: Trips Stack · Play 2
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
