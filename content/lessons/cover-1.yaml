keyframes:
  - id: frame-1
    at: 0
    label: 起始站位
    cue: 找到双方各五名队员。
    view:
      zoneIds: []
      assignmentIds: []
  - id: frame-2
    at: 3.3
    label: 看一组职责
    cue: 沿当前显示的指示线看对应球员或区域。
    view:
      zoneIds:
        - zone-2
        - zone-1
      assignmentIds:
        - assignment-D1
        - assignment-D2
  - id: frame-3
    at: 6.6
    label: 看另一组职责
    cue: 换一组看职责；人物仍只显示已知起点。
    view:
      zoneIds:
        - zone-3
        - zone-4
      assignmentIds:
        - assignment-D3
        - assignment-R
        - assignment-D4
  - id: frame-4
    at: 10
    label: 合看全队分工
    cue: 一起指出每名防守者的对位、覆盖区域或冲传方向。
    view:
      zoneIds:
        - zone-2
        - zone-1
        - zone-3
        - zone-4
      assignmentIds:
        - assignment-D1
        - assignment-D2
        - assignment-D3
        - assignment-R
        - assignment-D4
notes:
  - D 数字只是教学编号；原图观看方向保持不变。区域和虚线是职责示意，不是持续跑动轨迹。
  - 指示线保留原始起止位置，不自动连到球员中心，也不追加球、传球、动态追逐或交接。
