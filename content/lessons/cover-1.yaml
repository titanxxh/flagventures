      Based on the supplied PDF. The Chinese study translation is unofficial; drawing coordinates are not
      actual yards.
    timeline.note: >-
      The timeline reveals teaching layers only; it does not represent defender start order or simulate
      pursuit.
    notes.0: >-
      D numbers are teaching IDs. The diagram keeps its original orientation. Zones and dashed lines show
      assignments, not continuous movement.
    notes.1: >-
      Guides keep their original endpoints rather than snapping to player centers. No ball, passes, pursuit or
      handoffs are added.
