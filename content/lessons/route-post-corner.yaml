# Editable bilingual lesson; source links and teaching adaptations travel with the data.
format: flag-lesson
version: 1
id: route-post-corner
kind: route
title:
  zh: 8 · 内切再外切
  en: POST CORNER
summary: POST CORNER · 本图先直跑 7 码，再像 Post 一样内斜切；到 10 码深度时第二次变向，像 Corner 一样外斜切。
teaching:
  goal: 本图先直跑 7 码，再像 Post 一样内斜切；到 10 码深度时第二次变向，像 Corner 一样外斜切。
  cooperation: 你先从 QB 左前方移向中路，再转向外侧深区。两次变向都属于同一条路线，不表示 QB 要传两次球。
  cue: 先直跑，斜进，再斜出。
  question: 第一次变向像哪条路线？第二次又像哪条？
source:
  title: NFL FLAG 路线教学 · 附件名称与官网说明
  page: 4
  note: >-
    名称和原书编号保留自附件；跑法补充自 NFL FLAG 官网。图形重新绘制为码数比例：场地 30 × 70 码，含两端各 10 码端区；距离从开球线计。首次变向的 7
    码采用官方路线树示例；第二次变向设在 10 码深度及后段长度均为本图选择，官方未指定。QB 站位和动画时长是教学设置，不是原 PDF 路线描摹、官方比赛用时或指定传球时刻。
  references:
    - title: NFL FLAG · 路线树说明
      url: https://nflflag.com/coaches/default/flag-football-rules/flag-football-plays
      locator: POST CORNER
      note: 已同时核对正文与第 6–9 路线图：先直跑 7 码，内斜切，再向外斜切；第二次变向深度未指定。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 本条跑法的方向、名称或图示；具体示意距离另见距离说明。
    - title: NFL FLAG · 球场尺寸
      url: https://nflflag.com/coaches/flag-football-rules/how-to-play-flag-football
      locator: Flag Football Field
      note: 全场宽 30 码、长 70 码，含两端各 10 码端区；本图开球线和 QB 站位为教学选择。
      role: supporting
      kind: rules
      publisher: NFL FLAG
      scope: 辅助理解规则或场地，不作为本条战术的原图出处。
    - title: NFL FLAG · 官方路线图（6–9）
      url: >-
        https://nflstatic.s3.amazonaws.com/attachments/ckhmre5uq232e0jlg1wnfqwlr-screen-shot-2020-11-17-at-8-00-34-pm.max.png
      locator: 8 · POST CORNER
      note: 核对内斜切后再外斜切的双变向；原图没有给第二转折点精确码数，本图的 10 码为教学设置。
      role: primary
      kind: diagram
      publisher: NFL FLAG
      scope: 本条跑法的方向、名称或图示；具体示意距离另见距离说明。
  adaptation: 路线按码重绘；未由来源规定的距离、回接点与播放秒数为教学示例，具体区别见距离说明。
field:
  width: 30
  height: 70
  unit: yard
  endZoneDepth: 10
  attackDirection: up
  lineOfScrimmageY: 50
players:
  - id: X
    team: offense
    at:
      - 8
      - 50
    color: '#80d4ff'
    name: 接球手 X
    label:
      zh: 内切再外切
      en: POST CORNER
      description: 本图先直跑 7 码，再像 Post 一样内斜切；到 10 码深度时第二次变向，像 Corner 一样外斜切。
      basis: source
      note: >-
        已核对 NFL FLAG 官方图与正文，直跑、内斜切、外斜切顺序一致。首次变向的 7 码来自正文；第二次变向设在 10
        码深度与后段长度为本图教学设置。没有把防守者停住误作接球手必须停顿。
    motion:
      type: path
      startAt: 0
      steps:
        - type: line
          to:
            - 8
            - 43
          seconds: 3
        - type: line
          to:
            - 11
            - 40
          seconds: 3
        - type: line
          to:
            - 3
            - 32
          seconds: 4
    coaching:
      cooperation: 你先从 QB 左前方移向中路，再转向外侧深区。两次变向都属于同一条路线，不表示 QB 要传两次球。
      timing: 演示从 0 秒开始，10 秒走完；转折关键帧帮助记忆动作，没有规定开球后必须等待几秒。
  - id: QB
    team: offense
    at:
      - 15
      - 55
    color: '#ff9690'
    name: 四分卫 QB
    label:
      zh: 四分卫位置参照
      en: QB
      description: 本图 QB 位于开球线后方 5 码、场地横向中间，帮助辨认接球手相对 QB 的方向；这是教学站位，不要求比赛中 QB 必须这样站或保持不动。
      basis: author
      note: 为比较基础路线新增的教学站位，不是原 PDF 规定的 QB 位置。
    motion:
      type: still
      note: 教学参照：保持图标原位，不演示真实 QB 的后撤、传球或跑动。
    coaching:
      cooperation: 观察 X 是向中间、边线还是深处移动；传球路线与传球时刻未在此图规定。
      timing: 图标全程静止仅为定位参照，不表示真实比赛中的启动顺序。
timeline:
  duration: 10
  basis: illustration
  note: 动画总长 10 秒，仅展示动作先后；图形和距离刻度按码数绘制，播放秒数不是实跑用时，不能用秒数换算码数。QB 静止只是位置参照。
keyframes:
  - id: start
    at: 0
    label: 起始站位
    cue: 从开球线的 0 码开始看：X 在左侧，QB 在后方 5 码的中间。上方是进攻方向，“内”指场地中间。
  - id: post
    at: 3
    label: 7 码先做 Post
    cue: 直跑 7 码后先斜向场地中间；这个首次变向深度来自官方示例。
  - id: corner
    at: 6
    label: 10 码深度做 Corner
    cue: 本图在开球线前 10 码深度再次变向，斜向外；这个第二次变向深度是教学设置。
  - id: end
    at: 10
    label: 动作完成
    cue: 说出 POST CORNER，按「先直跑，斜进，再斜出。」用手指画一遍。
notes:
  - 全场按码数比例绘制：30 码宽、70 码长，含两端各 10 码端区。X 从左侧开球线起跑，QB 在后方 5 码作参照；这不是完整五人阵型。
  - QB 的静止站位只是教学参照；这里不演示开球、传球、后撤步或防守。距离标签标明官方示例或教学设置；真实路线深度、传球时机和练习距离由教练与 QB 约定。
translations:
  en:
    summary: >-
      POST CORNER · In this example, run 7 yards and cut inside like Post, then make the second cut
      outside like Corner at a depth of 10 yards.
    title.zh: 8 · POST CORNER
    source.title: NFL FLAG route lesson · PDF names and official explanations
    source.note: >-
      Names and original numbering are retained from the PDF; route explanations are supplemented
      from NFL FLAG. The diagram is redrawn in yards on a 30 × 70-yard field, including two 10-yard
      end zones; depths are measured from the line of scrimmage. The first cut uses the route tree’s
      7-yard example. The second cut at 10-yard depth and the remaining length are drawing choices;
      the guide does not specify them. QB placement and animation duration are teaching choices, not
      a PDF tracing, official game timing or prescribed throw time.
    source.references.0.title: NFL FLAG · Route tree guide
    source.references.0.locator: POST CORNER
    source.references.0.note: >-
      Checked against both the text and the 6–9 route diagram: a 7-yard stem, inside angle and then
      outside angle. The second cut depth is not prescribed.
    notes.0: >-
      The field is drawn to yard scale: 30 yards wide and 70 long, including two 10-yard end zones.
      X starts on the left of the line, with QB 5 yards behind as a reference; this is not a full
      five-player formation.
    notes.1: >-
      The stationary QB is a teaching reference; snaps, passes, dropbacks and defense are not
      animated. Distance labels distinguish official examples from teaching choices. Agree on actual
      route depths, passing timing and practice distances with your coach and QB.
    teaching.goal: >-
      In this example, run 7 yards and cut inside like Post, then make the second cut outside like
      Corner at a depth of 10 yards.
    teaching.cooperation: >-
      Move from ahead and left of the QB toward the middle, then angle to the deep outside. Both
      cuts belong to one route, not two separate passes.
    teaching.cue: Straight, angle in, angle out.
    teaching.question: Which route does the first cut resemble? And the second cut?
    players.X.name: Receiver X
    players.X.label.zh: POST CORNER
    players.X.label.description: >-
      In this example, run 7 yards and cut inside like Post, then make the second cut outside like
      Corner at a depth of 10 yards.
    players.X.label.note: >-
      The straight-inside-outside sequence has been checked against the NFL FLAG image and text. The
      first 7-yard stem comes from the text; the second cut at 10-yard depth and remaining length
      are teaching choices. A defender stopping does not require the receiver to pause.
    players.X.coaching.cooperation: >-
      Move from ahead and left of the QB toward the middle, then angle to the deep outside. Both
      cuts belong to one route, not two separate passes.
    players.X.coaching.timing: >-
      The demonstration runs from 0 to 10 seconds. Keyframes mark movement changes; they do not
      prescribe a delay after the snap.
    players.QB.name: Quarterback QB
    players.QB.label.zh: Quarterback reference
    players.QB.label.description: >-
      QB is drawn 5 yards behind the line at the field’s horizontal center to show relative
      direction. This is a teaching position, not a required game stance or instruction to stand
      still.
    players.QB.label.note: An added reference position for comparing routes, not a QB position prescribed by the PDF.
    players.QB.motion.note: 'Teaching reference: keep the marker fixed; actual QB dropbacks, passes and runs are not shown.'
    players.QB.coaching.cooperation: >-
      Watch whether X moves toward the middle, sideline or deeper upfield. Pass trajectory and
      release time are not specified.
    players.QB.coaching.timing: >-
      The marker stays fixed only as a positional reference, not to specify real-game movement
      order.
    timeline.note: >-
      The ten-second animation only shows movement order. Geometry and depth marks use yards;
      playback seconds are not real running time and cannot be converted into yardage. QB stays
      still as a positional reference.
    keyframes.start.label: Starting positions
    keyframes.start.cue: >-
      Start at zero on the line of scrimmage: X is on the left and QB is centered 5 yards behind.
      Attack goes upward; inside means toward the field center.
    keyframes.post.label: Post at 7 yd
    keyframes.post.cue: >-
      After a 7-yard stem, angle toward the middle. This first-cut depth comes from the official
      example.
    keyframes.corner.label: Corner at 10 yd depth
    keyframes.corner.cue: >-
      This drawing makes the second cut outside at 10-yard depth beyond the line; that depth is a
      teaching choice.
    keyframes.end.label: Route complete
    keyframes.end.cue: 'Say POST CORNER, then trace the route: “Straight, angle in, angle out.”'
    source.references.1.title: NFL FLAG · Field dimensions
    source.references.1.locator: Flag Football Field
    source.references.1.note: >-
      The field is 30 yards wide and 70 yards long, including two 10-yard end zones. The illustrated
      line of scrimmage and QB position are teaching choices.
    routeGuide.note: >-
      Depth is measured from the line of scrimmage. The first cut uses the route tree’s 7-yard
      example. The second cut at 10-yard depth and the remaining length are drawing choices; the
      guide does not specify them. Other remaining lengths and QB’s position 5 yards behind the line
      are teaching choices; agree on practice distances with your coach and QB.
    routeGuide.marks.post.label: Inside cut at 7 yd
    routeGuide.marks.post.note: The official route tree begins with a 7-yard stem followed by a Post-like inside cut.
    routeGuide.marks.corner.label: Outside at 10 yd depth
    routeGuide.marks.corner.note: >-
      The second cut at 10-yard depth is a teaching choice. The source describes the outside cut
      without specifying its depth.
    source.references.2.title: NFL FLAG · Official route diagram (6–9)
    source.references.2.locator: 8 · POST CORNER
    source.references.2.note: >-
      Verifies the inside-then-outside double move. The diagram does not prescribe the second cut
      depth; this drawing uses 10 yards as a teaching choice.
    source.references.0.publisher: NFL FLAG
    source.references.0.scope: The route’s name, direction or diagram; distance choices are identified separately.
    source.references.1.publisher: NFL FLAG
    source.references.1.scope: Rules or field context only, not the source of this play diagram.
    source.references.2.publisher: NFL FLAG
    source.references.2.scope: The route’s name, direction or diagram; distance choices are identified separately.
    source.adaptation: >-
      Routes are redrawn in yards. Distances, return points and playback seconds not specified by
      the source are teaching choices, identified in the distance notes.
routeGuide:
  player: X
  note: >-
    距离从开球线计算。首次变向的 7 码采用官方路线树示例；第二次变向设在 10 码深度及后段长度均为本图选择，官方未指定。其余后段长度及 QB 在开球线后 5
    码的站位是教学设置；具体练习距离与教练、QB 约定。
  marks:
    - id: post
      step: 0
      label: 7 码先内斜切
      basis: source-example
      note: 官方路线树明确先直跑 7 码，再做 Post 的内斜切。
      sourceReference: 0
    - id: corner
      step: 1
      label: 10 码深度外斜切
      basis: illustration
      note: 第二次变向设在开球线前 10 码深度是本图的教学选择，官方只说明再向外，不给此点码数。
