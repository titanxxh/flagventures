title:
  zh: 密集阵型 · 第 3 号战术
  en: BUNCH PLAY 3
summary: X、Y 跑较深 Corner，中锋与 Z 跑短 Out，形成两深两浅的选择。
teaching:
  goal: 用两条较深路线帮助两条短路线。
  cooperation: X、Y 尝试把防守带深，C、Z 在较浅处向边线接应。
  cue: 我和队友跑出不同的深浅。
  question: 哪两人跑得较深？哪两人负责短接应？
