      Name follows the official NFL FLAG explanation (0:26–0:53); direction and geometry retain the
      supplied diagram on page 35.
    players.C.coaching.cooperation: Run a Corner as X and Y spread wide and deep.
    players.C.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.X.label.zh: Out
    players.X.label.description: >-
      Move diagonally forward-right, then forward, then across to the right. Left and right refer to
