# Editable bilingual lesson; source links and teaching adaptations travel with the data.
format: flag-lesson
version: 1
id: i-formation-play-1
kind: offense
title:
  zh: I 字阵型 · 第 1 号战术
  en: I FORMATION PLAY 1
summary: 从 QB 身后的一列站位分向展开，尝试给中间的 Hitch 接应腾出区域。
teaching:
  goal: 从同一起始方向跑向不同区域。
  cooperation: X 向外、Y 跑深、C 跑 Corner；Z 的短 Hitch 提供中间接应。
  cue: 排成一列出发，各自跑向自己的地方。
  question: 谁留在较浅的中间接应，谁把路线拉向外侧和深处？
source:
  title: NFL FLAG Play Book · 英文原书（封面 2020）
  page: 35
  note: 跑位坐标来自用户附件，归一化后重绘，非实际码数；路线称呼与配合讲解补充自 NFL FLAG 官网和视频。儿童口令、提问与播放节奏为教学改写。
  references:
    - title: NFL FLAG · I Formation 战术说明
      url: https://nflflag.com/coaches/flag-football-rules/5-on-5-flag-football-playbook
      locator: I Formation · Play 1
      note: 官网的战术意图和相对先后建议；不作为精确秒表。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 对应战术的原作者讲解；不包含完整传球结局或精确秒数。
    - title: NFL FLAG · I Formation 视频
      url: https://www.youtube.com/watch?v=g3kzV_LaE7I&t=26s
      locator: 0:26–0:53
      note: 时间用于定位解说；逐人讲述不表示逐人启动。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 对应战术的原作者讲解；不包含完整传球结局或精确秒数。
    - url: >-
        https://nflstatic.s3.amazonaws.com/attachments/ckmqis77f02hv0jo0uvaxh5qq-nfl-flag-play-book-formations-prd-2.pdf#page=35
      role: primary
      kind: diagram
      title: NFL FLAG · 原始战术图
