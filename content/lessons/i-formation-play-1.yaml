    players.X.coaching.cooperation: Run an Out to help draw coverage away from the middle.
    players.X.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.Y.label.zh: Fly
    players.Y.label.description: Move diagonally forward-left, then forward. Left and right refer to the diagram.
    players.Y.label.note: >-
      Name follows the official NFL FLAG explanation (0:26–0:53); direction and geometry retain the
