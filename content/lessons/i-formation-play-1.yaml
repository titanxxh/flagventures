      locator: PDF 第 35 页 · I FORMATION PLAY 1
      scope: 原始站位与路线图；图中未注明的球权、先后与秒数不由此推断。
      note: 封面标 2020、文件制作元数据为 2021；已逐图对照用户双语附件的同页站位与线路。两文件的翻译、颜色和版面不同，不称为相同的 2024 版本。
