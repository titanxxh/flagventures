timeline:
  duration: 10
  basis: illustration
  note: 有路线的球员从 0 秒展开，各用 10 秒走完已画路径；这是读图教学节奏，不是来源规定的统一跑速、启动先后或传球时刻。视频逐人讲解的顺序不作为启动顺序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。Z 的内切尝试给右侧 Y 腾出区域；X、C 的交叉提供另一组短传选择。
  - id: spread
    at: 2.5
    label: 展开 · 看方向
    cue: 先看 X、C 的交叉，再找出后场 Y 的方向。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 跟踪 Z 转向内侧的位置，对比 Y 的右侧接应。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: Z 转向中间后，谁从后场跑向右侧？
notes:
  - 跑位与可选球路都是教学演示，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p9 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
translations:
  en:
    title.zh: SINGLE BACK PLAY 3
    summary: Z cuts inside after running deeper, helping Y find space on the right. X and C cross on shorter routes.
    teaching.goal: Find short passes through crossing and depth.
    teaching.cooperation: Z cuts inside after running deeper, helping Y find space on the right. X and C cross on shorter routes.
    teaching.cue: Remember where you go when your teammate turns.
    teaching.question: Who comes out of the backfield toward the right after Z turns inside?
    source.title: NFL FLAG Play Book · English source (2020 cover)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork explanations also use NFL
      FLAG’s official article and videos. Child-friendly cues, questions and animation timing are teaching adaptations.
    source.references.0.title: NFL FLAG · Single Back play explanations
    source.references.0.locator: Single Back · Play 3
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
    source.references.1.title: NFL FLAG · Single Back video
    source.references.1.locator: 1:25–1:55
    source.references.1.note: Timestamps locate the narration; its order does not define player start order.
    timeline.note: >-
      Shown routes start together and finish in ten demonstration seconds. Timing follows each individual route and is
      illustrative, not official start order, equal player speeds or handoff timing.
    notes.0: >-
      Routes and selectable ball-flow scenarios are teaching demonstrations without simulated defenders. Creating space
      is the play’s intent, not a guaranteed outcome.
    notes.1: The cues and questions are teaching adaptations. Agree on crossing order before practicing on the field.
    notes.2: >-
      Relative positions follow source page 9. Short connections approximate parts hidden beneath markers; they are not
      extra actions or measured yards.
    notes.3: No complete QB read order, mandatory target or pass timing is specified. Crossing routes do not imply a handoff.
    players.Q.label.zh: Movement not specified
    players.Q.label.description: Only Q’s starting position is shown. Later movement is not specified.
    players.Q.coaching.cooperation: Observe the receiving areas offered by teammates. No fixed read order or mandatory target is specified.
    players.Q.coaching.timing: The diagram does not specify Q’s later movement or when to pass.
    players.Q.motion.note: Only the known starting position is shown. Later movement is unspecified; this does not require standing still.
    players.C.label.zh: Out
    players.C.label.description: Move forward, then across to the left. Left and right refer to the diagram.
    players.C.label.note: >-
      Name follows the official NFL FLAG explanation (1:25–1:55); direction and geometry retain the supplied diagram on
      page 9.
    players.C.coaching.cooperation: Run a short Out across X's In.
    players.C.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.X.label.zh: In
    players.X.label.description: >-
      Move diagonally forward-right, then across to the right, then diagonally forward-right. Left and right refer to
      the diagram.
    players.X.label.note: >-
      Name follows the official NFL FLAG explanation (1:25–1:55); direction and geometry retain the supplied diagram on
      page 9.
    players.X.coaching.cooperation: Run an In, crossing with C to offer a short option.
    players.X.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.Y.label.zh: Slant
    players.Y.label.description: Move across to the right, then diagonally forward-right. Left and right refer to the diagram.
    players.Y.label.note: >-
      Name follows the official NFL FLAG explanation (1:25–1:55); direction and geometry retain the supplied diagram on
      page 9.
    players.Y.coaching.cooperation: Run a dragging Slant to the right, using space Z may leave.
    players.Y.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.Z.label.zh: In
    players.Z.label.description: Move forward, then across to the left. Left and right refer to the diagram.
    players.Z.label.note: >-
      Name follows the official NFL FLAG explanation (1:25–1:55); direction and geometry retain the supplied diagram on
      page 9.
    players.Z.coaching.cooperation: Run deeper before cutting In to draw coverage away from Y's right-side route.
    players.Z.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    keyframes.start.label: Line up · Find teammates
    keyframes.start.cue: >-
      Find Q, C, X, Y and Z. Z cuts inside after running deeper, helping Y find space on the right. X and C cross on
      shorter routes.
    keyframes.spread.label: Watch the routes
    keyframes.spread.cue: Pause and compare teammates’ routes. Who comes out of the backfield toward the right after Z turns inside?
    keyframes.middle.label: Pause · See the teamwork
    keyframes.middle.cue: Pause and compare teammates’ routes. Who comes out of the backfield toward the right after Z turns inside?
    keyframes.end.label: Recall · Explain it
    keyframes.end.cue: Who comes out of the backfield toward the right after Z turns inside?
    ball.note: >-
      These added teaching scenarios let you pass to C, X, Y or Z; they do not prescribe a unique official target or QB
      read order. The ball leaves C at zero and reaches QB at 0.35 seconds; C may run after releasing it. QB stays at
      the drawn position in this example. Release, flight and catch times are animation settings, not game time. After
      catching, the receiver follows the existing route without an invented continuation.
    ball.scenarios.pass-c.title: Pass to C
    ball.scenarios.pass-c.note: >-
      This example selects C to catch while continuing after the break; it does not evaluate defenders or guarantee an
      opening. Release at 4.5 seconds and catch at 5.2 seconds are teaching timings. The receiver then continues the
      existing route.
    ball.scenarios.pass-c.motions.Q.motion.note: >-
      For this ball-flow example, QB holds and throws from the drawn position. The source does not prescribe dropback
      steps; a real QB need not stand still.
    ball.scenarios.pass-c.events.snap.label: C snaps to QB
    ball.scenarios.pass-c.events.snap.cue: >-
      Follow the ball from C to QB. It leaves C at zero, so C may run after the release. The 0.35-second exchange is an
      animation setting.
    ball.scenarios.pass-c.events.pass.label: QB passes to C
    ball.scenarios.pass-c.events.pass.cue: >-
      QB leads C to the future catch position. C catches while continuing after the break, then continues the existing
      route. Passing to C is this teaching choice, not the only answer.
