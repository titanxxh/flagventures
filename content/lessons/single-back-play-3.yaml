teaching:
  goal: 通过交叉与深浅配合寻找短传机会。
  cooperation: Z 的内切尝试给右侧 Y 腾出区域；X、C 的交叉提供另一组短传选择。
  cue: 看见队友换方向，记住自己要去的空地方。
  question: Z 转向中间后，谁从后场跑向右侧？
