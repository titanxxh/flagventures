    players.Z.coaching.cooperation: Continue the route without the ball; this pump fake has no actual receiving target.
    players.Z.coaching.timing: >-
      The selected teaching scenario defines both exchange times and movement. Source routes remain
      available in route-only view.
    ball.scenarios.y-pump-and-run.events.snap.endLabel: Q receives the snap
    ball.scenarios.y-pump-and-run.events.snap.endCue: Q has received C’s snap and now holds the ball, ready for the backfield exchange.
    ball.scenarios.y-pump-and-run.events.pump-fake.endLabel: Pump fake complete; Y keeps
    ball.scenarios.y-pump-and-run.events.pump-fake.endCue: >-
      The pump fake is complete. Possession has not changed: Y still holds the ball. Follow the
      carrier and off-ball teammates as they move on.
    ball.scenarios.y-pump-and-run.motions.Q.motion.note: >-
      Start right and backward; this teaching scenario arranges movement around its meeting and
      catch points. At 0.35 seconds, receive the snap. At 2 seconds, hand off to Y in the backfield
      and continue without the ball. The final leg goes left and upfield and stays behind the line.
    ball.scenarios.y-pump-and-run.motions.C.motion.note: >-
      Movement starts after the snap. This example retains the shape of this player’s source route
      and adjusts pacing to the 12-second teaching timeline. At 0 seconds, snap to Q.
    ball.scenarios.y-pump-and-run.motions.X.motion.note: >-
      Movement starts after the snap. This example retains the shape of this player’s source route
      and adjusts pacing to the 12-second teaching timeline.
    ball.scenarios.y-pump-and-run.motions.Y.motion.note: >-
      Start right and backward; this teaching scenario arranges movement around its meeting and
      catch points. At 2 seconds, take Q’s backfield handoff and become the carrier. From 4 to 4.5
      seconds, pause to pump-fake without releasing, then continue carrying. The final leg goes
      right and upfield and finishes beyond the line.
    ball.scenarios.y-pump-and-run.motions.Z.motion.note: >-
      Movement starts after the snap. This example retains the shape of this player’s source route
      and adjusts pacing to the 12-second teaching timeline.
