timeline:
  duration: 10
  basis: illustration
  note: 已画出路线的球员在 0 秒同时开始、各用 10 秒走完。这只是读图教学节奏，不是原书规定的启动先后、跑速或交接球时序。
keyframes:
  - id: start
    at: 0
    label: 起始站位
    cue: 找到 X 的起点，用手指从起点沿路线慢慢往前画。
  - id: early
    at: 2.5
    label: 观察前段
    cue: 沿每个人已画出的路径看方向；没有路线的人后续动作未知。
  - id: middle
    at: 5.5
    label: 观察中段
    cue: 停住，比较你关注的人和队友分别在哪里。
  - id: end
    at: 10
    label: 路线终点
    cue: 说出「CHAIR」，再不用动画，用手指画一遍这条路线。
notes:
  - 这是原路线树中这一条路径的单独展示；保持原图方向和相对位置，没有按标准距离重画。
translations:
  en:
    title.zh: CHAIR
    summary: CHAIR · Run forward, cut outside, then run forward again, making a chair-like shape.
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Based on the supplied PDF. The Chinese study translation is unofficial; drawing coordinates are not
      actual yards.
    timeline.note: >-
      Shown routes start together and finish in ten demonstration seconds. Timing follows each individual
      route and is illustrative, not official start order, equal player speeds or handoff timing.
    notes.0: >-
      This isolates one route from the route tree, preserving its direction and relative position without
      imposing standard distances.
    players.X.label.zh: CHAIR
    players.X.label.description: Run forward, cut outside, then run forward again, making a chair-like shape.
    players.X.label.note: The English route name is printed in the source. X is an added demonstration-player ID.
    keyframes.start.label: Starting positions
    keyframes.start.cue: Find X’s start and trace the route with a finger.
    keyframes.early.label: Early movement
    keyframes.early.cue: Follow the direction of the first part of the route.
    keyframes.middle.label: Mid-route check
    keyframes.middle.cue: Pause and point to the next part of the route.
    keyframes.end.label: Route endpoints
    keyframes.end.cue: Say “CHAIR”, then draw the route with your finger without watching the animation.
