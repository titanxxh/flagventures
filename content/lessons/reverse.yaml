    players.Z.coaching.timing: >-
      The selected teaching scenario defines both exchange times and movement. Source routes remain
      available in route-only view.
    ball.scenarios.give-to-z.events.snap.endLabel: Q receives the snap
    ball.scenarios.give-to-z.events.snap.endCue: Q has received C’s snap and now holds the ball, ready for the backfield exchange.
    ball.scenarios.give-to-z.motions.Q.motion.note: >-
      Start right and backward; this teaching scenario arranges movement around its meeting and
      catch points. At 0.35 seconds, receive the snap. At 2 seconds, hand off to Z in the backfield
      and continue without the ball. The final leg goes left and upfield and stays behind the line.
    ball.scenarios.give-to-z.motions.C.motion.note: >-
      Movement starts after the snap. This example retains the shape of this player’s source route
      and adjusts pacing to the 12-second teaching timeline. At 0 seconds, snap to Q.
    ball.scenarios.give-to-z.motions.X.motion.note: >-
      Movement starts after the snap. This example retains the shape of this player’s source route
      and adjusts pacing to the 12-second teaching timeline.
    ball.scenarios.give-to-z.motions.Y.motion.note: >-
      Movement starts after the snap. This example retains the shape of this player’s source route
