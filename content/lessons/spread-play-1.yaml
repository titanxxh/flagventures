id: spread-play-1
kind: offense
title:
  zh: 分散阵型 · 第 1 号战术
  en: SPREAD PLAY 1
summary: Z 深跑，Y 与中锋向右侧展开，X 的 Post 保留另一条较深路线。
teaching:
  goal: 在右侧安排深浅接球点。
  cooperation: Z 把右侧路线拉深，C、Y 向侧面接应；X 在另一侧提供 Post 选择。
  cue: 有人跑远，有人跑近，我们分开接应。
  question: 右侧哪两个人的路线比 Z 更浅？
source:
