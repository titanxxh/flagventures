timeline:
  duration: 10
  basis: illustration
  note: 有路线的球员从 0 秒展开，各用 10 秒走完已画路径；这是读图教学节奏，不是来源规定的统一跑速、启动先后或传球时刻。视频逐人讲解的顺序不作为启动顺序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。Z 把右侧路线拉深，C、Y 向侧面接应；X 在另一侧提供 Post 选择。
  - id: spread
    at: 2.5
    label: 展开 · 看方向
    cue: 找出右侧 C、Y、Z 的三条方向，再看左侧 X。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 比较 Z 的深跑与 C、Y 的侧向接应，谁更靠近开球线？
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 右侧哪两个人的路线比 Z 更浅？
notes:
  - 跑位与可选球路都是教学演示，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p11 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
translations:
  en:
    title.zh: SPREAD PLAY 1
    summary: >-
      Z stretches the right side deep; Y and C work shorter routes on that side. X offers a Post on
      the other side.
    teaching.goal: Combine right-side options with an opposite-side outlet.
    teaching.cooperation: >-
      Z stretches the right side deep; Y and C work shorter routes on that side. X offers a Post on
      the other side.
    teaching.cue: We spread out at different depths.
    teaching.question: Who runs deep on the right, and who offers a shorter option?
    source.title: NFL FLAG Play Book · English source (2020 cover)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork
      explanations also use NFL FLAG’s official article and videos. Child-friendly cues, questions
      and animation timing are teaching adaptations.
    source.references.0.title: NFL FLAG · Spread play explanations
    source.references.0.locator: Spread · Play 1
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
    source.references.1.title: NFL FLAG · Spread video
    source.references.1.locator: 0:21–0:43
    source.references.1.note: Timestamps locate the narration; its order does not define player start order.
    timeline.note: >-
      Shown routes start together and finish in ten demonstration seconds. Timing follows each
      individual route and is illustrative, not official start order, equal player speeds or handoff
      timing.
    notes.0: >-
      Routes and selectable ball-flow scenarios are teaching demonstrations without simulated
      defenders. Creating space is the play’s intent, not a guaranteed outcome.
    notes.1: >-
      The cues and questions are teaching adaptations. Agree on crossing order before practicing on
      the field.
    notes.2: >-
      Relative positions follow source page 11. Short connections approximate parts hidden beneath
      markers; they are not extra actions or measured yards.
    notes.3: >-
      No complete QB read order, mandatory target or pass timing is specified. Crossing routes do
      not imply a handoff.
    players.Q.label.zh: Movement not specified
    players.Q.label.description: Only Q’s starting position is shown. Later movement is not specified.
    players.Q.coaching.cooperation: >-
      Observe the receiving areas offered by teammates. No fixed read order or mandatory target is
      specified.
    players.Q.coaching.timing: The diagram does not specify Q’s later movement or when to pass.
    players.Q.motion.note: >-
      Only the known starting position is shown. Later movement is unspecified; this does not
      require standing still.
    players.C.label.zh: Move diagonally forward-right, then across to the right
    players.C.label.description: Move diagonally forward-right, then across to the right. Left and right refer to the diagram.
    players.C.label.note: Based on the diagram on page 11; later movement is not implied.
    players.C.coaching.cooperation: Break right to offer a shorter option alongside Y.
    players.C.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.X.label.zh: Post
    players.X.label.description: Move forward, then diagonally forward-right. Left and right refer to the diagram.
    players.X.label.note: >-
      Name follows the official NFL FLAG explanation (0:21–0:43); direction and geometry retain the
      supplied diagram on page 11.
    players.X.coaching.cooperation: Run a Post as an option away from the right-side routes.
    players.X.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.Y.label.zh: Option
    players.Y.label.description: >-
      Move forward, then diagonally forward-left, then diagonally forward-right, then across to the
      right. Left and right refer to the diagram.
    players.Y.label.note: >-
      Name follows the official NFL FLAG explanation (0:21–0:43); direction and geometry retain the
      supplied diagram on page 11.
    players.Y.coaching.cooperation: Run an Option to the right, working underneath Z.
    players.Y.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.Z.label.zh: Fly
    players.Z.label.description: Move diagonally forward-right, then forward. Left and right refer to the diagram.
    players.Z.label.note: >-
      Name follows the official NFL FLAG explanation (0:21–0:43); direction and geometry retain the
      supplied diagram on page 11.
    players.Z.coaching.cooperation: Juke and run a deep Fly to stretch the right side.
    players.Z.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    keyframes.start.label: Line up · Find teammates
    keyframes.start.cue: >-
      Find Q, C, X, Y and Z. Z stretches the right side deep; Y and C work shorter routes on that
      side. X offers a Post on the other side.
    keyframes.spread.label: Watch the routes
    keyframes.spread.cue: >-
