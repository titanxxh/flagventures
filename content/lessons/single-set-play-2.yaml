  en: SINGLE SET PLAY 2
summary: Z 跑最深 Fly，中锋跑中距离 Corner，X、Y 在较浅处横向接应。
teaching:
  goal: 把四条路线安排在不同深度。
  cooperation: Z 拉深，C 居中，Y 跑短 Out；X 从 Slant 转向 Out，为 Q 增加横向选择。
  cue: 远、中、近，记住自己在哪一层。
  question: 谁跑得最深？谁提供中间距离的接应？
