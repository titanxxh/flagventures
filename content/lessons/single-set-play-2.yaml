ball:
  initialOwner: C
  defaultScenario: pass-x
  note: >-
    球路是本应用补充的教学示例，可分别选择传给 C、X、Y、Z；不代表官网规定唯一目标或 QB 阅读顺序。球在 0 秒离开 C，0.35 秒到达 QB；C 可在出球后跑动。QB
    本次保留图示站位。出手、飞行和接球秒数仅为慢放编排，不是比赛用时；接球后沿已有路线继续，不补画额外跑动。
  scenarios:
    - id: pass-c
      title: 传给 C
      basis: illustration
      note: 本次示范选择 C，在他变向后仍在跑动时接球；没有判断防守或保证空位。第 5.33 秒出手、第 6.03 秒接球仅为教学节奏，接球后继续原路线。
      motions:
        - player: Q
          motion:
            type: still
            note: 本次球路示例让 QB 保留原图站位持球、传球；原资料未指定后撤步，静止不代表真实比赛必须站住。
      events:
        - id: snap
          type: snap
          from: C
          to: Q
          at: 0
          endAt: 0.35
          label: C 开球给 QB
          cue: 先看球从 C 送到 QB；球在 0 秒已离开 C，C 可在出球后起跑。0.35 秒只是演示时间。
          endLabel: QB 接到开球
          endCue: QB 现在接到球并持球观察；刚才出球后，C 已可以按本战术的跑动安排行动。
        - id: pass
          type: pass
          from: Q
          to: C
          at: 5.33
          endAt: 6.03
          label: QB 传给 C
          cue: QB 提前把球送向 C 即将到达的位置；C 在变向后仍在跑动时接住后继续原路线。本次传给 C 是教学选择，不是唯一答案。
          endLabel: C 接到球
          endCue: C 在变向后仍在跑动时接到球，接下来带球沿已有路线继续；本次不补画新的接球后路线。
    - id: pass-x
      title: 传给 X
      basis: illustration
      note: 本次示范选择 X，在他变向后仍在跑动时接球；没有判断防守或保证空位。第 5.78 秒出手、第 6.48 秒接球仅为教学节奏，接球后继续原路线。
      motions:
        - player: Q
          motion:
            type: still
            note: 本次球路示例让 QB 保留原图站位持球、传球；原资料未指定后撤步，静止不代表真实比赛必须站住。
      events:
        - id: snap
          type: snap
          from: C
          to: Q
          at: 0
          endAt: 0.35
          label: C 开球给 QB
