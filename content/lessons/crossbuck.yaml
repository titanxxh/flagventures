    ball.scenarios.give-to-y.title: Fake to Z, give to Y
    ball.scenarios.give-to-y.note: >-
      This example gives the real handoff to Y; Z fakes receiving and runs on. Crossing routes do
      not mean both players get the ball. This possession sequence, meeting points, pacing and
      running extensions are teaching choices, not a sequence prescribed by the PDF. Real and fake
      handoffs occur behind the line; seconds are for explanation.
    ball.scenarios.give-to-y.events.snap.label: C snaps to Q
    ball.scenarios.give-to-y.events.snap.cue: C snaps backward to Q, who then begins this handoff sequence.
    ball.scenarios.give-to-y.events.fake-q-z.label: Q fakes to Z; no transfer
    ball.scenarios.give-to-y.events.fake-q-z.cue: Q meets Z for a fake handoff. Q keeps possession while Z runs on as a decoy.
    ball.scenarios.give-to-y.events.handoff-q-y.label: Q hands off to Y
    ball.scenarios.give-to-y.events.handoff-q-y.cue: Q and Y meet behind the line. A direct handoff transfers possession to Y.
    ball.scenarios.give-to-z.title: Fake to Y, give to Z
    ball.scenarios.give-to-z.note: >-
      This example gives the real handoff to Z; Y fakes receiving and runs on. Crossing routes do
      not mean both players get the ball. This possession sequence, meeting points, pacing and
      running extensions are teaching choices, not a sequence prescribed by the PDF. Real and fake
      handoffs occur behind the line; seconds are for explanation.
    ball.scenarios.give-to-z.events.snap.label: C snaps to Q
    ball.scenarios.give-to-z.events.snap.cue: C snaps backward to Q, who then begins this handoff sequence.
    ball.scenarios.give-to-z.events.fake-q-y.label: Q fakes to Y; no transfer
    ball.scenarios.give-to-z.events.fake-q-y.cue: Q meets Y for a fake handoff. Q keeps possession while Y runs on as a decoy.
    ball.scenarios.give-to-z.events.handoff-q-z.label: Q hands off to Z
    ball.scenarios.give-to-z.events.handoff-q-z.cue: Q and Z meet behind the line. A direct handoff transfers possession to Z.
    ball.note: >-
      This possession sequence, meeting points, pacing and running extensions are teaching choices,
      not a sequence prescribed by the PDF. Real and fake handoffs occur behind the line; seconds
      are for explanation. The source routes are retained; ball mode uses the selected teaching
      scenario.
    teaching.goal: >-
      Choose a real handoff to Y or Z; the other player fakes receiving while the actual carrier
      advances.
    teaching.cooperation: >-
      Watch the snap and backfield meetings. Only real handoffs and completed catches change
      possession. Off-ball teammates follow their routes without blocking.
    teaching.cue: Find the ball. A real transfer changes hands; a fake keeps it.
    teaching.question: Was that a real transfer or a fake? Who has the ball now, and who is helping?
    source.references.0.title: NFL FLAG · Handoff and fake-handoff drills
    source.references.0.locator: Handoff and fake-handoff technique
