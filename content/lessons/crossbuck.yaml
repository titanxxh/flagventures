    players.Y.label.zh: Run diagonally forward-left from the backfield.
    players.Y.label.description: Run diagonally forward-left from the backfield.
    players.Y.label.note: >-
      Describes this player’s drawn path; it does not infer the ball carrier, fake or real handoffs,
