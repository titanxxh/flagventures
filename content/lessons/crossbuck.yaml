ball:
  initialOwner: C
  defaultScenario: give-to-y
  note: 本次交接顺序、会合点、配速及持球后延伸均为教学编排，原 PDF 未逐步规定这些动作。手递手和假交接都在开球线后发生，秒数只供讲解。 原图路线保留；开启球路时按所选情形演示配合。
  scenarios:
    - id: give-to-y
