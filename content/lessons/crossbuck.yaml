# Editable bilingual lesson; source links and teaching adaptations travel with the data.
format: flag-lesson
version: 1
id: crossbuck
kind: run
title:
  zh: 交叉跑
  en: CROSSBUCK
summary: 家长选择真交给 Y 或 Z；另一人做假接球，实际持球人沿选定方向跑进。
source:
  title: NFL FLAG Play Book · 英文原书（封面 2020）
  page: 48
  note: 以用户附件为依据；中文为非官方学习译文。坐标归一化重绘，不是实际码数。 原图没有完整球权链；本次新增的球权顺序、会合点和球员配速是明确标注的教学改编，来源图线本身保留。
  references:
    - title: NFL FLAG · 交接与假交接训练
      url: https://nflflag.com/coaches/football-drills/running-back-drills
      locator: 交接与假交接
      note: 支持交接和假交接的通用动作概念，不确定本页的持球顺序或秒数。
      role: supporting
      kind: training
      publisher: NFL FLAG
      scope: 支持个别动作或术语对照，不支持整套战术的跑位与球权链。
    - title: NFL FLAG · 当前规则说明
      url: https://nflflag.com/coaches/flag-football-rules
      locator: 开球、后场交接与初始 QB
      note: 核对后场交接与初始接开球球员不能直接持球越线；本图配速不是比赛计时，实际训练按球队适用规则。
      role: supporting
      kind: rules
      publisher: NFL FLAG
      scope: 辅助理解规则或场地，不作为本条战术的原图出处。
    - url: >-
        https://nflstatic.s3.amazonaws.com/attachments/ckmqis77f02hv0jo0uvaxh5qq-nfl-flag-play-book-formations-prd-2.pdf#page=48
      role: primary
      kind: diagram
      title: NFL FLAG · 原始战术图
      publisher: NFL FLAG
      locator: PDF 第 48 页 · CROSSBUCK
      scope: 原始站位与路线图；图中未注明的球权、先后与秒数不由此推断。
      note: 封面标 2020、文件制作元数据为 2021；已逐图对照用户双语附件的同页站位与线路。两文件的翻译、颜色和版面不同，不称为相同的 2024 版本。
