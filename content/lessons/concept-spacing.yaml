      note: 选择 Y 的接球窗口，其他队友仍跑完整路线。
    - id: pass-z
      basis: illustration
      events:
        - id: snap
          type: snap
          from: C
          to: Q
          at: 0
          endAt: 0.35
          label: C 开球
          endLabel: QB 接到开球
          cue: 球从中锋来到 QB，接手随后展开。
          endCue: QB 已持球；接下来观察队友。
        - id: throw
          type: pass
          from: Q
          to: Z
          at: 7.3
