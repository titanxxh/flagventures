  en: TWINS STACK PLAY 1
summary: X、Y 直上跑 Fly，中锋和 Z 跑短 Out，形成两长两短的接应。
teaching:
  goal: 记住两条长路线与两条短路线。
  cooperation: X、Y 向深处拉开，C、Z 在两侧跑短 Out，给 Q 不同距离的选择。
  cue: 两人跑远，两人跑近，我们都能接应。
  question: 哪两个人跑 Fly？哪两个人跑短 Out？
