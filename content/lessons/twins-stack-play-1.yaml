timeline:
  duration: 10
  basis: illustration
  note: 有路线的球员从 0 秒展开，各用 10 秒走完已画路径；这是读图教学节奏，不是来源规定的统一跑速、启动先后或传球时刻。视频逐人讲解的顺序不作为启动顺序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X、Y 向深处拉开，C、Z 在两侧跑短 Out，给 Q 不同距离的选择。
  - id: spread
    at: 2.5
    label: 展开 · 看方向
    cue: 看 X、Y 沿直上路线前进，再找 C、Z 的外切。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 把四人分为两长两短，指出自己的搭档。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 哪两个人跑 Fly？哪两个人跑短 Out？
notes:
  - 画面只演示进攻路线，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
