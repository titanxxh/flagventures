    keyframes.start.label: Line up · Find teammates
    keyframes.start.cue: >-
      Find Q, C, X, Y and Z. X and Z go deep first on Corners. C and Y start later, crossing on
      short Outs.
    keyframes.release.label: Join later
    keyframes.release.cue: >-
      The delayed players join here; two seconds is a teaching setting. X and Z go deep first on
      Corners. C and Y start later, crossing on short Outs.
    keyframes.middle.label: Pause · See the teamwork
    keyframes.middle.cue: >-
      Pause and compare teammates’ routes. If coverage follows X and Z deep, who provides short
      options?
    keyframes.end.label: Recall · Explain it
    keyframes.end.cue: If coverage follows X and Z deep, who provides short options?
    ball.note: >-
      These added teaching scenarios let you pass to C, X, Y or Z; they do not prescribe a unique
      official target or QB read order. The ball leaves C at zero and reaches QB at 0.35 seconds; C
      may run after releasing it. QB stays at the drawn position in this example. Release, flight
      and catch times are animation settings, not game time. After catching, the receiver follows
      the existing route without an invented continuation.
    ball.scenarios.pass-c.title: Pass to C
    ball.scenarios.pass-c.note: >-
