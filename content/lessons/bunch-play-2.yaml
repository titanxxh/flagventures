timeline:
  duration: 10
  basis: illustration
  note: 官网建议 X、Z 先跑较深路线，C、Y 再短接应。本示范设 X、Z 在 0 秒开始、C、Y 在 2 秒开始，均于 10 秒走完。先后依据来源，具体秒数与跑速为教学设置；未指定传球时刻。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X、Z 向深处和外侧展开；C、Y 延后交叉跑 Out，提供较近的接应。
  - id: release
    at: 2
    label: 稍后加入
    cue: C、Y 从这里加入；2 秒是本演示的教学设置。X、Z 先向两侧深处展开，C、Y 稍后通过交叉区域。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 找到 C 与 Y 的两个短接球区域，比较 X、Z 的深度。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 如果防守跟 X、Z 跑深，哪两人准备短接应？
notes:
  - 画面只演示进攻路线，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p16 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
translations:
  en:
    title.zh: BUNCH PLAY 2
    summary: X and Z go deep first on Corners. C and Y start later, crossing on short Outs.
    teaching.goal: Use two deep routes to help the short crossing pair.
    teaching.cooperation: X and Z go deep first on Corners. C and Y start later, crossing on short Outs.
    teaching.cue: Outside runners go far; the middle pair separates later.
    teaching.question: If coverage follows X and Z deep, who provides short options?
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork explanations also
      use NFL FLAG’s official article and videos. Child-friendly cues, questions and animation timing are
      teaching adaptations.
    source.references.0.title: NFL FLAG · Bunch play explanations
    source.references.0.locator: Bunch · Play 2
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
    source.references.1.title: NFL FLAG · Bunch video
    source.references.1.locator: 0:51–1:10
    source.references.1.note: Timestamps locate the narration; its order does not define player start order.
    timeline.note: >-
      C, Y start after their teammates, following the official explanation. A two-second delay and ten-second
      total are teaching settings, not prescribed game timing or equal running speeds.
    notes.0: >-
      This shows offensive routes without simulating defenders. Creating space is the play’s intent, not a
      guaranteed outcome.
    notes.1: The cues and questions are teaching adaptations. Agree on crossing order before practicing on the field.
    notes.2: >-
      Relative positions follow source page 16. Short connections approximate parts hidden beneath markers;
      they are not extra actions or measured yards.
    notes.3: >-
      No complete QB read order, mandatory target or pass timing is specified. Crossing routes do not imply a
      handoff.
    players.Q.label.zh: Movement not specified
    players.Q.label.description: Only Q’s starting position is shown. Later movement is not specified.
    players.Q.coaching.cooperation: Observe the receiving areas offered by teammates. No fixed read order or mandatory target is specified.
    players.Q.coaching.timing: The diagram does not specify Q’s later movement or when to pass.
    players.Q.motion.note: >-
      Only the known starting position is shown. Later movement is unspecified; this does not require standing
      still.
    players.C.label.zh: Out
    players.C.label.description: Move across to the right, then diagonally forward-right. Left and right refer to the diagram.
    players.C.label.note: >-
      Name follows the official NFL FLAG explanation (0:51–1:10); direction and geometry retain the supplied
      diagram on page 16.
    players.C.coaching.cooperation: Run a short Out right after X and Z start, crossing Y.
    players.C.coaching.timing: Let X, Z spread out first, then join. Starting at two seconds is a teaching setting.
    players.X.label.zh: Corner
    players.X.label.description: Move forward, then diagonally forward-left. Left and right refer to the diagram.
    players.X.label.note: >-
      Name follows the official NFL FLAG explanation (0:51–1:10); direction and geometry retain the supplied
      diagram on page 16.
    players.X.coaching.cooperation: Run a deep Corner first to help C and Y underneath.
    players.X.coaching.timing: Go first, before the delayed teammate(s). Starting at zero seconds is a teaching setting.
    players.Y.label.zh: Out
    players.Y.label.description: >-
      Move forward, then diagonally forward-left, then across to the left. Left and right refer to the
      diagram.
    players.Y.label.note: >-
      Name follows the official NFL FLAG explanation (0:51–1:10); direction and geometry retain the supplied
      diagram on page 16.
    players.Y.coaching.cooperation: Run a short Out left after X and Z start, separating from C.
    players.Y.coaching.timing: Let X, Z spread out first, then join. Starting at two seconds is a teaching setting.
    players.Z.label.zh: Corner
    players.Z.label.description: Move forward, then diagonally forward-right. Left and right refer to the diagram.
    players.Z.label.note: >-
      Name follows the official NFL FLAG explanation (0:51–1:10); direction and geometry retain the supplied
      diagram on page 16.
    players.Z.coaching.cooperation: Run a deep Corner first alongside X.
    players.Z.coaching.timing: Go first, before the delayed teammate(s). Starting at zero seconds is a teaching setting.
    keyframes.start.label: Line up · Find teammates
    keyframes.start.cue: Find Q, C, X, Y and Z. X and Z go deep first on Corners. C and Y start later, crossing on short Outs.
    keyframes.release.label: Join later
    keyframes.release.cue: >-
      The delayed players join here; two seconds is a teaching setting. X and Z go deep first on Corners. C
      and Y start later, crossing on short Outs.
    keyframes.middle.label: Pause · See the teamwork
    keyframes.middle.cue: Pause and compare teammates’ routes. If coverage follows X and Z deep, who provides short options?
    keyframes.end.label: Recall · Explain it
    keyframes.end.cue: If coverage follows X and Z deep, who provides short options?
