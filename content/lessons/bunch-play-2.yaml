      url: https://nflflag.com/coaches/flag-football-rules/5-on-5-flag-football-playbook
      locator: Bunch · Play 2
      note: 官网的战术意图和相对先后建议；不作为精确秒表。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 对应战术的原作者讲解；不包含完整传球结局或精确秒数。
    - title: NFL FLAG · Bunch 视频
      url: https://www.youtube.com/watch?v=b1zMoed_ckI&t=51s
      locator: 0:51–1:10
      note: 时间用于定位解说；逐人讲述不表示逐人启动。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 对应战术的原作者讲解；不包含完整传球结局或精确秒数。
    - url: >-
        https://nflstatic.s3.amazonaws.com/attachments/ckmqis77f02hv0jo0uvaxh5qq-nfl-flag-play-book-formations-prd-2.pdf#page=16
