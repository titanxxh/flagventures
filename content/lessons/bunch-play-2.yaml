id: bunch-play-2
kind: offense
title:
  zh: 密集阵型 · 第 2 号战术
  en: BUNCH PLAY 2
summary: X、Z 先跑深 Corner，中锋与 Y 稍后交叉跑短 Out。
teaching:
  goal: 两侧跑深，给中间的短路线留空间。
  cooperation: X、Z 向深处和外侧展开；C、Y 延后交叉跑 Out，提供较近的接应。
  cue: 两边先跑远，中间再分开。
  question: 如果防守跟 X、Z 跑深，哪两人准备短接应？
source:
  title: NFL FLAG Play Book · 英文原书（封面 2020）
  page: 16
  note: 跑位坐标来自用户附件，归一化后重绘，非实际码数；路线称呼与配合讲解补充自 NFL FLAG 官网和视频。儿童口令、提问与播放节奏为教学改写。
  references:
