timeline:
  duration: 10
  basis: illustration
  note: 有路线的球员从 0 秒展开，各用 10 秒走完已画路径；这是读图教学节奏，不是来源规定的统一跑速、启动先后或传球时刻。视频逐人讲解的顺序不作为启动顺序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X 的 Option、Y 的 Out 与 Z 的 Fly 错开深浅，C 用 Corner 加入接应。
  - id: spread
    at: 2.5
    label: 展开 · 看方向
    cue: 从同侧三个起点出发，分别跟踪 X、Y、Z。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 比较 Z 的深跑与 X、Y 的短路线，再找 C 的 Corner。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: X、Y、Z 中谁跑得最深？谁提供较短选择？
notes:
  - 跑位与可选球路都是教学演示，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p19 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
