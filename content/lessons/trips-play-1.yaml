summary: Z 跑深 Fly，X、Y 提供短区接应，中锋的 Corner 补充另一深度。
teaching:
  goal: 在同侧展开成不同深度的接球点。
  cooperation: X 的 Option、Y 的 Out 与 Z 的 Fly 错开深浅，C 用 Corner 加入接应。
  cue: 别挤成一团，记住自己的深浅。
  question: X、Y、Z 中谁跑得最深？谁提供较短选择？
