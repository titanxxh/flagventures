timeline:
  duration: 10
  basis: illustration
  note: C 的启动有条件：其他三名接球手都没有空位。由家长先选择演示情形；满足条件的分支示范等待 2 秒后跑完路线，另一个分支仅保留已知站位。2 秒、总时长 10 秒及其他球员同时起跑均为教学设置，不是比赛规则或完整时序。
