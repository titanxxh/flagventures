timeline:
  duration: 10
  basis: illustration
  note: 四名有路线的球员同时从 0 秒启动，各用 10 秒走完；每人各段时长按自身线段长度分配，形成各自路径内匀速。这不是全员相同跑速，也不是原书规定的起跑或传球时序。
keyframes:
  - id: start
    at: 0
    label: 起始站位
    cue: 找到 Q、C、X、Y、Z，指出每个人的起点。
  - id: spread
    at: 2.5
    label: 向前展开
    cue: 沿字母和路线看，你关注的球员与队友分别去了哪里？
  - id: middle
    at: 5.5
    label: 路线中段
    cue: 停住，用手指沿路线指向下一段，再看看队友的位置。
  - id: end
    at: 10
    label: 跑至箭头
    cue: 连起各人的起点和图中已画出的路线。Q 的后续动作未注明。
notes:
  - p7 未逐人标路线名；C、X、Z 的标签是与 p3 路线树的形态对照，Y 是图示描述。
  - 路线保留原型中的短小起点连接；这些连接近似补全被球员标记遮住的部分。
  - 没有传球目标、球权变化或真假交球数据；路线相交不表示交球。
