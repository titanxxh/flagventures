# Editable bilingual lesson; source links and teaching adaptations travel with the data.
format: flag-lesson
version: 1
id: single-back-play-1
kind: offense
title:
  zh: 单跑卫阵型 · 第 1 号战术
  en: SINGLE BACK PLAY 1
summary: X、Z 向内切，Y 向侧面展开；其他接球手没有空位时，中锋再提供接应。
teaching:
  goal: 横向拉开，保留中锋的条件接应。
  cooperation: X、Z 与 Y 分向展开；C 是否加入取决于其他接球点是否被盯住。
  cue: 我跑好自己的方向，也给队友留地方。
  question: 如果三名接球手都被跟住，谁还可以出来接应？
source:
  title: NFL FLAG Play Book · 英文原书（封面 2020）
  page: 7
  note: 跑位坐标来自用户附件，归一化后重绘，非实际码数；路线称呼与配合讲解补充自 NFL FLAG 官网和视频。儿童口令、提问与播放节奏为教学改写。
  references:
    - title: NFL FLAG · Single Back 战术说明
      url: https://nflflag.com/coaches/flag-football-rules/5-on-5-flag-football-playbook
      locator: Single Back · Play 1
      note: 官网的战术意图和相对先后建议；不作为精确秒表。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 对应战术的原作者讲解；不包含完整传球结局或精确秒数。
    - title: NFL FLAG · Single Back 视频
      url: https://www.youtube.com/watch?v=Qa3p35cThJ4&t=34s
      locator: 0:34–0:55
      note: 时间用于定位解说；逐人讲述不表示逐人启动。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 对应战术的原作者讲解；不包含完整传球结局或精确秒数。
    - url: >-
        https://nflstatic.s3.amazonaws.com/attachments/ckmqis77f02hv0jo0uvaxh5qq-nfl-flag-play-book-formations-prd-2.pdf#page=7
      role: primary
      kind: diagram
      title: NFL FLAG · 原始战术图
      publisher: NFL FLAG
      locator: PDF 第 7 页 · SINGLE BACK PLAY 1
      scope: 原始站位与路线图；图中未注明的球权、先后与秒数不由此推断。
      note: 封面标 2020、文件制作元数据为 2021；已逐图对照用户双语附件的同页站位与线路。两文件的翻译、颜色和版面不同，不称为相同的 2024 版本。
  adaptation: 球路选择、传接时刻、配速与亲子讲解为教学改编；不代表原作者规定的唯一目标或固定 QB 阅读顺序。
