title:
  zh: 三接手同侧叠列阵型 · 第 3 号战术
  en: TRIPS STACK PLAY 3
summary: X、Z 向内切，Y 与中锋向右侧较深处展开，形成多处接球选择。
teaching:
  goal: 用内切与右侧深跑搭配接应。
  cooperation: X、Z 的 In 从同侧进入中间；Y、C 的 Corner 向右侧较深处展开。
  cue: 记住我是往中间，还是往右侧深处。
  question: 哪两人向内切？哪两人继续向右侧较深处展开？
