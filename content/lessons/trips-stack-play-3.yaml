    title.zh: TRIPS STACK PLAY 3
    summary: X and Z run Ins toward the middle. Y and C spread deeper to the right on Corners.
    teaching.goal: Combine inside cuts with deeper right-side options.
    teaching.cooperation: X and Z run Ins toward the middle. Y and C spread deeper to the right on Corners.
    teaching.cue: Am I cutting inside or going deeper right?
    teaching.question: Who cuts inside, and who goes deeper to the right?
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork explanations also
      use NFL FLAG’s official article and videos. Child-friendly cues, questions and animation timing are
      teaching adaptations.
    source.references.0.title: NFL FLAG · Trips Stack play explanations
    source.references.0.locator: Trips Stack · Play 3
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
