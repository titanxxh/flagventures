# Editable bilingual lesson; source links and teaching adaptations travel with the data.
format: flag-lesson
version: 1
id: qb-option
kind: run
title:
  zh: 四分卫选择战术
  en: QB OPTION
summary: 教学变式：Y 接开球担任本回合 QB，再真交给字母 Q 球员；随后可选 Q 持球跑或传给 C、X、Y、Z。
source:
