    ball.scenarios.q-run-after-y-handoff.title: Y takes snap, gives to Q · Q runs
    ball.scenarios.q-run-after-y-handoff.note: >-
      Y takes C’s snap and is the actual initial QB in this play. The player labeled Q first
      receives a real handoff from Y, then runs or passes. This explicit teaching variation avoids
      having the snap receiver run across the line; the PDF does not prescribe these exchanges. This
      possession sequence, meeting points, pacing and running extensions are teaching choices, not a
      sequence prescribed by the PDF. Real and fake handoffs occur behind the line; seconds are for
      explanation.
    ball.scenarios.q-run-after-y-handoff.events.snap.label: C snaps to Y
    ball.scenarios.q-run-after-y-handoff.events.snap.cue: >-
      Y takes the snap and is this play’s initial QB. The player labeled Q does not have the ball
      yet.
    ball.scenarios.q-run-after-y-handoff.events.handoff-y-q.label: Y hands off to Q
    ball.scenarios.q-run-after-y-handoff.events.handoff-y-q.cue: >-
      Y and Q meet behind the line. A direct handoff transfers possession to Q. Y is this play’s
      snap-receiving QB. Q receives a handoff, then runs or passes in this example.
