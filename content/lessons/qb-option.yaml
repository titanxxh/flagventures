teaching:
  goal: 教学变式：Y 接开球担任本回合 QB，再真交给字母 Q 球员；随后可选 Q 持球跑或传给 C、X、Y、Z。
  cooperation: 先看开球，再看后场会合；只有真交接或接球才换持球人。无球队友继续自己的路线，不阻挡防守。
  cue: 先找球，真交才换人，假交球还在。
  question: 刚才是真交还是假交？现在球在谁手里，哪位队友正在接应？
