title:
  zh: I 字阵型 · 第 3 号战术
  en: I FORMATION PLAY 3
summary: X 跑 Chair、Y 跑右侧 Out，Z 向内斜切，中锋直上拉开深度。
teaching:
  goal: 记住右侧交叉与中路深跑。
  cooperation: X、Y 在右侧配合变向，Z 斜切进入中间，C 的 Fly 提供深处接应。
  cue: 转弯前看队友，跑向自己的下一段。
  question: X 和 Y 哪些地方会靠近？练习前要约定什么？
