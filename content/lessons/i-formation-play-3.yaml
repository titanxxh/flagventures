timeline:
  duration: 10
  basis: illustration
  note: 有路线的球员从 0 秒展开，各用 10 秒走完已画路径；这是读图教学节奏，不是来源规定的统一跑速、启动先后或传球时刻。视频逐人讲解的顺序不作为启动顺序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X、Y 在右侧配合变向，Z 斜切进入中间，C 的 Fly 提供深处接应。
  - id: spread
    at: 2.5
    label: 展开 · 看方向
    cue: 找到 X 与 Y 的右侧路线，指出它们靠近或相交的位置。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 跟着 X 的第二次转向，再比较 C 的直上与 Z 的斜切。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: X 和 Y 哪些地方会靠近？练习前要约定什么？
notes:
  - 画面只演示进攻路线，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p37 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
translations:
  en:
    title.zh: I FORMATION PLAY 3
    summary: X's Chair and Y's right-side Out work together. Z cuts inside, while C's Fly offers depth.
    teaching.goal: Remember the crossing pair and the deep middle route.
    teaching.cooperation: X's Chair and Y's right-side Out work together. Z cuts inside, while C's Fly offers depth.
    teaching.cue: Watch teammates as you turn toward your next segment.
    teaching.question: Where do X and Y cross, and what should you agree before practice?
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork explanations also
      use NFL FLAG’s official article and videos. Child-friendly cues, questions and animation timing are
      teaching adaptations.
    source.references.0.title: NFL FLAG · I Formation play explanations
    source.references.0.locator: I Formation · Play 3
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
