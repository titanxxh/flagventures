      locator: 交接与假交接
      note: 支持交接和假交接的通用动作概念，不确定本页的持球顺序或秒数。
      role: supporting
      kind: training
      publisher: NFL FLAG
      scope: 支持个别动作或术语对照，不支持整套战术的跑位与球权链。
    - title: NFL FLAG · 当前规则说明
      url: https://nflflag.com/coaches/flag-football-rules
      locator: 开球、后场交接与初始 QB
      note: 核对后场交接与初始接开球球员不能直接持球越线；本图配速不是比赛计时，实际训练按球队适用规则。
      role: supporting
      kind: rules
      publisher: NFL FLAG
      scope: 辅助理解规则或场地，不作为本条战术的原图出处。
    - url: >-
        https://nflstatic.s3.amazonaws.com/attachments/ckmqis77f02hv0jo0uvaxh5qq-nfl-flag-play-book-formations-prd-2.pdf#page=49
      role: primary
      kind: diagram
      title: NFL FLAG · 原始战术图
      publisher: NFL FLAG
      locator: PDF 第 49 页 · END AROUND
      scope: 原始站位与路线图；图中未注明的球权、先后与秒数不由此推断。
