# UTF-8; yard-scale teaching geometry and timing are shared across languages.
format: flag-lesson
version: 1
id: route-option
kind: route
title:
  zh: 6 · 内切回转向外
  en: OPTION
summary: OPTION · 本图直跑 2 码后斜向内，到开球线前 5 码深度再回转向外横跑；这是 Option / Whip 的自定距离示例。
teaching:
  goal: 本图直跑 2 码后斜向内，到开球线前 5 码深度再回转向外横跑；这是 Option / Whip 的自定距离示例。
  cooperation: 你先向 QB 前方的中路移动，再向外侧接应。这里演示确定好的双变向，不会自动读防守、临时选一条路。
  cue: 先斜进，停稳转，往外走。
  question: 内切之后，你接下来去中间还是边线？
source:
  title: NFL FLAG 路线教学 · 附件名称与官网说明
  page: 4
  note: >-
    名称和原书编号保留自附件；跑法补充自 NFL FLAG 官网。图形重新绘制为码数比例：场地 30 × 70 码，含两端各 10 码端区；距离从开球线计。官网只说明动作，没有指定码数。本图的 2 码直跑、5
    码深度回转及后段长度均为教学设置；深度不等于斜跑的累计路程。QB 站位和动画时长是教学设置，不是原 PDF 路线描摹、官方比赛用时或指定传球时刻。
  references:
    - title: NFL FLAG · 路线树说明
      url: https://nflflag.com/coaches/default/flag-football-rules/flag-football-plays
      locator: OPTION
      note: 用于核对跑法名称与转向；本站中文说明、儿童口令和图形为教学改写。
    - title: NFL FLAG · 接球手训练
      url: https://nflflag.com/coaches/default/football-drills/wide-receiver-drills
      locator: Whip / Option
      note: 用于比较路线与核对名称，不把示例距离作为儿童训练标准。
    - title: NFL FLAG · 球场尺寸
      url: https://nflflag.com/coaches/flag-football-rules/how-to-play-flag-football
      locator: Flag Football Field
      note: 全场宽 30 码、长 70 码，含两端各 10 码端区；本图开球线和 QB 站位为教学选择。
field:
  width: 30
  height: 70
  unit: yard
  endZoneDepth: 10
  attackDirection: up
  lineOfScrimmageY: 50
players:
  - id: X
    team: offense
    at:
      - 8
      - 50
    color: '#80d4ff'
    name: 接球手 X
    label:
      zh: 内切回转向外
      en: OPTION
      description: 本图直跑 2 码后斜向内，到开球线前 5 码深度再回转向外横跑；这是 Option / Whip 的自定距离示例。
      basis: source
      note: 路线形状依据 NFL FLAG 官网。官网只说明动作，没有指定码数。本图的 2 码直跑、5 码深度回转及后段长度均为教学设置；深度不等于斜跑的累计路程。具体深度应与教练和 QB 约定。
    motion:
      type: path
      startAt: 0
      steps:
        - type: line
          to:
            - 8
            - 48
          seconds: 2
        - type: line
          to:
            - 11
            - 45
          seconds: 3
        - type: pause
          seconds: 1
        - type: line
          to:
            - 3
            - 45
          seconds: 4
    coaching:
      cooperation: 你先向 QB 前方的中路移动，再向外侧接应。这里演示确定好的双变向，不会自动读防守、临时选一条路。
      timing: 演示从 0 秒开始，10 秒走完；转折关键帧帮助记忆动作，没有规定开球后必须等待几秒。
  - id: QB
    team: offense
    at:
      - 15
      - 55
    color: '#ff9690'
    name: 四分卫 QB
    label:
      zh: 四分卫位置参照
      en: QB
      description: 本图 QB 位于开球线后方 5 码、场地横向中间，帮助辨认接球手相对 QB 的方向；这是教学站位，不要求比赛中 QB 必须这样站或保持不动。
      basis: author
      note: 为比较基础路线新增的教学站位，不是原 PDF 规定的 QB 位置。
    motion:
      type: still
      note: 教学参照：保持图标原位，不演示真实 QB 的后撤、传球或跑动。
    coaching:
      cooperation: 观察 X 是向中间、边线还是深处移动；传球路线与传球时刻未在此图规定。
      timing: 图标全程静止仅为定位参照，不表示真实比赛中的启动顺序。
timeline:
  duration: 10
  basis: illustration
  note: 动画总长 10 秒，仅展示动作先后；图形和距离刻度按码数绘制，播放秒数不是实跑用时，不能用秒数换算码数。QB 静止只是位置参照。
keyframes:
  - id: start
    at: 0
    label: 起始站位
    cue: 从开球线的 0 码开始看：X 在左侧，QB 在后方 5 码的中间。上方是进攻方向，“内”指场地中间。
  - id: cut-in
    at: 2
    label: 2 码先向内
    cue: 本图直跑 2 码后像 Slant 一样斜向内；2 码为教学设置。
  - id: pivot
    at: 5
    label: 5 码深度回转
    cue: 到开球线前 5 码深度后准备向外回转。1 秒停顿只为看清动作，码数和停顿均非官方规定。
  - id: cut-out
    at: 6
    label: 在 5 码深度外横切
    cue: 停顿后朝边线横跑，保持开球线前 5 码深度。
  - id: end
    at: 10
    label: 动作完成
    cue: 说出 OPTION，按「先斜进，停稳转，往外走。」用手指画一遍。
notes:
  - 全场按码数比例绘制：30 码宽、70 码长，含两端各 10 码端区。X 从左侧开球线起跑，QB 在后方 5 码作参照；这不是完整五人阵型。
  - QB 的静止站位只是教学参照；这里不演示开球、传球、后撤步或防守。距离标签标明官方示例或教学设置；真实路线深度、传球时机和练习距离由教练与 QB 约定。
  - Option 这个名字在不同球队可能指按防守作选择的路线；本条只演示 NFL FLAG 这份教材中称为 Option / Whip 的回转跑法，不推断额外分支。
translations:
  en:
    summary: >-
      OPTION · This illustrative Option / Whip uses a 2-yard stem, slants inside to a depth of 5 yards beyond
      the line, then pivots and runs outside.
    title.zh: 6 · OPTION
    source.title: NFL FLAG route lesson · PDF names and official explanations
    source.note: >-
      Names and original numbering are retained from the PDF; route explanations are supplemented from NFL
      FLAG. The diagram is redrawn in yards on a 30 × 70-yard field, including two 10-yard end zones; depths
      are measured from the line of scrimmage. The official guide describes the movement without specifying
      yardage. The 2-yard stem, pivot at 5-yard depth and remaining length are teaching choices; depth is not
      total distance traveled. QB placement and animation duration are teaching choices, not a PDF tracing,
      official game timing or prescribed throw time.
    source.references.0.title: NFL FLAG · Route tree guide
    source.references.0.locator: OPTION
    source.references.0.note: >-
      Used for route names and directions. Chinese explanations, child-friendly cues and diagrams are teaching
      adaptations.
    source.references.1.title: NFL FLAG · Wide receiver drills
    source.references.1.locator: Whip / Option
    source.references.1.note: >-
      Used to compare routes and check terminology, without treating example distances as requirements for
      children.
    notes.0: >-
      The field is drawn to yard scale: 30 yards wide and 70 long, including two 10-yard end zones. X starts
      on the left of the line, with QB 5 yards behind as a reference; this is not a full five-player
      formation.
    notes.1: >-
      The stationary QB is a teaching reference; snaps, passes, dropbacks and defense are not animated.
      Distance labels distinguish official examples from teaching choices. Agree on actual route depths,
      passing timing and practice distances with your coach and QB.
    notes.2: >-
      Option can mean a coverage-based choice in other playbooks. This lesson only shows the Option / Whip
      movement described in this NFL FLAG guide; it does not infer extra branches.
    teaching.goal: >-
      This illustrative Option / Whip uses a 2-yard stem, slants inside to a depth of 5 yards beyond the line,
      then pivots and runs outside.
    teaching.cooperation: >-
      Move toward the middle ahead of the QB, then offer an outside target. This demonstrates a planned double
      move, not an automatic choice based on coverage.
    teaching.cue: Slant in, plant and pivot, go out.
    teaching.question: After the inside cut, do you continue to the middle or turn toward the sideline?
    players.X.name: Receiver X
    players.X.label.zh: OPTION
    players.X.label.description: >-
      This illustrative Option / Whip uses a 2-yard stem, slants inside to a depth of 5 yards beyond the line,
      then pivots and runs outside.
    players.X.label.note: >-
      The route shape follows NFL FLAG. The official guide describes the movement without specifying yardage.
      The 2-yard stem, pivot at 5-yard depth and remaining length are teaching choices; depth is not total
      distance traveled. Agree on actual depths with your coach and QB.
    players.X.coaching.cooperation: >-
      Move toward the middle ahead of the QB, then offer an outside target. This demonstrates a planned double
      move, not an automatic choice based on coverage.
    players.X.coaching.timing: >-
      The demonstration runs from 0 to 10 seconds. Keyframes mark movement changes; they do not prescribe a
      delay after the snap.
    players.QB.name: Quarterback QB
    players.QB.label.zh: Quarterback reference
    players.QB.label.description: >-
      QB is drawn 5 yards behind the line at the field’s horizontal center to show relative direction. This is
      a teaching position, not a required game stance or instruction to stand still.
    players.QB.label.note: An added reference position for comparing routes, not a QB position prescribed by the PDF.
    players.QB.motion.note: 'Teaching reference: keep the marker fixed; actual QB dropbacks, passes and runs are not shown.'
    players.QB.coaching.cooperation: >-
      Watch whether X moves toward the middle, sideline or deeper upfield. Pass trajectory and release time
      are not specified.
    players.QB.coaching.timing: The marker stays fixed only as a positional reference, not to specify real-game movement order.
    timeline.note: >-
      The ten-second animation only shows movement order. Geometry and depth marks use yards; playback seconds
      are not real running time and cannot be converted into yardage. QB stays still as a positional
      reference.
    keyframes.start.label: Starting positions
    keyframes.start.cue: >-
      Start at zero on the line of scrimmage: X is on the left and QB is centered 5 yards behind. Attack goes
      upward; inside means toward the field center.
    keyframes.cut-in.label: Inside after 2 yd
    keyframes.cut-in.cue: This drawing slants inside after a 2-yard stem; that distance is a teaching choice.
    keyframes.pivot.label: Pivot at 5 yd depth
    keyframes.pivot.cue: >-
      At 5 yards of depth beyond the line, prepare to pivot outside. The one-second pause makes the move
      visible; neither distance nor pause is prescribed.
    keyframes.cut-out.label: Outside at 5 yd depth
    keyframes.cut-out.cue: After the pause, run sideways toward the sideline, staying 5 yards beyond the line.
    keyframes.end.label: Route complete
    keyframes.end.cue: 'Say OPTION, then trace the route: “Slant in, plant and pivot, go out.”'
    source.references.2.title: NFL FLAG · Field dimensions
    source.references.2.locator: Flag Football Field
    source.references.2.note: >-
      The field is 30 yards wide and 70 yards long, including two 10-yard end zones. The illustrated line of
      scrimmage and QB position are teaching choices.
    routeGuide.note: >-
      Depth is measured from the line of scrimmage. The official guide describes the movement without
      specifying yardage. The 2-yard stem, pivot at 5-yard depth and remaining length are teaching choices;
      depth is not total distance traveled. Other remaining lengths and QB’s position 5 yards behind the line
      are teaching choices; agree on practice distances with your coach and QB.
    routeGuide.marks.cut-in.label: Inside cut at 2 yd
    routeGuide.marks.cut-in.note: >-
      The 2-yard straight stem is a drawing choice. The source describes a Slant-like inward move without
      specifying this distance.
    routeGuide.marks.pivot.label: Pivot at 5 yd depth
    routeGuide.marks.pivot.note: >-
      Pivoting outside at a depth of 5 yards is an illustrative choice. Five yards measures depth beyond the
      line, not the total distance run.
routeGuide:
  player: X
  note: >-
    距离从开球线计算。官网只说明动作，没有指定码数。本图的 2 码直跑、5 码深度回转及后段长度均为教学设置；深度不等于斜跑的累计路程。其余后段长度及 QB 在开球线后 5
    码的站位是教学设置；具体练习距离与教练、QB 约定。
  marks:
    - id: cut-in
      step: 0
      label: 2 码内斜切
      basis: illustration
      note: 2 码直跑起步是本图教学设置；来源只说明先像 Slant 一样向内，不指定这个距离。
    - id: pivot
      step: 1
      label: 5 码深度回转
      basis: illustration
      note: 到开球线前 5 码深度回转向外，是本图自定示例；5 码指纵向深度，不是累计跑了 5 码。
