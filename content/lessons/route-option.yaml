id: route-option
kind: route
title:
  zh: 6 · 选择路线
  en: OPTION
summary: OPTION · 沿原图看前跑、斜切和回折。原书没有写明选择条件，要按教练说明练习。
source:
  title: NFL FLAG 2024 中英文对照学习译本（用户附件）
  page: 4
  note: 以用户附件为依据；中文为非官方学习译文。坐标归一化重绘，不是实际码数。
