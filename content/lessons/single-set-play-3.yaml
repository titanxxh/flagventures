summary: X 向左侧深处跑 Fly，尝试给中锋的左侧短 Out 腾出空间；Y、Z 继续跑深。
teaching:
  goal: 用同一侧的深跑帮助短接应。
  cooperation: X 的深跑帮助 C 在左侧短接应；Y 的 Corner 与 Z 的 Post 提供另外两个深处选择。
  cue: 我往前跑远，帮助身后的队友接应。
  question: X 跑向深处后，谁来到左侧较浅区域？
