  en:
    title.zh: SINGLE SET PLAY 3
    summary: X's Fly opens the shallow left for C's Out. Y's Corner and Z's Post offer other deep options.
    teaching.goal: Deep routes help a shallow left-side outlet.
    teaching.cooperation: X's Fly opens the shallow left for C's Out. Y's Corner and Z's Post offer other deep options.
    teaching.cue: I go deep; C can use the space behind me.
    teaching.question: Whose deep route helps C on the shallow left?
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork explanations also
      use NFL FLAG’s official article and videos. Child-friendly cues, questions and animation timing are
      teaching adaptations.
    source.references.0.title: NFL FLAG · Single Set play explanations
    source.references.0.locator: Single Set · Play 3
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
