timeline:
  duration: 10
  basis: illustration
  note: 已画出路线的球员在 0 秒同时开始、各用 10 秒走完。这只是读图教学节奏，不是原书规定的启动先后、跑速或交接球时序。
keyframes:
  - id: start
    at: 0
    label: 起始站位
    cue: 先找 X 和 Z 的起点。今天先扮演其中一位，再换队友的位置试试。
  - id: early
    at: 2.5
    label: 观察前段
    cue: 观察 X 和 Z 的前段；X 的跑法是「后场绕行路线」。
  - id: middle
    at: 5.5
    label: 观察中段
    cue: 停在这里：你关注的人去了哪里？Z 又在哪里？用手指同时指出两条路线。
  - id: end
    at: 10
    label: 路线终点
    cue: 回想 X 和 Z 从哪里出发、怎样转向。换一名球员讲一遍，再回到全队。
notes:
  - 保留原图可见的直线与贝塞尔曲线；不根据名称推断传球、真假交球或最终持球人。
  - 路线的共同启动和 10 秒演示时长是读图教学设定，不表示真实交接时序。
  - Q 的短线按图保留为读图路径；图中没有逐次说明它与交接球的关系。
translations:
  en:
    title.zh: DOUBLE REVERSE
    summary: Follow each starting position and arrow to understand the routes and teamwork.
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Based on the supplied PDF. The Chinese study translation is unofficial; drawing coordinates are not
      actual yards.
    timeline.note: >-
      Shown routes start together and finish in ten demonstration seconds. Timing follows each individual
      route and is illustrative, not official start order, equal player speeds or handoff timing.
    notes.0: >-
      Visible straight and curved paths are preserved. The title does not determine passes, real or fake
      handoffs, or the final ball carrier.
    notes.1: Starting together and finishing in ten seconds are teaching settings, not real handoff timing.
    notes.2: Q’s short line is preserved; the diagram does not explain its step-by-step relationship to handoffs.
    players.Q.label.zh: Follow the short backward line. Later handoff steps are not shown.
    players.Q.label.description: Follow the short backward line. Later handoff steps are not shown.
    players.Q.label.note: >-
      Describes this player’s drawn path; it does not infer the ball carrier, fake or real handoffs, or a
      standard receiving route from the play’s name.
    players.C.label.zh: Run forward, then take a short diagonal cut forward-right.
    players.C.label.description: Run forward, then take a short diagonal cut forward-right.
    players.C.label.note: >-
      Describes this player’s drawn path; it does not infer the ball carrier, fake or real handoffs, or a
      standard receiving route from the play’s name.
    players.X.label.zh: Backfield loop
    players.X.label.description: Loop backward from the left into the middle, with a short bend at the end.
    players.X.label.note: >-
      Describes this player’s drawn path; it does not infer the ball carrier, fake or real handoffs, or a
      standard receiving route from the play’s name.
    players.Y.label.zh: Run forward, then take a short diagonal cut forward-right.
    players.Y.label.description: Run forward, then take a short diagonal cut forward-right.
    players.Y.label.note: >-
      Describes this player’s drawn path; it does not infer the ball carrier, fake or real handoffs, or a
      standard receiving route from the play’s name.
    players.Z.label.zh: Backfield loop
    players.Z.label.description: Curve through the backfield from the right toward the left.
    players.Z.label.note: >-
      Describes this player’s drawn path; it does not infer the ball carrier, fake or real handoffs, or a
      standard receiving route from the play’s name.
    keyframes.start.label: Starting positions
    keyframes.start.cue: Find X and Z. Try one role, then switch.
    keyframes.early.label: Early movement
    keyframes.early.cue: Point to the current positions of X and Z and follow their next segments.
    keyframes.middle.label: Mid-route check
    keyframes.middle.cue: Point to the current positions of X and Z and follow their next segments.
    keyframes.end.label: Route endpoints
    keyframes.end.cue: >-
      Recall where X and Z started and how they turned. Explain another player’s route, then look at the whole
      team.
