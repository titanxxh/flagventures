# Editable bilingual lesson; source links and teaching adaptations travel with the data.
format: flag-lesson
version: 1
id: route-corner
kind: route
title:
  zh: 4 · 深斜外切
  en: CORNER
summary: CORNER · 本图先直跑 7 码，再以约 45° 斜向外侧，朝对面端区边角方向跑。
teaching:
  goal: 本图先直跑 7 码，再以约 45° 斜向外侧，朝对面端区边角方向跑。
  cooperation: 你先到 QB 前方较深的位置，再向左外侧展开。和 Post 比较：一个斜向边角，一个斜向中间。
  cue: 先跑深，再斜向边角。
  question: Corner 和 Out 都向外，它们的转弯角度有什么不同？
source:
  title: NFL FLAG 路线教学 · 附件名称与官网说明
  page: 3
  note: >-
    名称和原书编号保留自附件；跑法补充自 NFL FLAG 官网。图形重新绘制为码数比例：场地 30 × 70 码，含两端各 10 码端区；距离从开球线计。采用官方路线树的 7
    码首次变向示例；接球手训练另给 5–10 码范围。后续斜跑长度为本图设置。QB 站位和动画时长是教学设置，不是原 PDF 路线描摹、官方比赛用时或指定传球时刻。
  references:
    - title: NFL FLAG · 路线树说明
      url: https://nflflag.com/coaches/default/flag-football-rules/flag-football-plays
      locator: CORNER
      note: 用于核对跑法名称与转向；本站中文说明、儿童口令和图形为教学改写。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 本条跑法的方向、名称或图示；具体示意距离另见距离说明。
    - title: NFL FLAG · 接球手训练
      url: https://nflflag.com/coaches/default/football-drills/wide-receiver-drills
      locator: Corner
      note: 用于核对本条路线的距离示例或未指定固定距离的说明；不是所有球员必须使用的深度。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 本条跑法的方向、名称或图示；具体示意距离另见距离说明。
    - title: NFL FLAG · 球场尺寸
      url: https://nflflag.com/coaches/flag-football-rules/how-to-play-flag-football
      locator: Flag Football Field
      note: 全场宽 30 码、长 70 码，含两端各 10 码端区；本图开球线和 QB 站位为教学选择。
      role: supporting
      kind: rules
      publisher: NFL FLAG
      scope: 辅助理解规则或场地，不作为本条战术的原图出处。
  adaptation: 路线按码重绘；未由来源规定的距离、回接点与播放秒数为教学示例，具体区别见距离说明。
field:
  width: 30
  height: 70
  unit: yard
  endZoneDepth: 10
  attackDirection: up
  lineOfScrimmageY: 50
players:
  - id: X
    team: offense
    at:
      - 8
      - 50
    color: '#80d4ff'
    name: 接球手 X
    label:
      zh: 深斜外切
      en: CORNER
      description: 本图先直跑 7 码，再以约 45° 斜向外侧，朝对面端区边角方向跑。
      basis: source
      note: 路线形状依据 NFL FLAG 官网。采用官方路线树的 7 码首次变向示例；接球手训练另给 5–10 码范围。后续斜跑长度为本图设置。具体深度应与教练和 QB 约定。
    motion:
      type: path
      startAt: 0
      steps:
        - type: line
          to:
            - 8
            - 43
          seconds: 6
        - type: line
          to:
            - 2
            - 37
          seconds: 4
    coaching:
      cooperation: 你先到 QB 前方较深的位置，再向左外侧展开。和 Post 比较：一个斜向边角，一个斜向中间。
      timing: 演示从 0 秒开始，10 秒走完；转折关键帧帮助记忆动作，没有规定开球后必须等待几秒。
  - id: QB
    team: offense
    at:
      - 15
      - 55
    color: '#ff9690'
    name: 四分卫 QB
    label:
      zh: 四分卫位置参照
      en: QB
      description: 本图 QB 位于开球线后方 5 码、场地横向中间，帮助辨认接球手相对 QB 的方向；这是教学站位，不要求比赛中 QB 必须这样站或保持不动。
      basis: author
      note: 为比较基础路线新增的教学站位，不是原 PDF 规定的 QB 位置。
    motion:
      type: still
      note: 教学参照：保持图标原位，不演示真实 QB 的后撤、传球或跑动。
    coaching:
      cooperation: 观察 X 是向中间、边线还是深处移动；传球路线与传球时刻未在此图规定。
      timing: 图标全程静止仅为定位参照，不表示真实比赛中的启动顺序。
timeline:
  duration: 10
  basis: illustration
  note: 动画总长 10 秒，仅展示动作先后；图形和距离刻度按码数绘制，播放秒数不是实跑用时，不能用秒数换算码数。QB 静止只是位置参照。
keyframes:
  - id: start
    at: 0
    label: 起始站位
    cue: 从开球线的 0 码开始看：X 在左侧，QB 在后方 5 码的中间。上方是进攻方向，“内”指场地中间。
  - id: cut
    at: 6
    label: 7 码向外斜切
    cue: 已经直跑 7 码；现在约 45° 朝左上角跑，不是像 Out 那样横着跑。
  - id: end
    at: 10
    label: 动作完成
    cue: 说出 CORNER，按「先跑深，再斜向边角。」用手指画一遍。
notes:
  - 全场按码数比例绘制：30 码宽、70 码长，含两端各 10 码端区。X 从左侧开球线起跑，QB 在后方 5 码作参照；这不是完整五人阵型。
  - QB 的静止站位只是教学参照；这里不演示开球、传球、后撤步或防守。距离标签标明官方示例或教学设置；真实路线深度、传球时机和练习距离由教练与 QB 约定。
translations:
  en:
    summary: >-
      CORNER · In this example, run a 7-yard stem, then cut roughly 45° outside toward the far
      end-zone corner.
    title.zh: 4 · CORNER
    source.title: NFL FLAG route lesson · PDF names and official explanations
    source.note: >-
      Names and original numbering are retained from the PDF; route explanations are supplemented
      from NFL FLAG. The diagram is redrawn in yards on a 30 × 70-yard field, including two 10-yard
      end zones; depths are measured from the line of scrimmage. The first cut uses the route tree’s
      7-yard example; the receiver drill also gives a 5–10-yard range. The remaining diagonal length
      is a drawing choice. QB placement and animation duration are teaching choices, not a PDF
      tracing, official game timing or prescribed throw time.
    source.references.0.title: NFL FLAG · Route tree guide
    source.references.0.locator: CORNER
    source.references.0.note: >-
      Used for route names and directions. Chinese explanations, child-friendly cues and diagrams
      are teaching adaptations.
    notes.0: >-
      The field is drawn to yard scale: 30 yards wide and 70 long, including two 10-yard end zones.
      X starts on the left of the line, with QB 5 yards behind as a reference; this is not a full
      five-player formation.
    notes.1: >-
      The stationary QB is a teaching reference; snaps, passes, dropbacks and defense are not
      animated. Distance labels distinguish official examples from teaching choices. Agree on actual
      route depths, passing timing and practice distances with your coach and QB.
    teaching.goal: >-
      In this example, run a 7-yard stem, then cut roughly 45° outside toward the far end-zone
      corner.
    teaching.cooperation: >-
      Get farther ahead of the QB before widening to the left. Corner angles toward the outside
      corner; Post angles toward the middle.
    teaching.cue: Go deep, then angle to the corner.
    teaching.question: Corner and Out both go outside. How do their cuts differ?
    players.X.name: Receiver X
    players.X.label.zh: CORNER
    players.X.label.description: >-
      In this example, run a 7-yard stem, then cut roughly 45° outside toward the far end-zone
      corner.
    players.X.label.note: >-
      The route shape follows NFL FLAG. The first cut uses the route tree’s 7-yard example; the
      receiver drill also gives a 5–10-yard range. The remaining diagonal length is a drawing
      choice. Agree on actual depths with your coach and QB.
    players.X.coaching.cooperation: >-
      Get farther ahead of the QB before widening to the left. Corner angles toward the outside
      corner; Post angles toward the middle.
    players.X.coaching.timing: >-
      The demonstration runs from 0 to 10 seconds. Keyframes mark movement changes; they do not
      prescribe a delay after the snap.
    players.QB.name: Quarterback QB
    players.QB.label.zh: Quarterback reference
    players.QB.label.description: >-
      QB is drawn 5 yards behind the line at the field’s horizontal center to show relative
      direction. This is a teaching position, not a required game stance or instruction to stand
      still.
    players.QB.label.note: An added reference position for comparing routes, not a QB position prescribed by the PDF.
    players.QB.motion.note: 'Teaching reference: keep the marker fixed; actual QB dropbacks, passes and runs are not shown.'
    players.QB.coaching.cooperation: >-
      Watch whether X moves toward the middle, sideline or deeper upfield. Pass trajectory and
      release time are not specified.
    players.QB.coaching.timing: >-
      The marker stays fixed only as a positional reference, not to specify real-game movement
      order.
    timeline.note: >-
      The ten-second animation only shows movement order. Geometry and depth marks use yards;
      playback seconds are not real running time and cannot be converted into yardage. QB stays
      still as a positional reference.
    keyframes.start.label: Starting positions
    keyframes.start.cue: >-
      Start at zero on the line of scrimmage: X is on the left and QB is centered 5 yards behind.
      Attack goes upward; inside means toward the field center.
    keyframes.cut.label: 7-yard outside cut
    keyframes.cut.cue: >-
      After a 7-yard stem, cut about 45° toward the upper-left corner, rather than running sideways
      like Out.
    keyframes.end.label: Route complete
    keyframes.end.cue: 'Say CORNER, then trace the route: “Go deep, then angle to the corner.”'
    source.references.1.title: NFL FLAG · Wide receiver drills
    source.references.1.locator: Corner
    source.references.1.note: >-
      Verifies the route’s example depth or lack of a fixed depth; these are not distances required
      for every player.
    source.references.2.title: NFL FLAG · Field dimensions
    source.references.2.locator: Flag Football Field
    source.references.2.note: >-
      The field is 30 yards wide and 70 yards long, including two 10-yard end zones. The illustrated
      line of scrimmage and QB position are teaching choices.
    routeGuide.note: >-
      Depth is measured from the line of scrimmage. The first cut uses the route tree’s 7-yard
      example; the receiver drill also gives a 5–10-yard range. The remaining diagonal length is a
      drawing choice. Other remaining lengths and QB’s position 5 yards behind the line are teaching
      choices; agree on practice distances with your coach and QB.
    routeGuide.marks.cut.label: Outside cut at 7 yd
    routeGuide.marks.cut.note: >-
      The official route tree cuts outside about 45° after 7 yards; another official drill gives a
      5–10-yard range.
    source.references.0.publisher: NFL FLAG
    source.references.0.scope: The route’s name, direction or diagram; distance choices are identified separately.
    source.references.1.publisher: NFL FLAG
    source.references.1.scope: The route’s name, direction or diagram; distance choices are identified separately.
    source.references.2.publisher: NFL FLAG
    source.references.2.scope: Rules or field context only, not the source of this play diagram.
    source.adaptation: >-
      Routes are redrawn in yards. Distances, return points and playback seconds not specified by
      the source are teaching choices, identified in the distance notes.
routeGuide:
  player: X
  note: >-
    距离从开球线计算。采用官方路线树的 7 码首次变向示例；接球手训练另给 5–10 码范围。后续斜跑长度为本图设置。其余后段长度及 QB 在开球线后 5
    码的站位是教学设置；具体练习距离与教练、QB 约定。
  marks:
    - id: cut
      step: 0
      label: 7 码外斜切
      basis: source-example
      note: 官方路线树示范直跑 7 码后约 45° 外斜切；另一官方练习给 5–10 码范围。
      sourceReference: 0
