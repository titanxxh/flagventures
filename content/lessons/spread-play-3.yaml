    players.Z.coaching.cooperation: Run a Hitch as Y crosses on a short Out.
    players.Z.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    keyframes.start.label: Line up · Find teammates
    keyframes.start.cue: >-
      Find Q, C, X, Y and Z. X and C cross on Slants; Y's Out crosses Z's Hitch. Agree on how to
      pass the crossing points before practice.
    keyframes.spread.label: Watch the routes
    keyframes.spread.cue: >-
      Pause and compare teammates’ routes. Who crosses your route, and where do you each go
      afterward?
    keyframes.middle.label: Pause · See the teamwork
    keyframes.middle.cue: >-
