id: spread-play-3
kind: offense
title:
  zh: 分散阵型 · 第 3 号战术
  en: SPREAD PLAY 3
summary: X 与中锋交叉斜切，Y 的 Out 与 Z 的 Hitch 组成另一组交叉。
teaching:
  goal: 记住两组交叉路线和自己的方向。
  cooperation: X/C 与 Y/Z 各成一组，交叉后分开接应；练习前要约定通过交叉点的次序。
  cue: 看好队友，交叉后跑向自己的地方。
  question: 和你交叉的是谁？交叉后你们分别去哪？
source:
  title: NFL FLAG Play Book · 英文原书（封面 2020）
  page: 13
  note: 跑位坐标来自用户附件，归一化后重绘，非实际码数；路线称呼与配合讲解补充自 NFL FLAG 官网和视频。儿童口令、提问与播放节奏为教学改写。
