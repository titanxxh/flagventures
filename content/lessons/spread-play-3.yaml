timeline:
  duration: 10
  basis: illustration
  note: 有路线的球员从 0 秒展开，各用 10 秒走完已画路径；这是读图教学节奏，不是来源规定的统一跑速、启动先后或传球时刻。视频逐人讲解的顺序不作为启动顺序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X/C 与 Y/Z 各成一组，交叉后分开接应；练习前要约定通过交叉点的次序。
  - id: spread
    at: 2.5
    label: 展开 · 看方向
    cue: 先找 X、C 的交叉，再找 Y、Z 的交叉。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 暂停指出两个交叉点；到场上练习前约定谁先通过。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 和你交叉的是谁？交叉后你们分别去哪？
notes:
  - 画面只演示进攻路线，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p13 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
translations:
  en:
    title.zh: SPREAD PLAY 3
    summary: >-
      X and C cross on Slants; Y's Out crosses Z's Hitch. Agree on how to pass the crossing points before
      practice.
    teaching.goal: Remember two crossing pairs.
    teaching.cooperation: >-
      X and C cross on Slants; Y's Out crosses Z's Hitch. Agree on how to pass the crossing points before
      practice.
    teaching.cue: Cross, then run to your own space.
    teaching.question: Who crosses your route, and where do you each go afterward?
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork explanations also
      use NFL FLAG’s official article and videos. Child-friendly cues, questions and animation timing are
      teaching adaptations.
    source.references.0.title: NFL FLAG · Spread play explanations
    source.references.0.locator: Spread · Play 3
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
    source.references.1.title: NFL FLAG · Spread video
    source.references.1.locator: 1:16–1:31
    source.references.1.note: Timestamps locate the narration; its order does not define player start order.
    timeline.note: >-
      Shown routes start together and finish in ten demonstration seconds. Timing follows each individual
      route and is illustrative, not official start order, equal player speeds or handoff timing.
    notes.0: >-
      This shows offensive routes without simulating defenders. Creating space is the play’s intent, not a
      guaranteed outcome.
    notes.1: The cues and questions are teaching adaptations. Agree on crossing order before practicing on the field.
    notes.2: >-
      Relative positions follow source page 13. Short connections approximate parts hidden beneath markers;
      they are not extra actions or measured yards.
    notes.3: >-
      No complete QB read order, mandatory target or pass timing is specified. Crossing routes do not imply a
      handoff.
    players.Q.label.zh: Movement not specified
    players.Q.label.description: Only Q’s starting position is shown. Later movement is not specified.
    players.Q.coaching.cooperation: Observe the receiving areas offered by teammates. No fixed read order or mandatory target is specified.
    players.Q.coaching.timing: The diagram does not specify Q’s later movement or when to pass.
    players.Q.motion.note: >-
      Only the known starting position is shown. Later movement is unspecified; this does not require standing
      still.
    players.C.label.zh: Slant
    players.C.label.description: Move diagonally forward-left. Left and right refer to the diagram.
    players.C.label.note: >-
      Name follows the official NFL FLAG explanation (1:16–1:31); direction and geometry retain the supplied
      diagram on page 13.
    players.C.coaching.cooperation: Slant left across X, then follow your own route.
    players.C.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.X.label.zh: Slant
    players.X.label.description: Move diagonally forward-right. Left and right refer to the diagram.
    players.X.label.note: >-
      Name follows the official NFL FLAG explanation (1:16–1:31); direction and geometry retain the supplied
      diagram on page 13.
    players.X.coaching.cooperation: Slant right across C, then separate.
    players.X.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.Y.label.zh: Out
    players.Y.label.description: Move forward, then across to the right. Left and right refer to the diagram.
    players.Y.label.note: >-
      Name follows the official NFL FLAG explanation (1:16–1:31); direction and geometry retain the supplied
      diagram on page 13.
    players.Y.coaching.cooperation: Run a short Out, crossing Z's Hitch.
    players.Y.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.Z.label.zh: Hitch
    players.Z.label.description: Move forward, then across to the left. Left and right refer to the diagram.
    players.Z.label.note: >-
      Name follows the official NFL FLAG explanation (1:16–1:31); direction and geometry retain the supplied
      diagram on page 13.
    players.Z.coaching.cooperation: Run a Hitch as Y crosses on a short Out.
    players.Z.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    keyframes.start.label: Line up · Find teammates
    keyframes.start.cue: >-
      Find Q, C, X, Y and Z. X and C cross on Slants; Y's Out crosses Z's Hitch. Agree on how to pass the
      crossing points before practice.
    keyframes.spread.label: Watch the routes
    keyframes.spread.cue: Pause and compare teammates’ routes. Who crosses your route, and where do you each go afterward?
    keyframes.middle.label: Pause · See the teamwork
    keyframes.middle.cue: Pause and compare teammates’ routes. Who crosses your route, and where do you each go afterward?
    keyframes.end.label: Recall · Explain it
    keyframes.end.cue: Who crosses your route, and where do you each go afterward?
