timeline:
  duration: 10
  basis: illustration
  note: 官网建议 C 等队友牵动防守后再展开。本示范设 X、Y、Z 在 0 秒开始、C 在 2 秒开始，均于 10 秒走完。先后依据来源，具体秒数与跑速为教学设置；未指定传球时刻。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X、Y、Z 先牵动防守；C 延后向左跑 Out，形成短区接球点。
  - id: release
    at: 2
    label: 稍后加入
    cue: C 从这里加入；2 秒是本演示的教学设置。X、Y、Z 先离开起点，C 稍后加入左侧 Out。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 找到 X 与 C 分开的方向，再看 Y、Z 较深的路线。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 中锋为什么可以稍后出发？他准备去哪一侧？
notes:
  - 跑位与可选球路都是教学演示，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p21 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
