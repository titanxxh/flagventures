timeline:
  duration: 10
  basis: illustration
  note: 官网建议 C 等队友牵动防守后再展开。本示范设 X、Y、Z 在 0 秒开始、C 在 2 秒开始，均于 10 秒走完。先后依据来源，具体秒数与跑速为教学设置；未指定传球时刻。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X、Y、Z 先牵动防守；C 延后向左跑 Out，形成短区接球点。
  - id: release
    at: 2
    label: 稍后加入
    cue: C 从这里加入；2 秒是本演示的教学设置。X、Y、Z 先离开起点，C 稍后加入左侧 Out。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 找到 X 与 C 分开的方向，再看 Y、Z 较深的路线。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 中锋为什么可以稍后出发？他准备去哪一侧？
notes:
  - 画面只演示进攻路线，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p21 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
translations:
  en:
    title.zh: TRIPS PLAY 3
    summary: X, Y and Z go first. C starts later on a short Out to the left.
    teaching.goal: Let receivers spread out before the center joins.
    teaching.cooperation: X, Y and Z go first. C starts later on a short Out to the left.
    teaching.cue: Watch teammates spread out, then join them.
    teaching.question: Why does C wait, and which way does C go?
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork explanations also
      use NFL FLAG’s official article and videos. Child-friendly cues, questions and animation timing are
      teaching adaptations.
    source.references.0.title: NFL FLAG · Trips play explanations
    source.references.0.locator: Trips · Play 3
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
    source.references.1.title: NFL FLAG · Trips video
    source.references.1.locator: 1:31–1:58
    source.references.1.note: Timestamps locate the narration; its order does not define player start order.
    timeline.note: >-
      C start after their teammates, following the official explanation. A two-second delay and ten-second
      total are teaching settings, not prescribed game timing or equal running speeds.
    notes.0: >-
      This shows offensive routes without simulating defenders. Creating space is the play’s intent, not a
      guaranteed outcome.
    notes.1: The cues and questions are teaching adaptations. Agree on crossing order before practicing on the field.
    notes.2: >-
      Relative positions follow source page 21. Short connections approximate parts hidden beneath markers;
      they are not extra actions or measured yards.
    notes.3: >-
      No complete QB read order, mandatory target or pass timing is specified. Crossing routes do not imply a
      handoff.
    players.Q.label.zh: Movement not specified
    players.Q.label.description: Only Q’s starting position is shown. Later movement is not specified.
    players.Q.coaching.cooperation: Observe the receiving areas offered by teammates. No fixed read order or mandatory target is specified.
    players.Q.coaching.timing: The diagram does not specify Q’s later movement or when to pass.
    players.Q.motion.note: >-
      Only the known starting position is shown. Later movement is unspecified; this does not require standing
      still.
    players.C.label.zh: Out
    players.C.label.description: Move forward, then across to the left. Left and right refer to the diagram.
    players.C.label.note: >-
      Name follows the official NFL FLAG explanation (1:31–1:58); direction and geometry retain the supplied
      diagram on page 21.
    players.C.coaching.cooperation: Wait for teammates to spread out, then run a short Out left.
    players.C.coaching.timing: Let X, Y, Z spread out first, then join. Starting at two seconds is a teaching setting.
    players.X.label.zh: Option
    players.X.label.description: >-
      Move forward, then diagonally forward-left, then diagonally back-right, then across to the right. Left
      and right refer to the diagram.
    players.X.label.note: >-
      Name follows the official NFL FLAG explanation (1:31–1:58); direction and geometry retain the supplied
      diagram on page 21.
    players.X.coaching.cooperation: Fake left, then run the Option right, away from C's side.
    players.X.coaching.timing: Go first, before the delayed teammate(s). Starting at zero seconds is a teaching setting.
    players.Y.label.zh: Corner
    players.Y.label.description: Move forward, then diagonally forward-right. Left and right refer to the diagram.
    players.Y.label.note: >-
      Name follows the official NFL FLAG explanation (1:31–1:58); direction and geometry retain the supplied
