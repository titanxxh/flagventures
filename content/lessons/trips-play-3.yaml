  en: TRIPS PLAY 3
summary: X 做向左再向右的 Option，Y、Z 提供较深选择；中锋稍后跑短 Out。
teaching:
  goal: 先让接球手展开，中锋稍后接应。
  cooperation: X、Y、Z 先牵动防守；C 延后向左跑 Out，形成短区接球点。
  cue: 先看队友展开，再轮到我接应。
  question: 中锋为什么可以稍后出发？他准备去哪一侧？
