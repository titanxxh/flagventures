title:
  zh: 双接手同侧叠列阵型 · 第 3 号战术
  en: TWINS STACK PLAY 3
summary: X 与中锋在浅区接应，Y 跑较深 In、Z 跑 Post，保留长短选择。
teaching:
  goal: 用两条短路线搭配两条较深路线。
  cooperation: X 的 Option 与 C 的 Out 负责浅区；Y 的 In 与 Z 的 Post 提供较深接球点。
  cue: 我记住自己的路线，也知道谁和我一样跑近。
  question: 需要较短接应时，哪两个人在浅区？
