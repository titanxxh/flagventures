  note: 有路线的球员从 0 秒展开，各用 10 秒走完已画路径；这是读图教学节奏，不是来源规定的统一跑速、启动先后或传球时刻。视频逐人讲解的顺序不作为启动顺序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X 的 Option 与 C 的 Out 负责浅区；Y 的 In 与 Z 的 Post 提供较深接球点。
  - id: spread
    at: 2.5
    label: 展开 · 看方向
    cue: 找出短路线 X/C 与较深路线 Y/Z。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 比较 X 的 Option 转向与 Y、Z 的内切，记住不同深度。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 需要较短接应时，哪两个人在浅区？
notes:
  - 画面只演示进攻路线，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p33 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
