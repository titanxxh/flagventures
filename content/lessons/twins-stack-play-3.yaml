  en:
    title.zh: TWINS STACK PLAY 3
    summary: X's Option and C's Out offer shallow targets. Y's In and Z's Post offer deeper targets.
    teaching.goal: Combine two short routes with two deeper options.
    teaching.cooperation: X's Option and C's Out offer shallow targets. Y's In and Z's Post offer deeper targets.
    teaching.cue: Know my route and who else stays shallow.
    teaching.question: Who offers the two shorter options?
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork explanations also
      use NFL FLAG’s official article and videos. Child-friendly cues, questions and animation timing are
      teaching adaptations.
    source.references.0.title: NFL FLAG · Twins Stack play explanations
    source.references.0.locator: Twins Stack · Play 3
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
    source.references.1.title: NFL FLAG · Twins Stack video
    source.references.1.locator: 1:06–1:25
