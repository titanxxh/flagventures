# Editable bilingual five-player teaching adaptation. See source for its exact scope.
format: flag-lesson
version: 1
id: concept-mesh
kind: offense
title:
  en: Mesh
  zh: Mesh · 浅区相向交叉
teaching:
  goal: 看见队友并保持交叉间距。
  cooperation: X、Y 从两侧相向浅交叉，深度错开 2 码；C 回接、Z 拉深，交叉时不主动挡人。
  cue: 看队友，留间距，继续跑。
  question: 两人相向跑时，谁在更深的那一条通道？
source:
  references:
    - url: https://static.www.nfl.com/image/upload/league/w7jrxyki5ffvoncw3ckg.pdf#page=6
      role: primary
      kind: concept
      title: NFL FLAG · Training Resources
      publisher: NFL FLAG
      locator: PDF 第 6 页 · Mesh 概念图
      scope: Mesh 核心路线的相对方向与层次；不提供完整五人、精确码数或秒数。
  title: NFL FLAG · Training Resources
  note: 已核对第 6 页对应的两至三人概念图；原图不是完整五人跑位脚本。
  adaptation: 本课将来源配合整理为完整五人教学：额外队友任务与站位由本项目补齐。示意码数、配速、启动先后、QB 原地传球、四种传球结局与停点均为教学安排，不是官方固定读球顺序。
field:
  width: 30
  height: 36
  unit: yard
  attackDirection: up
  lineOfScrimmageY: 28
players:
  - id: Q
    team: offense
    at:
      - 15
      - 33
    color: '#ff9690'
    label:
      en: QB
      basis: author
      zh: 四分卫
      description: 接到开球后留在线后，按当前选择传给队友；原地传球是本课教学安排。
    motion:
      type: still
      note: 本例安排 QB 留在原地传球，方便比较队友接应；不是来源规定。
    coaching:
      cooperation: 观察队友提供的不同空间，四个选项用于分别讲解，不代表固定阅读顺序。
      timing: 0–0.35 秒接开球，传球时刻随所选目标变化；秒数不是比赛规定。
  - id: C
    team: offense
    at:
      - 15
      - 28
    color: '#fff1d5'
    label:
      en: Hitch
      basis: author
      zh: 急停回身
      description: 先直跑 10 码，再朝 QB 一侧回接到 8 码深处，并面向 QB；这些码数是教学示例。
      note: 这名队友的路线由本项目补齐，帮助展示完整五人配合。
    motion:
      type: path
      startAt: 0.55
      steps:
        - type: line
          to:
            - 15
            - 18
          seconds: 3.8
        - type: line
          to:
            - 16
            - 20
          seconds: 1.8
          facePlayer: Q
        - type: pause
          seconds: 3.85
          facePlayer: Q
    coaching:
      cooperation: 在两条浅交叉前方更深的位置回接，避免挤进交叉通道。
      timing: 示范从 0.55 秒启动；回放秒数、终点停留仅方便讲解，不能当作固定比赛节奏。
  - id: X
    team: offense
    at:
      - 5
      - 28
    color: '#80d4ff'
    label:
      en: Shallow cross
      basis: author
      zh: 浅区横穿
      description: 先斜向前到 3 码深处，再向右横穿；保持在 Y 后方较浅的通道。
      note: 核心路线关系来自本课原始资料；角色、精确坐标与配速为教学整理。
    motion:
      type: path
      startAt: 0.55
      steps:
        - type: line
          to:
            - 8
            - 25
          seconds: 2.2
        - type: line
          to:
            - 27
            - 25
          seconds: 7
        - type: pause
          seconds: 0.25
          facePlayer: Q
    coaching:
      cooperation: 与 Y 相向通过，不主动阻挡，保持自己的深度。
      timing: 示范从 0.55 秒启动；回放秒数、终点停留仅方便讲解，不能当作固定比赛节奏。
  - id: 'Y'
    team: offense
    at:
      - 25
      - 28
    color: '#c7e8a2'
    label:
      en: Shallow cross
      basis: author
      zh: 浅区横穿
      description: 先斜向前到 5 码深处，再向左横穿，比 X 深 2 码；间距与到达时刻为教学安排。
      note: 核心路线关系来自本课原始资料；角色、精确坐标与配速为教学整理。
    motion:
      type: path
      startAt: 0.55
      steps:
        - type: line
          to:
            - 22
            - 23
          seconds: 2.8
        - type: line
          to:
            - 3
            - 23
          seconds: 6.4
        - type: pause
          seconds: 0.25
          facePlayer: Q
    coaching:
      cooperation: 从 X 前方的另一条通道通过，看清队友，不跑进同一个点。
      timing: 示范从 0.55 秒启动；回放秒数、终点停留仅方便讲解，不能当作固定比赛节奏。
  - id: Z
    team: offense
    at:
      - 28
      - 28
    color: '#ffc078'
    label:
      en: Go / Fly
      basis: author
      zh: 直线深跑
      description: 沿自己的通道直跑约 19–20 码，给队友留出浅区；这里的深度为教学选择。
      note: 这名队友的路线由本项目补齐，帮助展示完整五人配合。
    motion:
      type: path
      startAt: 0.55
      steps:
        - type: line
          to:
            - 28
            - 8
          seconds: 9.45
    coaching:
      cooperation: 把路线拉深，与短接应保持纵向距离。
      timing: 示范从 0.55 秒启动；回放秒数、终点停留仅方便讲解，不能当作固定比赛节奏。
timeline:
  duration: 10
  basis: illustration
  note: 10 秒展示完整路线。先开球，再启动；角色说明中的启动先后与间距均属教学安排。切换目标可比较不同传球窗口，没有规定 QB 必须按按钮顺序读球。
keyframes:
  - id: start
    at: 0
    label: 看站位
    cue: 先找到 QB 和自己，再指出关键队友。
  - id: separate
    at: 2.55
    label: 开始分开
    cue: 看队友，留间距，继续跑。
  - id: cooperate
    at: 4.7
    label: 看配合空间
    cue: X、Y 从两侧相向浅交叉，深度错开 2 码；C 回接、Z 拉深，交叉时不主动挡人。
  - id: end
    at: 10
    label: 回想全队
    cue: 两人相向跑时，谁在更深的那一条通道？
notes:
  - 按码绘制 30 × 36 码教学区域，不是整片比赛场地。原概念未规定精确距离；本课码数由项目选择，实际练习与教练约定。
  - 向内是向场地中间，向外是向边线；QB 是传球参照，不是每条内切路线必须跑到的位置。
translations:
  en:
    title.zh: Mesh · Passing concept
    summary: >-
      X and Y cross from opposite sides with a 2-yard depth gap; C returns and Z goes deep. The cross does not instruct
      players to block.
    teaching.goal: See your teammate and keep space through the cross.
    teaching.cooperation: >-
      X and Y cross from opposite sides with a 2-yard depth gap; C returns and Z goes deep. The cross does not instruct
      players to block.
    teaching.cue: See your teammate, keep space, keep running.
    teaching.question: When the two approach each other, who uses the deeper lane?
    source.title: NFL FLAG · Training Resources
    source.note: >-
      The corresponding two- or three-receiver concept diagram on PDF page 6 was checked. It is not a complete
      five-player script.
    source.adaptation: >-
      This lesson develops the source into a complete five-player teaching example. Additional roles and starting
      positions are authored additions. Distances, pace, starts, a stationary QB, four passing outcomes and pauses are
      teaching choices, not an official read order.
    source.references.0.title: NFL FLAG · Training Resources
    source.references.0.publisher: NFL FLAG
    source.references.0.locator: PDF page 6 · Mesh concept diagram
    source.references.0.scope: Relative directions and levels of the core Mesh routes, not all five players, exact yards or seconds.
    players.Q.label.zh: Quarterback
    players.Q.label.description: Receive the snap and stay behind the line, passing to the selected teammate. Staying still is a teaching choice.
    players.Q.coaching.cooperation: >-
      Observe the different spaces receivers offer. The four examples are separate demonstrations, not a fixed read
      order.
    players.Q.coaching.timing: >-
      Receive the snap at 0–0.35 seconds; throw timing varies with the selected target. Seconds are not game
      requirements.
    players.Q.motion.note: QB stays still in this example to help compare receivers; the source does not require this.
    players.C.label.zh: Hitch
    players.C.label.description: Run 10 yards upfield, then return toward QB to 8 yards deep and face QB. These distances are teaching examples.
    players.C.label.note: This teammate’s route was added by the project to complete the five-player example.
    players.C.coaching.cooperation: Return deeper than the two shallow crosses, keeping their lanes clear.
    players.C.coaching.timing: The example starts at 0.55 seconds; playback timing and the final pause aid explanation, not a fixed game cadence.
    players.X.label.zh: Shallow cross
    players.X.label.description: Angle forward to 3 yards deep, then cross right, staying in the shallower lane behind Y.
    players.X.label.note: >-
      The core route relationship follows this lesson’s source; roles, exact coordinates and pacing are teaching
      adaptations.
    players.X.coaching.cooperation: Pass opposite Y without intentionally obstructing; keep your own depth.
    players.X.coaching.timing: The example starts at 0.55 seconds; playback timing and the final pause aid explanation, not a fixed game cadence.
    players.Y.label.zh: Shallow cross
    players.Y.label.description: >-
      Angle forward to 5 yards deep, then cross left, 2 yards deeper than X. The gap and arrival times are teaching
      choices.
    players.Y.label.note: >-
      The core route relationship follows this lesson’s source; roles, exact coordinates and pacing are teaching
      adaptations.
    players.Y.coaching.cooperation: Use the lane upfield of X, watch your teammate and avoid the same crossing point.
    players.Y.coaching.timing: The example starts at 0.55 seconds; playback timing and the final pause aid explanation, not a fixed game cadence.
    players.Z.label.zh: Go / Fly
    players.Z.label.description: >-
      Run straight about 19–20 yards in your own lane, leaving the underneath area for teammates. This depth is a
      teaching choice.
    players.Z.label.note: This teammate’s route was added by the project to complete the five-player example.
    players.Z.coaching.cooperation: Stretch the route deep and separate vertically from short outlets.
    players.Z.coaching.timing: The example starts at 0.55 seconds; playback timing and the final pause aid explanation, not a fixed game cadence.
    timeline.note: >-
      The full routes run over a 10-second demonstration: snap first, then release. The starts and spacing identified in
      the player notes are teaching choices. Switch targets to compare passing windows; button order is not a QB read
      order.
    keyframes.start.label: Alignment
    keyframes.start.cue: Find QB and yourself, then identify the key teammate.
    keyframes.separate.label: Start separating
    keyframes.separate.cue: See your teammate, keep space, keep running.
    keyframes.cooperate.label: See the passing spaces
    keyframes.cooperate.cue: >-
      X and Y cross from opposite sides with a 2-yard depth gap; C returns and Z goes deep. The cross does not instruct
      players to block.
    keyframes.end.label: Recall the whole team
    keyframes.end.cue: When the two approach each other, who uses the deeper lane?
    ball.note: >-
      All four passes are teaching examples, not an official target or QB read order. Only successful catches are
      illustrated; seconds are not game timing.
    ball.scenarios.pass-c.title: Pass to C
    ball.scenarios.pass-c.note: Show C’s catch window while teammates retain their complete routes.
    ball.scenarios.pass-c.events.snap.label: C snaps
    ball.scenarios.pass-c.events.snap.endLabel: QB receives snap
    ball.scenarios.pass-c.events.snap.cue: The ball travels from center to QB before receivers release.
    ball.scenarios.pass-c.events.snap.endCue: QB now holds the ball; watch the teammates next.
    ball.scenarios.pass-c.events.throw.label: QB throws to C
    ball.scenarios.pass-c.events.throw.endLabel: C catches
    ball.scenarios.pass-c.events.throw.cue: Watch the ball travel to where C will arrive.
    ball.scenarios.pass-c.events.throw.endCue: C catches; the ball then follows the carrier.
    ball.scenarios.pass-x.title: Pass to X
    ball.scenarios.pass-x.note: Show X’s catch window while teammates retain their complete routes.
    ball.scenarios.pass-x.events.snap.label: C snaps
    ball.scenarios.pass-x.events.snap.endLabel: QB receives snap
    ball.scenarios.pass-x.events.snap.cue: The ball travels from center to QB before receivers release.
    ball.scenarios.pass-x.events.snap.endCue: QB now holds the ball; watch the teammates next.
    ball.scenarios.pass-x.events.throw.label: QB throws to X
    ball.scenarios.pass-x.events.throw.endLabel: X catches
    ball.scenarios.pass-x.events.throw.cue: Watch the ball travel to where X will arrive.
    ball.scenarios.pass-x.events.throw.endCue: X catches; the ball then follows the carrier.
    ball.scenarios.pass-y.title: Pass to Y
    ball.scenarios.pass-y.note: Show Y’s catch window while teammates retain their complete routes.
    ball.scenarios.pass-y.events.snap.label: C snaps
    ball.scenarios.pass-y.events.snap.endLabel: QB receives snap
    ball.scenarios.pass-y.events.snap.cue: The ball travels from center to QB before receivers release.
    ball.scenarios.pass-y.events.snap.endCue: QB now holds the ball; watch the teammates next.
    ball.scenarios.pass-y.events.throw.label: QB throws to Y
    ball.scenarios.pass-y.events.throw.endLabel: Y catches
    ball.scenarios.pass-y.events.throw.cue: Watch the ball travel to where Y will arrive.
    ball.scenarios.pass-y.events.throw.endCue: Y catches; the ball then follows the carrier.
    ball.scenarios.pass-z.title: Pass to Z
    ball.scenarios.pass-z.note: Show Z’s catch window while teammates retain their complete routes.
    ball.scenarios.pass-z.events.snap.label: C snaps
    ball.scenarios.pass-z.events.snap.endLabel: QB receives snap
    ball.scenarios.pass-z.events.snap.cue: The ball travels from center to QB before receivers release.
    ball.scenarios.pass-z.events.snap.endCue: QB now holds the ball; watch the teammates next.
    ball.scenarios.pass-z.events.throw.label: QB throws to Z
    ball.scenarios.pass-z.events.throw.endLabel: Z catches
    ball.scenarios.pass-z.events.throw.cue: Watch the ball travel to where Z will arrive.
    ball.scenarios.pass-z.events.throw.endCue: Z catches; the ball then follows the carrier.
    notes.0: >-
      A 30 × 36 yard teaching area, not the entire game field. The source concept does not specify exact distances;
      these are teaching choices to agree with your coach.
    notes.1: >-
      Inside means toward the field middle; outside means toward a sideline. QB is a passing reference, not the
      destination of every inward route.
    relatedLessons.single-back-play-3.title: SINGLE BACK PLAY 3
    relatedLessons.single-back-play-3.note: >-
      Both allow comparison of shallow crossing routes. The book has its own alignment and assignments; this lesson
      builds around Mesh’s opposing shallow cross and adds C and Z. The names and full scripts are not interchangeable.
summary: X、Y 从两侧相向浅交叉，深度错开 2 码；C 回接、Z 拉深，交叉时不主动挡人。
ball:
  initialOwner: C
  defaultScenario: pass-x
  scenarios:
    - id: pass-c
      basis: illustration
      events:
        - id: snap
          type: snap
          from: C
          to: Q
          at: 0
          endAt: 0.35
          label: C 开球
          endLabel: QB 接到开球
          cue: 球从中锋来到 QB，接手随后展开。
          endCue: QB 已持球；接下来观察队友。
        - id: throw
          type: pass
          from: Q
          to: C
          at: 4.5
          endAt: 5.2
          label: QB 传给 C
          endLabel: C 接球
          cue: 看球飞向 C 将到达的位置。
          endCue: C 接到球，球随后跟着持球者移动。
      title: 传给 C
      note: 选择 C 的接球窗口，其他队友仍跑完整路线。
    - id: pass-x
      basis: illustration
      events:
        - id: snap
          type: snap
          from: C
          to: Q
          at: 0
          endAt: 0.35
          label: C 开球
          endLabel: QB 接到开球
          cue: 球从中锋来到 QB，接手随后展开。
          endCue: QB 已持球；接下来观察队友。
        - id: throw
          type: pass
          from: Q
          to: X
          at: 6.3
          endAt: 7
          label: QB 传给 X
          endLabel: X 接球
          cue: 看球飞向 X 将到达的位置。
          endCue: X 接到球，球随后跟着持球者移动。
      title: 传给 X
      note: 选择 X 的接球窗口，其他队友仍跑完整路线。
    - id: pass-y
      basis: illustration
      events:
        - id: snap
          type: snap
          from: C
          to: Q
          at: 0
          endAt: 0.35
          label: C 开球
          endLabel: QB 接到开球
          cue: 球从中锋来到 QB，接手随后展开。
          endCue: QB 已持球；接下来观察队友。
        - id: throw
          type: pass
          from: Q
          to: 'Y'
          at: 6.5
          endAt: 7.2
          label: QB 传给 Y
          endLabel: Y 接球
          cue: 看球飞向 Y 将到达的位置。
          endCue: Y 接到球，球随后跟着持球者移动。
      title: 传给 Y
      note: 选择 Y 的接球窗口，其他队友仍跑完整路线。
    - id: pass-z
      basis: illustration
      events:
        - id: snap
          type: snap
          from: C
          to: Q
          at: 0
          endAt: 0.35
          label: C 开球
          endLabel: QB 接到开球
          cue: 球从中锋来到 QB，接手随后展开。
          endCue: QB 已持球；接下来观察队友。
        - id: throw
          type: pass
          from: Q
          to: Z
          at: 7.3
          endAt: 8
          label: QB 传给 Z
          endLabel: Z 接球
          cue: 看球飞向 Z 将到达的位置。
          endCue: Z 接到球，球随后跟着持球者移动。
      title: 传给 Z
      note: 选择 Z 的接球窗口，其他队友仍跑完整路线。
  note: 四种传球都是教学示例，不代表官网规定唯一目标或 QB 阅读顺序；只演示成功接球，秒数不是比赛用时。
