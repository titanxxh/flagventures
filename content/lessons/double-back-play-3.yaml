id: double-back-play-3
kind: offense
title:
  zh: 双跑卫阵型 · 第 3 号战术
  en: DOUBLE BACK PLAY 3
summary: X 跑 Corner，Y 跑 Hitch，中锋与 Z 跑 Out，分布在不同接球区域。
teaching:
  goal: 从双后场站位展开多个接应方向。
  cooperation: X 的较深 Corner 与 Y 的 Hitch 错开位置，C、Z 的 Out 在两侧接应。
  cue: 每个人都记住自己的方向和搭档。
  question: 哪两个人向边线接应？谁的路线更深？
source:
