# Editable bilingual lesson; source links and teaching adaptations travel with the data.
format: flag-lesson
version: 1
id: double-back-play-3
kind: offense
title:
  zh: 双跑卫阵型 · 第 3 号战术
  en: DOUBLE BACK PLAY 3
summary: X 跑 Corner，Y 跑 Hitch，中锋与 Z 跑 Out，分布在不同接球区域。
teaching:
  goal: 从双后场站位展开多个接应方向。
  cooperation: X 的较深 Corner 与 Y 的 Hitch 错开位置，C、Z 的 Out 在两侧接应。
  cue: 每个人都记住自己的方向和搭档。
  question: 哪两个人向边线接应？谁的路线更深？
source:
  title: NFL FLAG Play Book · 英文原书（封面 2020）
  page: 41
  note: 跑位坐标来自用户附件，归一化后重绘，非实际码数；路线称呼与配合讲解补充自 NFL FLAG 官网和视频。儿童口令、提问与播放节奏为教学改写。
  references:
    - title: NFL FLAG · Double Back Set 战术说明
      url: https://nflflag.com/coaches/flag-football-rules/5-on-5-flag-football-playbook
      locator: Double Back Set · Play 3
      note: 官网的战术意图和相对先后建议；不作为精确秒表。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 对应战术的原作者讲解；不包含完整传球结局或精确秒数。
    - title: NFL FLAG · Double Back Set 视频
      url: https://www.youtube.com/watch?v=YLu-UNWGaYM&t=83s
      locator: 1:23–1:41
      note: 时间用于定位解说；逐人讲述不表示逐人启动。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 对应战术的原作者讲解；不包含完整传球结局或精确秒数。
    - url: >-
        https://nflstatic.s3.amazonaws.com/attachments/ckmqis77f02hv0jo0uvaxh5qq-nfl-flag-play-book-formations-prd-2.pdf#page=41
      role: primary
      kind: diagram
