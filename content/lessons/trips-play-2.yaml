  en: TRIPS PLAY 2
summary: Y、Z 向右侧深处展开，中锋与 X 交叉，尝试给 X 左侧接应创造机会。
teaching:
  goal: 用右侧深跑帮助左侧短接应。
  cooperation: Y 的 Corner 与 Z 的 Fly 尝试把防守带向右侧深处；X 与 C 交叉后利用另一侧。
  cue: 队友带向一边，我去另一边接应。
  question: 如果防守跟着 Y、Z，X 的哪一侧可能有机会？
