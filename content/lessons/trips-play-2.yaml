    players.Z.label.note: >-
      Name follows the official NFL FLAG explanation (1:00–1:28); direction and geometry retain the supplied
      diagram on page 20.
    players.Z.coaching.cooperation: Run a deep Fly right to help X on the opposite side.
    players.Z.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
