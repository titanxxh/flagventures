format: flag-lesson
version: 1
id: spread-play-2
kind: offense
title:
  zh: 分散阵型 · 第 2 号战术
  en: SPREAD PLAY 2
summary: X 向左牵动防守，Y、Z 提供较深选择；防守向左移动后，C 再向右接应。
teaching:
  goal: 先牵动一侧，再观察另一侧的接应机会。
  cooperation: X 向左的 Option 与 Y、Z 的较深路线形成牵制；C 的右侧释放以防守移动为条件。
  cue: 看队友把人带去哪，再找另一边。
  question: 如果防守向左移动，C 准备去哪个方向？
source:
  title: NFL FLAG 2024 中英文对照学习译本（用户附件）
  page: 12
  note: 跑位坐标来自用户附件，归一化后重绘，非实际码数；路线称呼与配合讲解补充自 NFL FLAG 官网和视频。儿童口令、提问与播放节奏为教学改写。
  references:
    - title: NFL FLAG · Spread 战术说明
      url: https://nflflag.com/coaches/flag-football-rules/5-on-5-flag-football-playbook
      locator: Spread · Play 2
      note: 官网的战术意图和相对先后建议；不作为精确秒表。
    - title: NFL FLAG · Spread 视频
      url: https://www.youtube.com/watch?v=QyMRYsCiXOs&t=46s
      locator: 0:46–1:13
      note: 时间用于定位解说；逐人讲述不表示逐人启动。
