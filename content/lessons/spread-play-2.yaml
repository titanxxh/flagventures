  en: SPREAD PLAY 2
summary: X 向左牵动防守，Y、Z 提供较深选择；防守向左移动后，C 再向右接应。
teaching:
  goal: 先牵动一侧，再观察另一侧的接应机会。
  cooperation: X 向左的 Option 与 Y、Z 的较深路线形成牵制；C 的右侧释放以防守移动为条件。
  cue: 看队友把人带去哪，再找另一边。
  question: 如果防守向左移动，C 准备去哪个方向？
source:
  title: NFL FLAG Play Book · 英文原书（封面 2020）
  page: 12
  note: 跑位坐标来自用户附件，归一化后重绘，非实际码数；路线称呼与配合讲解补充自 NFL FLAG 官网和视频。儿童口令、提问与播放节奏为教学改写。
