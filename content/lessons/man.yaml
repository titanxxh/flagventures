    at: 6.6
    label: 看另一组职责
    cue: 换一组看职责；人物仍只显示已知起点。
    view:
      zoneIds: []
      assignmentIds:
        - assignment-D3
        - assignment-D4
        - assignment-R
  - id: frame-4
    at: 10
    label: 合看全队分工
    cue: 一起指出每名防守者的对位、覆盖区域或冲传方向。
    view:
