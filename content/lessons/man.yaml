notes:
  - D 数字只是教学编号；原图观看方向保持不变。区域和虚线是职责示意，不是持续跑动轨迹。
  - 指示线保留原始起止位置，不自动连到球员中心，也不追加球、传球、动态追逐或交接。
translations:
  en:
    title.zh: NFL FLAG MAN
    summary: Explore defensive starting positions, matchups, coverage zones and any rush direction explicitly shown.
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Based on the supplied PDF. The Chinese study translation is unofficial; drawing coordinates are not
      actual yards.
    timeline.note: >-
      The timeline reveals teaching layers only; it does not represent defender start order or simulate
      pursuit.
    notes.0: >-
      D numbers are teaching IDs. The diagram keeps its original orientation. Zones and dashed lines show
      assignments, not continuous movement.
    notes.1: >-
      Guides keep their original endpoints rather than snapping to player centers. No ball, passes, pursuit or
      handoffs are added.
    players.Q.label.zh: Movement not specified
    players.Q.label.description: Only Q’s starting position is shown. Later movement is not specified.
    players.Q.motion.note: >-
      Only the known starting position is shown. Later movement is unspecified; this does not require standing
      still.
