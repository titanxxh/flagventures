    source.references.2.locator: Stop-N-Go
    source.references.2.note: >-
      Explains turning back toward the line to fake a Comeback catch, then turning upfield again; it
      also mentions a sidestep. Return and sidestep distances are not specified.
    source.references.3.title: NFL FLAG · Official route diagram (6–9)
    source.references.3.locator: 7 · STOP AND GO
    source.references.3.note: >-
      Shows the hook back and short sidestep after the stem, then a deep run outside the original
