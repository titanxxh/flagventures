# UTF-8; yard-scale teaching geometry and timing are shared across languages.
format: flag-lesson
version: 1
id: route-stop-and-go
kind: route
title:
  zh: 7 · 停后再冲
  en: STOP AND GO
summary: STOP AND GO · 本图先直跑约 7 码，短暂停住做出接短球的样子，再沿原方向跑深；演示到 20 码。
teaching:
  goal: 本图先直跑约 7 码，短暂停住做出接短球的样子，再沿原方向跑深；演示到 20 码。
  cooperation: 短暂停顿让动作看起来像给 QB 提供短传接应，随后继续向前跑深。这里未规定 QB 必须假传或何时出手。
  cue: 跑、停一下、再冲。
  question: 如果你在停住之后不再跑，这还是 Stop and Go 吗？
source:
  title: NFL FLAG 路线教学 · 附件名称与官网说明
  page: 4
  note: >-
    名称和原书编号保留自附件；跑法补充自 NFL FLAG 官网。图形重新绘制为码数比例：场地 30 × 70 码，含两端各 10 码端区；距离从开球线计。首次假停采用官方路线树的约 7 码示例；停 1 秒与最终跑到
    20 码是本图设置，不是官方规定。QB 站位和动画时长是教学设置，不是原 PDF 路线描摹、官方比赛用时或指定传球时刻。
  references:
    - title: NFL FLAG · 路线树说明
      url: https://nflflag.com/coaches/default/flag-football-rules/flag-football-plays
      locator: STOP AND GO
      note: 用于核对跑法名称与转向；本站中文说明、儿童口令和图形为教学改写。
    - title: NFL FLAG · 球场尺寸
      url: https://nflflag.com/coaches/flag-football-rules/how-to-play-flag-football
      locator: Flag Football Field
      note: 全场宽 30 码、长 70 码，含两端各 10 码端区；本图开球线和 QB 站位为教学选择。
field:
  width: 30
  height: 70
  unit: yard
  endZoneDepth: 10
  attackDirection: up
  lineOfScrimmageY: 50
players:
  - id: X
    team: offense
    at:
      - 8
      - 50
    color: '#80d4ff'
    name: 接球手 X
    label:
      zh: 停后再冲
      en: STOP AND GO
      description: 本图先直跑约 7 码，短暂停住做出接短球的样子，再沿原方向跑深；演示到 20 码。
      basis: source
      note: 路线形状依据 NFL FLAG 官网。首次假停采用官方路线树的约 7 码示例；停 1 秒与最终跑到 20 码是本图设置，不是官方规定。具体深度应与教练和 QB 约定。
    motion:
      type: path
      startAt: 0
      steps:
        - type: line
          to:
            - 8
            - 43
          seconds: 3
        - type: pause
          seconds: 1
        - type: line
          to:
            - 8
            - 30
          seconds: 6
    coaching:
      cooperation: 短暂停顿让动作看起来像给 QB 提供短传接应，随后继续向前跑深。这里未规定 QB 必须假传或何时出手。
      timing: 演示从 0 秒开始，10 秒走完；转折关键帧帮助记忆动作，没有规定开球后必须等待几秒。
  - id: QB
    team: offense
    at:
      - 15
      - 55
    color: '#ff9690'
    name: 四分卫 QB
    label:
      zh: 四分卫位置参照
      en: QB
      description: 本图 QB 位于开球线后方 5 码、场地横向中间，帮助辨认接球手相对 QB 的方向；这是教学站位，不要求比赛中 QB 必须这样站或保持不动。
      basis: author
      note: 为比较基础路线新增的教学站位，不是原 PDF 规定的 QB 位置。
    motion:
      type: still
      note: 教学参照：保持图标原位，不演示真实 QB 的后撤、传球或跑动。
    coaching:
      cooperation: 观察 X 是向中间、边线还是深处移动；传球路线与传球时刻未在此图规定。
      timing: 图标全程静止仅为定位参照，不表示真实比赛中的启动顺序。
timeline:
  duration: 10
  basis: illustration
  note: 动画总长 10 秒，仅展示动作先后；图形和距离刻度按码数绘制，播放秒数不是实跑用时，不能用秒数换算码数。QB 静止只是位置参照。
keyframes:
  - id: start
    at: 0
    label: 起始站位
    cue: 从开球线的 0 码开始看：X 在左侧，QB 在后方 5 码的中间。上方是进攻方向，“内”指场地中间。
  - id: stop
    at: 3
    label: 约 7 码假停
    cue: 从开球线跑到约 7 码处假停；动画用 1 秒让小朋友看清，之后还要再跑。
  - id: go
    at: 4
    label: 从 7 码继续向前
    cue: 停顿结束，从 7 码位置沿同一条线继续向前；本图终点设为 20 码。
  - id: end
    at: 10
    label: 动作完成
    cue: 说出 STOP AND GO，按「跑、停一下、再冲。」用手指画一遍。
notes:
  - 全场按码数比例绘制：30 码宽、70 码长，含两端各 10 码端区。X 从左侧开球线起跑，QB 在后方 5 码作参照；这不是完整五人阵型。
  - QB 的静止站位只是教学参照；这里不演示开球、传球、后撤步或防守。距离标签标明官方示例或教学设置；真实路线深度、传球时机和练习距离由教练与 QB 约定。
translations:
  en:
    summary: >-
      STOP AND GO · In this example, run about 7 yards, briefly stop as if preparing for a short catch, then
      continue deep along the same line; the drawing ends at 20 yards.
    title.zh: 7 · STOP AND GO
    source.title: NFL FLAG route lesson · PDF names and official explanations
    source.note: >-
      Names and original numbering are retained from the PDF; route explanations are supplemented from NFL
      FLAG. The diagram is redrawn in yards on a 30 × 70-yard field, including two 10-yard end zones; depths
      are measured from the line of scrimmage. The first stop uses the route tree’s roughly 7-yard example.
      The one-second pause and 20-yard endpoint are drawing choices, not official requirements. QB placement
      and animation duration are teaching choices, not a PDF tracing, official game timing or prescribed throw
      time.
    source.references.0.title: NFL FLAG · Route tree guide
    source.references.0.locator: STOP AND GO
    source.references.0.note: >-
      Used for route names and directions. Chinese explanations, child-friendly cues and diagrams are teaching
      adaptations.
    notes.0: >-
      The field is drawn to yard scale: 30 yards wide and 70 long, including two 10-yard end zones. X starts
      on the left of the line, with QB 5 yards behind as a reference; this is not a full five-player
      formation.
    notes.1: >-
      The stationary QB is a teaching reference; snaps, passes, dropbacks and defense are not animated.
      Distance labels distinguish official examples from teaching choices. Agree on actual route depths,
      passing timing and practice distances with your coach and QB.
    teaching.goal: >-
      In this example, run about 7 yards, briefly stop as if preparing for a short catch, then continue deep
      along the same line; the drawing ends at 20 yards.
    teaching.cooperation: >-
      The brief stop suggests a short target for the QB before you continue deep. This example does not
      require a QB pump fake or prescribe a release time.
    teaching.cue: Run, stop, then go.
    teaching.question: If you stop and never go again, is it still Stop and Go?
    players.X.name: Receiver X
    players.X.label.zh: STOP AND GO
    players.X.label.description: >-
      In this example, run about 7 yards, briefly stop as if preparing for a short catch, then continue deep
      along the same line; the drawing ends at 20 yards.
    players.X.label.note: >-
      The route shape follows NFL FLAG. The first stop uses the route tree’s roughly 7-yard example. The
      one-second pause and 20-yard endpoint are drawing choices, not official requirements. Agree on actual
      depths with your coach and QB.
    players.X.coaching.cooperation: >-
      The brief stop suggests a short target for the QB before you continue deep. This example does not
      require a QB pump fake or prescribe a release time.
    players.X.coaching.timing: >-
      The demonstration runs from 0 to 10 seconds. Keyframes mark movement changes; they do not prescribe a
      delay after the snap.
    players.QB.name: Quarterback QB
    players.QB.label.zh: Quarterback reference
    players.QB.label.description: >-
      QB is drawn 5 yards behind the line at the field’s horizontal center to show relative direction. This is
      a teaching position, not a required game stance or instruction to stand still.
    players.QB.label.note: An added reference position for comparing routes, not a QB position prescribed by the PDF.
    players.QB.motion.note: 'Teaching reference: keep the marker fixed; actual QB dropbacks, passes and runs are not shown.'
    players.QB.coaching.cooperation: >-
      Watch whether X moves toward the middle, sideline or deeper upfield. Pass trajectory and release time
      are not specified.
    players.QB.coaching.timing: The marker stays fixed only as a positional reference, not to specify real-game movement order.
    timeline.note: >-
      The ten-second animation only shows movement order. Geometry and depth marks use yards; playback seconds
      are not real running time and cannot be converted into yardage. QB stays still as a positional
      reference.
    keyframes.start.label: Starting positions
    keyframes.start.cue: >-
      Start at zero on the line of scrimmage: X is on the left and QB is centered 5 yards behind. Attack goes
      upward; inside means toward the field center.
    keyframes.stop.label: Fake stop at about 7 yd
    keyframes.stop.cue: >-
      Stop briefly about 7 yards beyond the line. The animation pauses for one second so the move is visible;
      you still go again.
    keyframes.go.label: Go again from 7 yd
    keyframes.go.cue: The pause ends. Continue straight from the 7-yard mark; this drawing ends at 20 yards.
    keyframes.end.label: Route complete
    keyframes.end.cue: 'Say STOP AND GO, then trace the route: “Run, stop, then go.”'
    source.references.1.title: NFL FLAG · Field dimensions
    source.references.1.locator: Flag Football Field
    source.references.1.note: >-
      The field is 30 yards wide and 70 yards long, including two 10-yard end zones. The illustrated line of
      scrimmage and QB position are teaching choices.
    routeGuide.note: >-
      Depth is measured from the line of scrimmage. The first stop uses the route tree’s roughly 7-yard
      example. The one-second pause and 20-yard endpoint are drawing choices, not official requirements. Other
      remaining lengths and QB’s position 5 yards behind the line are teaching choices; agree on practice
      distances with your coach and QB.
    routeGuide.marks.stop.label: Fake stop at about 7 yd
    routeGuide.marks.stop.note: >-
      The official route tree demonstrates a stop at about 7 yards before going again. It does not specify the
      pause length or final depth.
routeGuide:
  player: X
  note: 距离从开球线计算。首次假停采用官方路线树的约 7 码示例；停 1 秒与最终跑到 20 码是本图设置，不是官方规定。其余后段长度及 QB 在开球线后 5 码的站位是教学设置；具体练习距离与教练、QB 约定。
  marks:
    - id: stop
      step: 0
      label: 约 7 码假停
      basis: source-example
      note: 官方路线树示例在约 7 码处假停后再跑；并未指定停多久或最终跑多远。
      sourceReference: 0
