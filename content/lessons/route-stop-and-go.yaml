routeGuide:
  player: X
  note: >-
    深度从开球线计。首次约 7 码来自官方示例；向 QB 回跑约 2 码后，纵向深度约为 5.3 码。回跑、横移约 2 码、暂停 1 秒及最终 20
    码深度都是本图教学设置；回跑长度与纵向深度减少量不同。
  marks:
    - id: stop
      step: 0
      label: 约 7 码开始钩回
      basis: source-example
      note: 官方路线树以约 7 码示范首次停与转；图示有回身钩回，后续回跑和横移距离未指定。
      sourceReference: 0
    - id: fake-catch
      step: 1
      label: 回钩后约 5.3 码深度
      basis: illustration
      note: 本图从 7 码顶点向 QB 回跑约 2 码，纵向深度减至约 5.3 码；随后面向 QB 停 1 秒假接。这些距离与秒数是教学设置。
