    routeGuide.marks.stop.label: Hook back at about 7 yd
    routeGuide.marks.stop.note: >-
      The route tree demonstrates the first stop and turn after about 7 yards. Its image shows a
      hook back without specifying return or sidestep distances.
    keyframes.fake-catch.label: Face QB for the fake catch
    keyframes.fake-catch.cue: >-
      After returning roughly 2 yards toward QB, depth is about 5.3 yards. Face QB as if taking a
      short catch. The return distance and one-second pause are illustrative.
    keyframes.deep.label: Go deep from the outside
    keyframes.deep.cue: >-
      You are now outside the original stem. Continue upfield toward the end zone; the drawing ends
      at 20-yard depth as a teaching choice.
    routeGuide.marks.fake-catch.label: Fake catch at about 5.3 yd depth
    routeGuide.marks.fake-catch.note: >-
      The drawing returns about 2 yards toward QB from the 7-yard peak, reducing depth to about 5.3
      yards, then faces QB for a one-second fake catch. These values are illustrative.
