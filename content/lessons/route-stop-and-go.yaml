# Editable bilingual lesson; source links and teaching adaptations travel with the data.
format: flag-lesson
version: 1
id: route-stop-and-go
kind: route
title:
  zh: 7 · 停后再冲
  en: STOP AND GO
summary: STOP AND GO · 先直跑约 7 码，再钩回面向 QB，假装接短球；随后向外侧短横移，再向前跑深。本图回跑约 2 码、横移约 2 码，终点为 20 码深度。
teaching:
  goal: 先直跑约 7 码，再钩回面向 QB，假装接短球；随后向外侧短横移，再向前跑深。本图回跑约 2 码、横移约 2 码，终点为 20 码深度。
  cooperation: 用回身、钩回和假接动作给 QB 提供短传接应的样子，再向外转出跑深。这里不演示真实传球，也不规定 QB 必须假传或何时出手。
  cue: 先跑深，钩回假接，转出再冲。
  question: 回身假装接短球之后，是继续站住，还是转出再向前跑？
source:
  title: NFL FLAG 路线教学 · 附件名称与官网说明
  page: 4
  note: >-
    名称和原书编号保留自附件；动作以 NFL FLAG 官网路线树图文为主，训练页补充回身细节。场地按 30 × 70 码绘制，含两端各 10 码端区；距离从开球线计算。首次约 7
    码采用官方路线树示例。官网图中有钩回和短横移，训练页解释是假装 Comeback 后再跑深。本图向 QB 回跑约 2 码、横移约 2 码、暂停 1 秒及最终 20 码深度均为教学设置。QB
    站位和所有动画秒数均为教学设置，不是比赛规定、指定传球时刻或原 PDF 路线描摹。
  references:
    - title: NFL FLAG · 路线树说明
      url: https://nflflag.com/coaches/default/flag-football-rules/flag-football-plays
      locator: STOP AND GO
      note: 正文给出先跑约 7 码再停后起跑；图中还画出回身钩回、短横移，再从外侧继续跑深。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 本条跑法的方向、名称或图示；具体示意距离另见距离说明。
    - title: NFL FLAG · 球场尺寸
      url: https://nflflag.com/coaches/flag-football-rules/how-to-play-flag-football
      locator: Flag Football Field
      note: 全场宽 30 码、长 70 码，含两端各 10 码端区；本图开球线和 QB 站位为教学选择。
      role: supporting
      kind: rules
      publisher: NFL FLAG
      scope: 辅助理解规则或场地，不作为本条战术的原图出处。
    - title: NFL FLAG · 接球手训练
      url: https://nflflag.com/coaches/default/football-drills/wide-receiver-drills
      locator: Stop-N-Go
      note: 解释向开球线回身、假装 Comeback 接短球，然后再次转身跑深；提示可侧步摆脱。没有给回撤和横移的精确距离。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 本条跑法的方向、名称或图示；具体示意距离另见距离说明。
    - title: NFL FLAG · 官方路线图（6–9）
      url: >-
        https://nflstatic.s3.amazonaws.com/attachments/ckhmre5uq232e0jlg1wnfqwlr-screen-shot-2020-11-17-at-8-00-34-pm.max.png
      locator: 7 · STOP AND GO
      note: 图示在直跑后钩回、短横移，再从原直跑线外侧向前；各短段长度按本应用的教学尺度绘制。
      role: primary
      kind: diagram
      publisher: NFL FLAG
      scope: 本条跑法的方向、名称或图示；具体示意距离另见距离说明。
  adaptation: 路线按码重绘；未由来源规定的距离、回接点与播放秒数为教学示例，具体区别见距离说明。
field:
  width: 30
  height: 70
  unit: yard
  endZoneDepth: 10
  attackDirection: up
  lineOfScrimmageY: 50
players:
  - id: X
    team: offense
    at:
      - 8
      - 50
    color: '#80d4ff'
    name: 接球手 X
    label:
      zh: 停后再冲
      en: STOP AND GO
      description: 先直跑约 7 码，再钩回面向 QB，假装接短球；随后向外侧短横移，再向前跑深。本图回跑约 2 码、横移约 2 码，终点为 20 码深度。
      basis: source
      note: >-
        首次约 7 码采用官方路线树示例。官网图中有钩回和短横移，训练页解释是假装 Comeback 后再跑深。本图向 QB 回跑约 2 码、横移约 2 码、暂停 1 秒及最终 20
        码深度均为教学设置。动作顺序以官网图文核对；小三角在钩回和假接时面向 QB。
    motion:
      type: path
      startAt: 0
      steps:
        - type: line
          to:
            - 8
            - 43
          seconds: 3
        - type: line
          to:
            - 9.007742051
            - 44.727557802
          seconds: 0.75
          facePlayer: QB
        - type: pause
          seconds: 1
          facePlayer: QB
        - type: line
          to:
            - 7
            - 44.727557802
          seconds: 0.75
        - type: line
          to:
            - 7
            - 30
          seconds: 4.5
    coaching:
      cooperation: 用回身、钩回和假接动作给 QB 提供短传接应的样子，再向外转出跑深。这里不演示真实传球，也不规定 QB 必须假传或何时出手。
      timing: 3 秒开始钩回，3.75 秒假接，4.75 秒向外转出，5.5 秒再跑深；假接停 1 秒及全部时长都是教学安排。
  - id: QB
    team: offense
    at:
      - 15
      - 55
    color: '#ff9690'
    name: 四分卫 QB
    label:
      zh: 四分卫位置参照
      en: QB
      description: 本图 QB 位于开球线后方 5 码、场地横向中间，帮助辨认接球手相对 QB 的方向；这是教学站位，不要求比赛中 QB 必须这样站或保持不动。
      basis: author
      note: 为比较基础路线新增的教学站位，不是原 PDF 规定的 QB 位置。
    motion:
      type: still
      note: 教学参照：保持图标原位，不演示真实 QB 的后撤、传球或跑动。
    coaching:
      cooperation: 观察 X 是向中间、边线还是深处移动；传球路线与传球时刻未在此图规定。
      timing: 图标全程静止仅为定位参照，不表示真实比赛中的启动顺序。
timeline:
  duration: 10
  basis: illustration
  note: 动画总长 10 秒，仅展示动作先后；图形和距离刻度按码数绘制，播放秒数不是实跑用时，不能用秒数换算码数。QB 静止只是位置参照。
keyframes:
  - id: start
    at: 0
    label: 起始站位
    cue: 从开球线的 0 码开始看：X 在左侧，QB 在后方 5 码的中间。上方是进攻方向，“内”指场地中间。
  - id: stop
    at: 3
    label: 约 7 码开始钩回
    cue: 先直跑约 7 码，现在转身面向 QB 并开始短回撤；不是只停在原地。
  - id: fake-catch
    at: 3.75
    label: 回钩后面向 QB 假接
    cue: 已向 QB 回跑约 2 码，当前深度约 5.3 码；面向 QB 假装准备接短球。回跑距离及 1 秒停顿为教学设置。
  - id: go
    at: 4.75
    label: 向外侧转出
    cue: 结束假接，向外侧短横移约 2 码，准备摆脱后再向前；横移距离为教学设置。
  - id: deep
    at: 5.5
    label: 从外侧再跑深
    cue: 已经转到原直跑线外侧，现在朝端区继续跑深；本图终点为 20 码深度，不是规定距离。
  - id: end
    at: 10
    label: 动作完成
    cue: 说出 STOP AND GO，按「先跑深，钩回假接，转出再冲。」用手指画一遍。
notes:
  - 全场按码数比例绘制：30 码宽、70 码长，含两端各 10 码端区。X 从左侧开球线起跑，QB 在后方 5 码作参照；这不是完整五人阵型。
  - QB 的静止站位只是教学参照；这里不演示开球、传球、后撤步或防守。距离标签标明官方示例或教学设置；真实路线深度、传球时机和练习距离由教练与 QB 约定。
translations:
  en:
    summary: >-
      STOP AND GO · Run about 7 yards, hook back facing QB as if taking a short catch, move briefly
      outside, then go deep. This drawing returns about 2 yards, sidesteps about 2 yards and ends at
      20-yard depth.
    title.zh: 7 · STOP AND GO
    source.title: NFL FLAG route lesson · PDF names and official explanations
    source.note: >-
      Names and original numbering are retained from the PDF. Movement follows the NFL FLAG route
      tree image and text, with receiver drills adding pivot details. The field is 30 × 70 yards
      including two 10-yard end zones; depth is measured from the line of scrimmage. The initial
      roughly 7 yards follow the route tree example. Its image shows a hook back and short sideways
      move; the receiver drill describes a fake Comeback before going deep. The roughly 2-yard
      return toward QB, roughly 2-yard sidestep, one-second pause and final 20-yard depth are
      teaching choices. QB placement and all animation durations are teaching choices, not game
      requirements, prescribed throw times or a tracing of the PDF.
    source.references.0.title: NFL FLAG · Route tree guide
    source.references.0.locator: STOP AND GO
    source.references.0.note: >-
      The text gives an initial run of about 7 yards before stopping and going; the image also shows
      the hook back and short sidestep before continuing deep on the outside.
    notes.0: >-
      The field is drawn to yard scale: 30 yards wide and 70 long, including two 10-yard end zones.
      X starts on the left of the line, with QB 5 yards behind as a reference; this is not a full
      five-player formation.
    notes.1: >-
      The stationary QB is a teaching reference; snaps, passes, dropbacks and defense are not
      animated. Distance labels distinguish official examples from teaching choices. Agree on actual
      route depths, passing timing and practice distances with your coach and QB.
    teaching.goal: >-
      Run about 7 yards, hook back facing QB as if taking a short catch, move briefly outside, then
      go deep. This drawing returns about 2 yards, sidesteps about 2 yards and ends at 20-yard
      depth.
    teaching.cooperation: >-
      Turn and hook back as if offering QB a short completion, then break outside and go deep. An
      actual pass is not animated, and no QB pump fake or throw time is prescribed.
    teaching.cue: Run deep, hook back and fake, break out and go.
    teaching.question: >-
      After turning back as if taking a short catch, do you stay there or break out and run deep
      again?
    players.X.name: Receiver X
    players.X.label.zh: STOP AND GO
    players.X.label.description: >-
      Run about 7 yards, hook back facing QB as if taking a short catch, move briefly outside, then
      go deep. This drawing returns about 2 yards, sidesteps about 2 yards and ends at 20-yard
      depth.
    players.X.label.note: >-
      The initial roughly 7 yards follow the route tree example. Its image shows a hook back and
      short sideways move; the receiver drill describes a fake Comeback before going deep. The
      roughly 2-yard return toward QB, roughly 2-yard sidestep, one-second pause and final 20-yard
      depth are teaching choices. The sequence follows the official image and text; the facing
      triangle points toward QB during the return and fake catch.
    players.X.coaching.cooperation: >-
      Turn and hook back as if offering QB a short completion, then break outside and go deep. An
      actual pass is not animated, and no QB pump fake or throw time is prescribed.
    players.X.coaching.timing: >-
      Hook back at 3 seconds, fake the catch at 3.75, break outside at 4.75 and go deep at 5.5. The
      one-second fake-catch pause and all durations are teaching choices.
    players.QB.name: Quarterback QB
    players.QB.label.zh: Quarterback reference
    players.QB.label.description: >-
      QB is drawn 5 yards behind the line at the field’s horizontal center to show relative
      direction. This is a teaching position, not a required game stance or instruction to stand
      still.
    players.QB.label.note: An added reference position for comparing routes, not a QB position prescribed by the PDF.
    players.QB.motion.note: 'Teaching reference: keep the marker fixed; actual QB dropbacks, passes and runs are not shown.'
    players.QB.coaching.cooperation: >-
      Watch whether X moves toward the middle, sideline or deeper upfield. Pass trajectory and
      release time are not specified.
    players.QB.coaching.timing: >-
      The marker stays fixed only as a positional reference, not to specify real-game movement
      order.
    timeline.note: >-
      The ten-second animation only shows movement order. Geometry and depth marks use yards;
      playback seconds are not real running time and cannot be converted into yardage. QB stays
      still as a positional reference.
    keyframes.start.label: Starting positions
    keyframes.start.cue: >-
      Start at zero on the line of scrimmage: X is on the left and QB is centered 5 yards behind.
      Attack goes upward; inside means toward the field center.
    keyframes.stop.label: Hook back at about 7 yd
    keyframes.stop.cue: >-
      After roughly 7 yards, turn toward QB and start a short return; do not merely remain
      stationary.
    keyframes.go.label: Break to the outside
    keyframes.go.cue: >-
      Finish the fake catch and move roughly 2 yards outside before running forward again. This
      sideways distance is a teaching choice.
    keyframes.end.label: Route complete
    keyframes.end.cue: 'Say STOP AND GO, then trace the route: “Run deep, hook back and fake, break out and go.”'
    source.references.1.title: NFL FLAG · Field dimensions
    source.references.1.locator: Flag Football Field
    source.references.1.note: >-
      The field is 30 yards wide and 70 yards long, including two 10-yard end zones. The illustrated
