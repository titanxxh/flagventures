# UTF-8; standard teaching diagrams share geometry and timing across languages.
format: flag-lesson
version: 1
id: route-stop-and-go
kind: route
title:
  zh: 7 · 停后再冲
  en: STOP AND GO
summary: STOP AND GO · 先向前跑，短暂停住做出准备接短球的样子，再沿原来的方向加速跑深。
teaching:
  goal: 先向前跑，短暂停住做出准备接短球的样子，再沿原来的方向加速跑深。
  cooperation: 短暂停顿让动作看起来像给 QB 提供短传接应，随后继续向前跑深。这里未规定 QB 必须假传或何时出手。
  cue: 跑、停一下、再冲。
  question: 如果你在停住之后不再跑，这还是 Stop and Go 吗？
source:
  title: NFL FLAG 路线教学 · 附件名称与官网说明
  page: 4
  note: >-
    名称和原书编号保留自附件；跑法补充自 NFL FLAG 官网。此图按定义重新绘制，统一 X 和 QB 起点，并非原 PDF
    路线描摹。全场轮廓不按真实比赛比例；坐标、转折距离与动画秒数仅为教学示意，不是比赛码数、官方用时或传球时刻。
  references:
    - title: NFL FLAG · 路线树说明
      url: https://nflflag.com/coaches/default/flag-football-rules/flag-football-plays
      locator: STOP AND GO
      note: 用于核对跑法名称与转向；本站中文说明、儿童口令和图形为教学改写。
field:
  width: 60
  height: 100
  attackDirection: up
  lineOfScrimmageY: 74
players:
  - id: X
    team: offense
    at:
      - 16
      - 74
    color: '#80d4ff'
    name: 接球手 X
    label:
      zh: 停后再冲
      en: STOP AND GO
      description: 先向前跑，短暂停住做出准备接短球的样子，再沿原来的方向加速跑深。
      basis: source
      note: 路线名称和动作含义依据 NFL FLAG 官网；起点、线段长度和动画节奏为本应用的教学设置。
    motion:
      type: path
      startAt: 0
      steps:
        - type: line
          to:
            - 16
            - 54
          seconds: 3
        - type: pause
          seconds: 1
        - type: line
          to:
            - 16
            - 16
          seconds: 6
    coaching:
      cooperation: 短暂停顿让动作看起来像给 QB 提供短传接应，随后继续向前跑深。这里未规定 QB 必须假传或何时出手。
      timing: 演示从 0 秒开始，10 秒走完；转折关键帧帮助记忆动作，没有规定开球后必须等待几秒。
  - id: QB
    team: offense
    at:
      - 30
      - 83
    color: '#ff9690'
    name: 四分卫 QB
    label:
      zh: 四分卫位置参照
      en: QB
      description: 站在开球线后方中间，帮助辨认接球手相对 QB 的跑动方向；静止图标不代表比赛中 QB 必须不动。
      basis: author
      note: 为比较基础路线新增的教学站位，不是原 PDF 规定的 QB 位置。
    motion:
      type: still
      note: 教学参照：保持图标原位，不演示真实 QB 的后撤、传球或跑动。
    coaching:
      cooperation: 观察 X 是向中间、边线还是深处移动；传球路线与传球时刻未在此图规定。
      timing: 图标全程静止仅为定位参照，不表示真实比赛中的启动顺序。
timeline:
  duration: 10
  basis: illustration
  note: 动画总长 10 秒，只把动作先后拆开供教学；秒数、速度和转折距离不是官方规定。QB 静止为位置参照。
keyframes:
  - id: start
    at: 0
    label: 起始站位
    cue: 找到开球线、左侧的 X 和后方的 QB。上方是进攻方向，场地中间是“内”。
  - id: stop
    at: 3
    label: 短暂停住
    cue: 先停下来；动画用 1 秒让小朋友看清这个动作。
  - id: go
    at: 4
    label: 再次向前
    cue: 停顿结束，沿同一条线继续向前。
  - id: end
    at: 10
    label: 动作完成
    cue: 说出 STOP AND GO，按「跑、停一下、再冲。」用手指画一遍。
notes:
  - 全场示意：X 固定从左侧开球线起跑，QB 位于开球线后方中间。这样可比较每条路线的“内、外、深、回身”；不是完整的五人阵型。
  - QB 的静止站位只是教学参照；这里不演示开球、传球、后撤步或防守。真实路线深度和传接球时机应按球队教练安排。
translations:
  en:
    summary: >-
      STOP AND GO · Run forward, briefly stop as if preparing for a short catch, then accelerate deep in the
      same direction.
    title.zh: 7 · STOP AND GO
    source.title: NFL FLAG route lesson · PDF names and official explanations
    source.note: >-
      Names and original numbering are retained from the PDF; explanations are supplemented from NFL FLAG.
      This diagram is newly drawn from route definitions with shared X and QB starting positions, not traced
      from the PDF. The full-field outline is not to regulation scale; coordinates, cut depths and animation
      seconds are teaching choices, not game yardage, official timing or throw times.
    source.references.0.title: NFL FLAG · Route tree guide
    source.references.0.locator: STOP AND GO
    source.references.0.note: >-
      Used for route names and directions. Chinese explanations, child-friendly cues and diagrams are teaching
      adaptations.
    notes.0: >-
      Full-field teaching view: X starts on the left of the line of scrimmage, with QB behind the line near
      the middle. The shared setup makes inside, outside, deep and return movements comparable; it is not a
      full five-player formation.
    notes.1: >-
      The stationary QB is a teaching reference. Snapping, passing, dropbacks and defense are not animated.
      Your coach sets actual route depths and passing timing.
    teaching.goal: Run forward, briefly stop as if preparing for a short catch, then accelerate deep in the same direction.
    teaching.cooperation: >-
      The brief stop suggests a short target for the QB before you continue deep. This example does not
      require a QB pump fake or prescribe a release time.
    teaching.cue: Run, stop, then go.
    teaching.question: If you stop and never go again, is it still Stop and Go?
    players.X.name: Receiver X
    players.X.label.zh: STOP AND GO
    players.X.label.description: Run forward, briefly stop as if preparing for a short catch, then accelerate deep in the same direction.
    players.X.label.note: >-
      The route name and movement follow the NFL FLAG guide; starting positions, segment lengths and animation
      timing are teaching choices.
    players.X.coaching.cooperation: >-
      The brief stop suggests a short target for the QB before you continue deep. This example does not
      require a QB pump fake or prescribe a release time.
    players.X.coaching.timing: >-
      The demonstration runs from 0 to 10 seconds. Keyframes mark movement changes; they do not prescribe a
      delay after the snap.
    players.QB.name: Quarterback QB
    players.QB.label.zh: Quarterback reference
    players.QB.label.description: >-
      Shown behind the line near the middle to clarify the receiver’s movement relative to QB. The stationary
      marker does not require a real QB to stand still.
    players.QB.label.note: An added reference position for comparing routes, not a QB position prescribed by the PDF.
    players.QB.motion.note: 'Teaching reference: keep the marker fixed; actual QB dropbacks, passes and runs are not shown.'
    players.QB.coaching.cooperation: >-
      Watch whether X moves toward the middle, sideline or deeper upfield. Pass trajectory and release time
      are not specified.
    players.QB.coaching.timing: The marker stays fixed only as a positional reference, not to specify real-game movement order.
    timeline.note: >-
      The ten-second animation separates movement stages for teaching. Seconds, speed and cut depths are not
      official requirements. QB stays fixed as a positional reference.
    keyframes.start.label: Starting positions
    keyframes.start.cue: >-
      Find the line of scrimmage, X on the left and QB behind. The attack goes upward; inside means toward the
      middle.
    keyframes.stop.label: Brief stop
    keyframes.stop.cue: Pause here; the animation uses one second to make the stop easy to see.
    keyframes.go.label: Go again
    keyframes.go.cue: The pause ends. Continue upfield on the same line.
    keyframes.end.label: Route complete
    keyframes.end.cue: 'Say STOP AND GO, then trace the route: “Run, stop, then go.”'
