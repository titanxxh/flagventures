timeline:
  duration: 10
  basis: illustration
  note: 官网视频建议 Z 稍等几秒，让队友先带开中路防守。本示范设 X、Y、C 在 0 秒开始、Z 在 2 秒开始，均于 10 秒走完。先后依据来源，具体秒数与跑速为教学设置；未指定传球时刻。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X、Y 跑 Out，C 跑 Corner；Z 延后启动，用较短 Hitch 接应中间。
  - id: release
    at: 2
    label: 稍后加入
    cue: Z 从这里加入；2 秒是本演示的教学设置。先看 X、Y、C 展开，Z 在教学等待后加入。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 跟踪 Z 的较短路线，指出先出发队友的三个方向。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: Z 为什么稍等？先跑的队友分别去了哪里？
notes:
  - 画面只演示进攻路线，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p36 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
translations:
  en:
    title.zh: I FORMATION PLAY 2
    summary: X and Y run Outs and C a Corner. Z starts later on a shorter Hitch into the middle.
    teaching.goal: Let teammates draw coverage away before the middle outlet.
    teaching.cooperation: X and Y run Outs and C a Corner. Z starts later on a shorter Hitch into the middle.
    teaching.cue: Teammates spread first; I join in the middle later.
    teaching.question: Why does Z wait, and where do the others go first?
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork explanations also
      use NFL FLAG’s official article and videos. Child-friendly cues, questions and animation timing are
      teaching adaptations.
    source.references.0.title: NFL FLAG · I Formation play explanations
    source.references.0.locator: I Formation · Play 2
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
    source.references.1.title: NFL FLAG · I Formation video
    source.references.1.locator: 0:56–1:22
    source.references.1.note: Timestamps locate the narration; its order does not define player start order.
    timeline.note: >-
      Z start after their teammates, following the official explanation. A two-second delay and ten-second
      total are teaching settings, not prescribed game timing or equal running speeds.
    notes.0: >-
      This shows offensive routes without simulating defenders. Creating space is the play’s intent, not a
      guaranteed outcome.
    notes.1: The cues and questions are teaching adaptations. Agree on crossing order before practicing on the field.
    notes.2: >-
      Relative positions follow source page 36. Short connections approximate parts hidden beneath markers;
      they are not extra actions or measured yards.
    notes.3: >-
      No complete QB read order, mandatory target or pass timing is specified. Crossing routes do not imply a
      handoff.
