    ball.note: >-
      These added teaching scenarios let you pass to C, X, Y or Z; they do not prescribe a unique official
      target or QB read order. The ball leaves C at zero and reaches QB at 0.35 seconds; C may run after
      releasing it. QB stays at the drawn position in this example. Release, flight and catch times are
      animation settings, not game time. After catching, the receiver follows the existing route without an
      invented continuation.
    ball.scenarios.pass-c.title: Pass to C
