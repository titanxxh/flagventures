    players.Q.label.description: Only Q’s starting position is shown. Later movement is not specified.
    players.Q.coaching.cooperation: Observe the receiving areas offered by teammates. No fixed read order or mandatory target is specified.
    players.Q.coaching.timing: The diagram does not specify Q’s later movement or when to pass.
    players.Q.motion.note: >-
      Only the known starting position is shown. Later movement is unspecified; this does not require standing
      still.
    players.C.label.zh: Corner
    players.C.label.description: Move forward, then diagonally forward-left. Left and right refer to the diagram.
    players.C.label.note: >-
      Name follows the official NFL FLAG explanation (0:56–1:22); direction and geometry retain the supplied
      diagram on page 36.
    players.C.coaching.cooperation: Run a Corner first alongside X and Y to draw coverage away from the middle.
    players.C.coaching.timing: Go first, before the delayed teammate(s). Starting at zero seconds is a teaching setting.
    players.X.label.zh: Out
    players.X.label.description: >-
