title:
  zh: I 字阵型 · 第 2 号战术
  en: I FORMATION PLAY 2
summary: X、Y 与中锋先向外展开，Z 稍后跑 Hitch，利用可能空出的中路。
teaching:
  goal: 让队友先带开防守，再在中间接应。
  cooperation: X、Y 跑 Out，C 跑 Corner；Z 延后启动，用较短 Hitch 接应中间。
  cue: 队友先分开，我稍后去中间。
  question: Z 为什么稍等？先跑的队友分别去了哪里？
