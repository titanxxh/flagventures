# UTF-8; yard-scale teaching geometry and timing are shared across languages.
format: flag-lesson
version: 1
id: route-hitch
kind: route
title:
  zh: 0 · 急停回身
  en: HITCH
summary: HITCH · 先直跑 7 码，急停转身，再朝 QB 斜着回跑约 2 码，形成向内后方的钩形接应。
teaching:
  goal: 先直跑 7 码，急停转身，再朝 QB 斜着回跑约 2 码，形成向内后方的钩形接应。
  cooperation: 你从 QB 左前方起跑；急停后朝右后方的 QB 斜着迎回，身体面向他，让他看见胸口和双手。
  cue: 直跑、钩回、迎着 QB 接。
  question: 钩回来时，你和 QB 的距离变近还是变远？
source:
  title: NFL FLAG 路线教学 · 附件名称与官网说明
  page: 3
  note: >-
    名称与原书编号保留自附件；跑法按 NFL FLAG 官网的图和文字核对。球场按 30 × 70 码绘制，含两端各 10 码端区。首段 7 码采用官方路线树文字示例；官网图示向内后方钩回。本图朝所示 QB 斜回约
    2 码，2 码指实际回跑路程，终点距开球线约 5.3 码。精确回跑角度和长度、QB 站位与动画时长为教学设置。
  references:
    - title: NFL FLAG · 路线树说明
      url: https://nflflag.com/coaches/default/flag-football-rules/flag-football-plays
      locator: HITCH
      note: 用于核对跑法名称与转向；本站中文说明、儿童口令和图形为教学改写。
    - title: NFL FLAG · 球场尺寸
      url: https://nflflag.com/coaches/flag-football-rules/how-to-play-flag-football
      locator: Flag Football Field
      note: 全场宽 30 码、长 70 码，含两端各 10 码端区；本图开球线和 QB 站位为教学选择。
    - title: NFL FLAG · 基础路线图 0–5
      url: >-
        https://nflstatic.s3.amazonaws.com/attachments/ckhmrilp9233r0jlg45p0cmj1-screen-shot-2020-11-17-at-8-03-55-pm.max.png
      locator: 0 — HITCH
      note: 核对直跑后向内后方钩回的图形；不把图片像素当作固定码数或角度。
field:
  width: 30
  height: 70
  unit: yard
  endZoneDepth: 10
  attackDirection: up
  lineOfScrimmageY: 50
players:
  - id: X
    team: offense
    at:
      - 8
      - 50
    color: '#80d4ff'
    name: 接球手 X
    label:
      zh: 急停回身
      en: HITCH
      description: 先直跑 7 码，急停转身，再朝 QB 斜着回跑约 2 码，形成向内后方的钩形接应。
      basis: source
      note: >-
        首段 7 码采用官方路线树文字示例；官网图示向内后方钩回。本图朝所示 QB 斜回约 2 码，2 码指实际回跑路程，终点距开球线约 5.3 码。精确回跑角度和长度、QB
        站位与动画时长为教学设置。具体深度应与教练和 QB 约定。
    motion:
      type: path
      startAt: 0
      steps:
        - type: line
          to:
            - 8
            - 43
          seconds: 7
        - type: line
          to:
            - 9.007742051
            - 44.727557802
          seconds: 3
          facePlayer: QB
    coaching:
      cooperation: 你从 QB 左前方起跑；急停后朝右后方的 QB 斜着迎回，身体面向他，让他看见胸口和双手。
      timing: 演示从 0 秒开始，10 秒走完；转折关键帧帮助记忆动作，没有规定开球后必须等待几秒。
  - id: QB
    team: offense
    at:
      - 15
      - 55
    color: '#ff9690'
    name: 四分卫 QB
    label:
      zh: 四分卫位置参照
      en: QB
      description: 本图 QB 位于开球线后方 5 码、场地横向中间，帮助辨认接球手相对 QB 的方向；这是教学站位，不要求比赛中 QB 必须这样站或保持不动。
      basis: author
      note: 为比较基础路线新增的教学站位，不是原 PDF 规定的 QB 位置。
    motion:
      type: still
      note: 教学参照：保持图标原位，不演示真实 QB 的后撤、传球或跑动。
    coaching:
      cooperation: 观察 X 是向中间、边线还是深处移动；传球路线与传球时刻未在此图规定。
      timing: 图标全程静止仅为定位参照，不表示真实比赛中的启动顺序。
timeline:
  duration: 10
  basis: illustration
  note: 动画总长 10 秒，仅展示动作先后；图形和距离刻度按码数绘制，播放秒数不是实跑用时，不能用秒数换算码数。QB 静止只是位置参照。
keyframes:
  - id: start
    at: 0
    label: 起始站位
    cue: 从开球线的 0 码开始看：X 在左侧，QB 在后方 5 码的中间。上方是进攻方向，“内”指场地中间。
  - id: turn
    at: 7
    label: 7 码回身
    cue: 直跑 7 码后急停转身，朝 QB 所在方向斜着回跑约 2 码。跑动线弯成小钩，小三角也面向 QB。
  - id: end
    at: 10
    label: 钩回接应 QB
    cue: 你已朝 QB 迎回约 2 码，现在距开球线约 5.3 码。保持胸口和双手朝向 QB，准备接球。
notes:
  - 全场按码数比例绘制：30 码宽、70 码长，含两端各 10 码端区。X 从左侧开球线起跑，QB 在后方 5 码作参照；这不是完整五人阵型。
  - QB 的静止站位只是教学参照；这里不演示开球、传球、后撤步或防守。距离标签标明官方示例或教学设置；真实路线深度、传球时机和练习距离由教练与 QB 约定。
translations:
  en:
    summary: >-
      HITCH · Run straight for 7 yards, plant and turn, then run diagonally back toward QB for about 2 yards,
      making an inward hook.
    title.zh: 0 · HITCH
    source.title: NFL FLAG route lesson · PDF names and official explanations
    source.note: >-
      Names and original numbering are retained from the PDF; movement was checked against both the NFL FLAG
      diagram and text. The field is drawn at 30 × 70 yards, including two 10-yard end zones. The 7-yard stem
      follows the official route-tree text, and the diagram shows a hook back inside. This example runs about
      2 yards diagonally toward the illustrated QB; 2 yards is the return-path length, ending at about 5.3
      yards of depth. The precise return angle and length, QB position and animation timing are teaching
      choices.
    source.references.0.title: NFL FLAG · Route tree guide
    source.references.0.locator: HITCH
    source.references.0.note: >-
      Used for route names and directions. Chinese explanations, child-friendly cues and diagrams are teaching
      adaptations.
    notes.0: >-
      The field is drawn to yard scale: 30 yards wide and 70 long, including two 10-yard end zones. X starts
      on the left of the line, with QB 5 yards behind as a reference; this is not a full five-player
      formation.
    notes.1: >-
      The stationary QB is a teaching reference; snaps, passes, dropbacks and defense are not animated.
      Distance labels distinguish official examples from teaching choices. Agree on actual route depths,
      passing timing and practice distances with your coach and QB.
    teaching.goal: >-
      Run straight for 7 yards, plant and turn, then run diagonally back toward QB for about 2 yards, making
      an inward hook.
    teaching.cooperation: >-
      Start ahead and left of QB. Plant, turn and run diagonally back toward QB on your right, presenting your
      chest and hands.
    teaching.cue: Run, hook back, come toward QB.
    teaching.question: Does the hook bring you closer to QB or farther away?
    players.X.name: Receiver X
    players.X.label.zh: HITCH
    players.X.label.description: >-
      Run straight for 7 yards, plant and turn, then run diagonally back toward QB for about 2 yards, making
      an inward hook.
    players.X.label.note: >-
      The 7-yard stem follows the official route-tree text, and the diagram shows a hook back inside. This
      example runs about 2 yards diagonally toward the illustrated QB; 2 yards is the return-path length,
      ending at about 5.3 yards of depth. The precise return angle and length, QB position and animation
      timing are teaching choices. Agree on practice depths with your coach and QB.
    players.X.coaching.cooperation: >-
      Start ahead and left of QB. Plant, turn and run diagonally back toward QB on your right, presenting your
      chest and hands.
    players.X.coaching.timing: >-
      The demonstration runs from 0 to 10 seconds. Keyframes mark movement changes; they do not prescribe a
      delay after the snap.
    players.QB.name: Quarterback QB
    players.QB.label.zh: Quarterback reference
    players.QB.label.description: >-
      QB is drawn 5 yards behind the line at the field’s horizontal center to show relative direction. This is
      a teaching position, not a required game stance or instruction to stand still.
    players.QB.label.note: An added reference position for comparing routes, not a QB position prescribed by the PDF.
    players.QB.motion.note: 'Teaching reference: keep the marker fixed; actual QB dropbacks, passes and runs are not shown.'
    players.QB.coaching.cooperation: >-
      Watch whether X moves toward the middle, sideline or deeper upfield. Pass trajectory and release time
      are not specified.
    players.QB.coaching.timing: The marker stays fixed only as a positional reference, not to specify real-game movement order.
    timeline.note: >-
      The ten-second animation only shows movement order. Geometry and depth marks use yards; playback seconds
      are not real running time and cannot be converted into yardage. QB stays still as a positional
      reference.
    keyframes.start.label: Starting positions
    keyframes.start.cue: >-
      Start at zero on the line of scrimmage: X is on the left and QB is centered 5 yards behind. Attack goes
      upward; inside means toward the field center.
    keyframes.turn.label: 7-yard turn
    keyframes.turn.cue: >-
      After a 7-yard stem, plant and turn, then run diagonally back toward QB for about 2 yards. The run path
      makes a small hook; the triangle also faces QB.
    keyframes.end.label: Hook back toward QB
    keyframes.end.cue: >-
      You have come about 2 yards toward QB and are now at about 5.3 yards of depth. Keep your chest and hands
      toward QB, ready for the catch.
    source.references.1.title: NFL FLAG · Field dimensions
    source.references.1.locator: Flag Football Field
    source.references.1.note: >-
      The field is 30 yards wide and 70 yards long, including two 10-yard end zones. The illustrated line of
      scrimmage and QB position are teaching choices.
    routeGuide.note: >-
      The 7-yard stem follows the official route-tree text, and the diagram shows a hook back inside. This
      example runs about 2 yards diagonally toward the illustrated QB; 2 yards is the return-path length,
      ending at about 5.3 yards of depth. The precise return angle and length, QB position and animation
      timing are teaching choices. Distance labels show depth beyond the line, not total distance traveled.
    routeGuide.marks.turn.label: Turn at 7 yd
    routeGuide.marks.turn.note: 'Official route-tree example: turn after a 7-yard stem. Agree on the practice depth with QB.'
    source.references.2.title: NFL FLAG · Basic route diagram 0–5
    source.references.2.locator: 0 — HITCH
    source.references.2.note: >-
      Shows the straight stem followed by an inward, backward hook. Image pixels do not prescribe distances or
      angles.
    routeGuide.marks.return.label: Hook about 2 yd toward QB
    routeGuide.marks.return.note: >-
      This example returns about 2 yards diagonally, ending at about 5.3 yards of depth. Two yards is the
      return-path length, not a 2-yard loss of depth. Angle and length are teaching choices.
