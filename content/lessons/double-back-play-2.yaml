title:
  zh: 双跑卫阵型 · 第 2 号战术
  en: DOUBLE BACK PLAY 2
summary: X 的 Post 与 Y 的 Chair 跑深，中锋和 Z 在较浅区域提供短传选择。
teaching:
  goal: 用两条深路线帮助两个短接球点。
  cooperation: X、Y 尝试把防守带向深处，C 的 Out 与 Z 的 In 接应较短距离。
  cue: 两人跑远，两人跑近，谁都在配合。
  question: 需要短接应时，哪两条路线位于较浅区域？
