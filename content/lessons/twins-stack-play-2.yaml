    ball.note: >-
      These added teaching scenarios let you pass to C, X, Y or Z; they do not prescribe a unique
      official target or QB read order. The ball leaves C at zero and reaches QB at 0.35 seconds; C
      may run after releasing it. QB stays at the drawn position in this example. Release, flight
      and catch times are animation settings, not game time. After catching, the receiver follows
      the existing route without an invented continuation.
    ball.scenarios.pass-c.title: Pass to C
    ball.scenarios.pass-c.note: >-
      This example selects C to catch while continuing after the break; it does not evaluate
      defenders or guarantee an opening. Release at 5.87 seconds and catch at 6.57 seconds are
      teaching timings. The receiver then continues the existing route.
    ball.scenarios.pass-c.motions.Q.motion.note: >-
      For this ball-flow example, QB holds and throws from the drawn position. The source does not
      prescribe dropback steps; a real QB need not stand still.
    ball.scenarios.pass-c.events.snap.label: C snaps to QB
    ball.scenarios.pass-c.events.snap.cue: >-
      Follow the ball from C to QB. It leaves C at zero, so C may run after the release. The
      0.35-second exchange is an animation setting.
    ball.scenarios.pass-c.events.pass.label: QB passes to C
    ball.scenarios.pass-c.events.pass.cue: >-
      QB leads C to the future catch position. C catches while continuing after the break, then
