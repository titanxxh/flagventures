title:
  zh: 双接手同侧叠列阵型 · 第 2 号战术
  en: TWINS STACK PLAY 2
summary: X 与中锋交叉后分向接应，右侧 Y、Z 向较深处展开。
teaching:
  goal: 先记清交叉关系，再区分深浅接应。
  cooperation: X 的浅 Post 与 C 的 Out 交叉；Y 沿图示斜向左前方，Z 斜出后跑 Fly，展开右侧较深区域。
  cue: 交叉后分开，跑向自己记住的地方。
  question: 谁和中锋交叉？右侧两人分别向哪里展开？
source:
  title: NFL FLAG Play Book · 英文原书（封面 2020）
  page: 32
  note: 跑位坐标来自用户附件，归一化后重绘，非实际码数；路线称呼与配合讲解补充自 NFL FLAG 官网和视频。儿童口令、提问与播放节奏为教学改写。
  references:
