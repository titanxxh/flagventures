timeline:
  duration: 10
  basis: illustration
  note: 有路线的球员从 0 秒展开，各用 10 秒走完已画路径；这是读图教学节奏，不是来源规定的统一跑速、启动先后或传球时刻。视频逐人讲解的顺序不作为启动顺序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X 的浅 Post 与 C 的 Out 交叉；Y、Z 共同扩展右侧较深区域，具体名称存在来源差异。
  - id: spread
    at: 2.5
    label: 展开 · 看方向
    cue: 先跟踪 X 与 C 的交叉，再看右侧 Y、Z 的去向。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 按图指出 Y 的左前方转向与 Z 的直上，比较两条路线的方向。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 谁和中锋交叉？右侧两人分别向哪里展开？
notes:
  - 画面只演示进攻路线，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p32 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
  - 官网与视频解说对 Y/Z 名称对应有出入；Z 依据官网及图形记为 Fly，Y 保留方向描述，未改动附件的球员身份或几何。
translations:
  en:
    title.zh: TWINS STACK PLAY 2
    summary: X's shallow Post crosses C's Out. Y follows the diagram forward-left while Z angles out into a Fly.
    teaching.goal: Understand the crossing pair and deeper options.
    teaching.cooperation: X's shallow Post crosses C's Out. Y follows the diagram forward-left while Z angles out into a Fly.
    teaching.cue: Cross, separate, and remember your own direction.
    teaching.question: Who crosses C, and where do the right-side runners go?
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork explanations also
      use NFL FLAG’s official article and videos. Child-friendly cues, questions and animation timing are
      teaching adaptations.
    source.references.0.title: NFL FLAG · Twins Stack play explanations
    source.references.0.locator: Twins Stack · Play 2
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
    source.references.1.title: NFL FLAG · Twins Stack video
    source.references.1.locator: 0:45–1:01
    source.references.1.note: Timestamps locate the narration; its order does not define player start order.
    timeline.note: >-
      Shown routes start together and finish in ten demonstration seconds. Timing follows each individual
      route and is illustrative, not official start order, equal player speeds or handoff timing.
    notes.0: >-
      This shows offensive routes without simulating defenders. Creating space is the play’s intent, not a
      guaranteed outcome.
    notes.1: The cues and questions are teaching adaptations. Agree on crossing order before practicing on the field.
    notes.2: >-
      Relative positions follow source page 32. Short connections approximate parts hidden beneath markers;
      they are not extra actions or measured yards.
    notes.3: >-
      No complete QB read order, mandatory target or pass timing is specified. Crossing routes do not imply a
      handoff.
    notes.4: >-
      The article and video disagree on Y/Z names. Z is Fly according to the article and diagram; Y keeps a
      directional description. Player IDs and route geometry are unchanged.
    players.Q.label.zh: Movement not specified
    players.Q.label.description: Only Q’s starting position is shown. Later movement is not specified.
    players.Q.coaching.cooperation: Observe the receiving areas offered by teammates. No fixed read order or mandatory target is specified.
    players.Q.coaching.timing: The diagram does not specify Q’s later movement or when to pass.
    players.Q.motion.note: >-
      Only the known starting position is shown. Later movement is unspecified; this does not require standing
      still.
    players.C.label.zh: Out
    players.C.label.description: Move forward, then across to the left. Left and right refer to the diagram.
    players.C.label.note: >-
      Name follows the official NFL FLAG explanation (0:45–1:01); direction and geometry retain the supplied
      diagram on page 32.
    players.C.coaching.cooperation: Run an Out across X's shallow inside cut.
    players.C.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.X.label.zh: Post
    players.X.label.description: Move forward, then diagonally forward-right. Left and right refer to the diagram.
    players.X.label.note: >-
      Name follows the official NFL FLAG explanation (0:45–1:01); direction and geometry retain the supplied
      diagram on page 32.
    players.X.coaching.cooperation: Run a shallow Post across C.
    players.X.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.Y.label.zh: Forward, then diagonally left
    players.Y.label.description: Move forward, then diagonally forward-left. Left and right refer to the diagram.
    players.Y.label.note: >-
      The article and video disagree on Y/Z route names; Y’s inside/outside turn also needs interpretation.
      Follow the diagram’s direction without assigning a standard term.
    players.Y.coaching.cooperation: Follow the diagram forward-left, separating from Z.
    players.Y.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    players.Z.label.zh: Fly
    players.Z.label.description: Angle forward-right, then go straight downfield. Directions refer to the diagram.
    players.Z.label.note: >-
      The official article names Z’s route Fly, matching the PDF and the video frame at 1:02. The spoken Y/Z
      names conflict; the diagram and article are used here.
    players.Z.coaching.cooperation: Angle out right, then run a Fly, separating from Y.
    players.Z.coaching.timing: No exact start order is specified for this player. Starting at zero is a teaching setting.
    keyframes.start.label: Line up · Find teammates
    keyframes.start.cue: >-
      Find Q, C, X, Y and Z. X's shallow Post crosses C's Out. Y follows the diagram forward-left while Z
      angles out into a Fly.
    keyframes.spread.label: Watch the routes
    keyframes.spread.cue: Pause and compare teammates’ routes. Who crosses C, and where do the right-side runners go?
    keyframes.middle.label: Pause · See the teamwork
    keyframes.middle.cue: Pause and compare teammates’ routes. Who crosses C, and where do the right-side runners go?
    keyframes.end.label: Recall · Explain it
    keyframes.end.cue: Who crosses C, and where do the right-side runners go?
