      note: 时间用于定位解说；逐人讲述不表示逐人启动。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 对应战术的原作者讲解；不包含完整传球结局或精确秒数。
    - url: >-
        https://nflstatic.s3.amazonaws.com/attachments/ckmqis77f02hv0jo0uvaxh5qq-nfl-flag-play-book-formations-prd-2.pdf#page=32
