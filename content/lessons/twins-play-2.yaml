title:
  zh: 双接手同侧阵型 · 第 2 号战术
  en: TWINS PLAY 2
summary: X、Z 的深跑尝试带走中路防守，让中锋的 Option 成为短传接应。
teaching:
  goal: 用两侧深跑帮助中锋的中路短传。
  cooperation: X、Z 向深处展开，Y 向外跑 Out；C 在较浅的中路跑 Option。
  cue: 我跑深，也是在帮助中间的队友。
  question: 如果防守跟着两侧跑远，谁在中间短接应？
