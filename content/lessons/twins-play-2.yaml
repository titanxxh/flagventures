      Only the known starting position is shown. Later movement is unspecified; this does not require standing
      still.
    players.C.label.zh: Option
    players.C.label.description: >-
      Move forward, then diagonally forward-left, then diagonally forward-right, then across to the right.
      Left and right refer to the diagram.
