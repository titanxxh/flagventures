timeline:
  duration: 10
  basis: illustration
  note: 有路线的球员从 0 秒展开，各用 10 秒走完已画路径；这是读图教学节奏，不是来源规定的统一跑速、启动先后或传球时刻。视频逐人讲解的顺序不作为启动顺序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X、C 的 Out 与 Z 的 Post 分散接球点；Y 的浅 Hitch 利用中间区域。
  - id: spread
    at: 2.5
    label: 展开 · 看方向
    cue: 找到 X/C 的两侧 Out 与 Z 的深 Post，再找 Y。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 比较 Y 的浅 Hitch 与另外三人的位置，指出怎样分散接球点。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 哪名队友准备在中间进行短接应？
notes:
  - 跑位与可选球路都是教学演示，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
