timeline:
  duration: 12
  basis: illustration
  note: 教学总长 12 秒。仅看原图跑位时，各原始路线仍用 10 秒走完，最后 2 秒保留讲解；开启球路时按所选情形重新安排启动、会合和交接。不是比赛跑速、官方交球次序或出手计时。
keyframes:
  - id: start
    at: 0
    label: 开球前找球
    cue: 球从 C 开始；先看家长选了哪个交接或传球情形。
  - id: snap
    at: 0.35
    label: 接到开球
    cue: Q 已经接到 C 的开球，球现在由 Q 持有。
  - id: first-exchange
    at: 2
    label: 第一次会合
    cue: 停住看球权短句：是真交、假交，还是这个情形的准备动作？
  - id: second-exchange
    at: 4
    label: 看后续配合
    cue: 不同情形可能在这里真交、假交、假传或继续跑动；跟着当前持球人看。
  - id: decision
    at: 6
    label: 再次确认球在哪里
    cue: 看所选情形的动作说明；不要把跑线交叉误认为自动交球。
  - id: catch
    at: 7
    label: 继续持球跑进
    cue: 跟着最后一次真交后的持球人，看无球队友如何展开空间。
  - id: end
    at: 12
    label: 本次演示完成
    cue: 说出这次每一次真交和假交，最后谁持球。
notes:
  - 保留原图可见的直线与贝塞尔曲线；不根据名称推断传球、真假交球或最终持球人。
  - 无球模式保留原始 10 秒跑位并停留到 12 秒；球路模式的交接和配速是所选教学情形，不能从原图线条自动推断。
  - Q 的短线按图保留为读图路径；图中没有逐次说明它与交接球的关系。
translations:
  en:
    title.zh: FAKE TRIPLE REVERSE
    summary: This example gives Q to Y to Z, then Z fakes to X and remains the carrier.
    source.title: NFL FLAG 2024 bilingual study edition (user-provided PDF)
    source.note: >-
      Based on the supplied PDF. The Chinese study translation is unofficial; drawing coordinates
      are not actual yards. The source has no complete possession script. Added exchanges, meeting
      points and pacing are explicitly labeled teaching adaptations; the source paths are retained.
    timeline.note: >-
      The lesson lasts 12 seconds. Source-route view retains the original 10-second paths and holds
      the last 2 seconds for discussion. Ball mode uses the selected timing for starts, meetings and
      transfers. These are not game speed, official exchange order or a passing clock.
    notes.0: >-
      Visible straight and curved paths are preserved. The title does not determine passes, real or
      fake handoffs, or the final ball carrier.
    notes.1: >-
      Source-route view retains the original 10-second motion and holds until 12 seconds. Ball-mode
      exchanges and pacing belong to the chosen teaching script and are not inferred automatically
      from the diagram.
    notes.2: >-
      Q’s short line is preserved; the diagram does not explain its step-by-step relationship to
      handoffs.
    players.Q.label.zh: Follow the very short red line backward. Later handoff actions are not explained step by step.
    players.Q.label.description: Follow the very short red line backward. Later handoff actions are not explained step by step.
    players.Q.label.note: >-
      Describes this player’s drawn path; it does not infer the ball carrier, fake or real handoffs,
      or a standard receiving route from the play’s name.
    players.C.label.zh: Movement not specified
    players.C.label.description: Only C’s starting position is shown. Later movement is not specified.
    players.C.motion.note: >-
      Only the known starting position is shown. Later movement is unspecified; this does not
      require standing still.
    players.X.label.zh: Backfield loop
    players.X.label.description: Loop backward from the left, following the long outermost curve toward the right.
    players.X.label.note: >-
      Describes this player’s drawn path; it does not infer the ball carrier, fake or real handoffs,
      or a standard receiving route from the play’s name.
    players.Y.label.zh: Backfield loop
    players.Y.label.description: Loop backward from the left into the middle, with a short bend at the end.
    players.Y.label.note: >-
      Describes this player’s drawn path; it does not infer the ball carrier, fake or real handoffs,
      or a standard receiving route from the play’s name.
    players.Z.label.zh: Backfield loop
    players.Z.label.description: Loop backward from the right, then curve toward the left.
    players.Z.label.note: >-
      Describes this player’s drawn path; it does not infer the ball carrier, fake or real handoffs,
      or a standard receiving route from the play’s name.
    ball.scenarios.z-keeps-after-fake.title: Q to Y to Z; Z fakes to X and keeps
    ball.scenarios.z-keeps-after-fake.note: >-
      Choose two real handoffs, Q→Y→Z, followed by Z faking to X while keeping possession. This
      teaching script explains real versus fake transfers; the title alone does not determine it.
      This possession sequence, meeting points, pacing and running extensions are teaching choices,
      not a sequence prescribed by the PDF. Real and fake handoffs occur behind the line; seconds
      are for explanation.
    ball.scenarios.z-keeps-after-fake.events.snap.label: C snaps to Q
    ball.scenarios.z-keeps-after-fake.events.snap.cue: C snaps backward to Q, who then begins this handoff sequence.
    ball.scenarios.z-keeps-after-fake.events.handoff-q-y.label: Q hands off to Y
    ball.scenarios.z-keeps-after-fake.events.handoff-q-y.cue: Q and Y meet behind the line. A direct handoff transfers possession to Y.
    ball.scenarios.z-keeps-after-fake.events.handoff-y-z.label: Y hands off to Z
    ball.scenarios.z-keeps-after-fake.events.handoff-y-z.cue: Y and Z meet behind the line. A direct handoff transfers possession to Z.
    ball.scenarios.z-keeps-after-fake.events.fake-z-x.label: Z fakes to X; no transfer
    ball.scenarios.z-keeps-after-fake.events.fake-z-x.cue: Z meets X for a fake handoff. Z keeps possession while X runs on as a decoy.
    ball.note: >-
      This possession sequence, meeting points, pacing and running extensions are teaching choices,
      not a sequence prescribed by the PDF. Real and fake handoffs occur behind the line; seconds
      are for explanation. The source routes are retained; ball mode uses the selected teaching
      scenario.
    ball.scenarios.z-keeps-after-fake.motions.C.motion.note: >-
      Stay as a positional reference after the snap in this teaching example. At 0 seconds, snap to
      Q.
    teaching.goal: This example gives Q to Y to Z, then Z fakes to X and remains the carrier.
    teaching.cooperation: >-
      Watch the snap and backfield meetings. Only real handoffs and completed catches change
      possession. Off-ball teammates follow their routes without blocking.
    teaching.cue: Find the ball. A real transfer changes hands; a fake keeps it.
    teaching.question: Was that a real transfer or a fake? Who has the ball now, and who is helping?
    source.references.0.title: NFL FLAG · Handoff and fake-handoff drills
    source.references.0.locator: Handoff and fake-handoff technique
    source.references.0.note: >-
      Supports general handoff and fake-handoff concepts, not this page’s possession order or
      timing.
    source.references.1.title: NFL FLAG · Current rules overview
    source.references.1.locator: Snap, backfield handoffs and initial QB
    source.references.1.note: >-
      Checks backfield handoffs and the restriction on the snap receiver running across the line.
      Animation pacing is not game timing; use the rules applicable to your team.
    keyframes.start.label: Find the ball before the snap
    keyframes.start.cue: The ball starts with C. First check the selected handoff or pass scenario.
    keyframes.snap.label: Snap received
    keyframes.snap.cue: Q has received C’s snap and now holds the ball.
    keyframes.first-exchange.label: First meeting
    keyframes.first-exchange.cue: 'Pause and read the possession cue: is this a real handoff, a fake, or preparation?'
    keyframes.second-exchange.label: Follow the next action
    keyframes.second-exchange.cue: >-
      Depending on the scenario, this may be a handoff, fake, pump fake or continuing run. Track the
      current carrier.
    keyframes.decision.label: Check who has the ball
    keyframes.decision.cue: Read the selected action. Crossing paths do not automatically transfer the ball.
    keyframes.catch.label: Continue carrying upfield
    keyframes.catch.cue: >-
      Follow the carrier after the last real handoff and watch teammates spread out without the
      ball.
    keyframes.end.label: Example complete
    keyframes.end.cue: Name each real and fake transfer and the final ball carrier.
    players.Q.coaching.cooperation: Give to Y at 2 seconds, then clear the backfield meeting area.
    players.Q.coaching.timing: >-
      The selected teaching scenario defines both exchange times and movement. Source routes remain
      available in route-only view.
    players.C.coaching.cooperation: >-
      Snap to Q, then stay as a positional reference in this teaching example; C takes no backfield
      handoff.
    players.C.coaching.timing: >-
      The selected teaching scenario defines both exchange times and movement. Source routes remain
      available in route-only view.
    players.X.coaching.cooperation: Fake receiving from Z at 6 seconds. Z keeps the ball and X continues without it.
    players.X.coaching.timing: >-
      The selected teaching scenario defines both exchange times and movement. Source routes remain
      available in route-only view.
    players.Y.coaching.cooperation: Receive from Q at 2 seconds, give to Z at 4 seconds, then move away without the ball.
    players.Y.coaching.timing: >-
      The selected teaching scenario defines both exchange times and movement. Source routes remain
      available in route-only view.
    players.Z.coaching.cooperation: Receive from Y at 4 seconds, fake to X but keep at 6 seconds, then advance as the carrier.
    players.Z.coaching.timing: >-
      The selected teaching scenario defines both exchange times and movement. Source routes remain
      available in route-only view.
    ball.scenarios.z-keeps-after-fake.events.snap.endLabel: Q receives the snap
    ball.scenarios.z-keeps-after-fake.events.snap.endCue: Q has received C’s snap and now holds the ball, ready for the backfield exchange.
    ball.scenarios.z-keeps-after-fake.events.fake-z-x.endLabel: Fake handoff complete; Z keeps
    ball.scenarios.z-keeps-after-fake.events.fake-z-x.endCue: >-
      The fake handoff is complete. Possession has not changed: Z still holds the ball. Follow the
      carrier and off-ball teammates as they move on.
    ball.scenarios.z-keeps-after-fake.motions.Q.motion.note: >-
      Start right and backward; this teaching scenario arranges movement around its meeting and
      catch points. At 0.35 seconds, receive the snap. At 2 seconds, hand off to Y in the backfield
      and continue without the ball. The final leg goes left and upfield and stays behind the line.
    ball.scenarios.z-keeps-after-fake.motions.X.motion.note: >-
      Start right and backward; this teaching scenario arranges movement around its meeting and
      catch points. From 6 to 6.4 seconds, fake receiving from Z; Z keeps possession and you run on
      without the ball. The final leg goes right and upfield and stays behind the line.
    ball.scenarios.z-keeps-after-fake.motions.Y.motion.note: >-
      Start right and backward; this teaching scenario arranges movement around its meeting and
      catch points. At 2 seconds, take Q’s backfield handoff and become the carrier. At 4 seconds,
      hand off to Z in the backfield and continue without the ball. The final leg goes right and
      upfield and stays behind the line.
    ball.scenarios.z-keeps-after-fake.motions.Z.motion.note: >-
      Start left and backward; this teaching scenario arranges movement around its meeting and catch
      points. At 4 seconds, take Y’s backfield handoff and become the carrier. From 6 to 6.4
      seconds, fake to X while keeping the ball throughout. The final leg goes left and upfield and
      finishes beyond the line.
