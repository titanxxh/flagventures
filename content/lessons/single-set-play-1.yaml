# Editable bilingual lesson; source links and teaching adaptations travel with the data.
format: flag-lesson
version: 1
id: single-set-play-1
kind: offense
title:
  zh: 单后场阵型 · 第 1 号战术
  en: SINGLE SET PLAY 1
summary: X、Y、Z 把接球点拉向深处，中锋向右跑短 Out，补充近处选择。
teaching:
  goal: 以较深路线为主，同时保留短接应。
  cooperation: X、Z 的 Fly 与 Y 的 Corner 提供较深接球点，C 的 Out 提供较浅的选择。
  cue: 队友跑远，我也记住近处有人接应。
  question: 谁的路线较短？哪三个人跑得更深？
source:
  title: NFL FLAG Play Book · 英文原书（封面 2020）
  page: 43
  note: 跑位坐标来自用户附件，归一化后重绘，非实际码数；路线称呼与配合讲解补充自 NFL FLAG 官网和视频。儿童口令、提问与播放节奏为教学改写。
