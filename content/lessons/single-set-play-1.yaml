timeline:
  duration: 10
  basis: illustration
  note: 有路线的球员从 0 秒展开，各用 10 秒走完已画路径；这是读图教学节奏，不是来源规定的统一跑速、启动先后或传球时刻。视频逐人讲解的顺序不作为启动顺序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X、Z 的 Fly 与 Y 的 Corner 提供较深接球点，C 的 Out 提供较浅的选择。
  - id: spread
    at: 2.5
    label: 展开 · 看方向
    cue: 先看左右两侧的 Fly，再找 Y 的 Corner 与 C 的短 Out。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 比较三个深处选择与一个短接应，指出四人的不同位置。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 谁的路线较短？哪三个人跑得更深？
notes:
  - 跑位与可选球路都是教学演示，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p43 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
