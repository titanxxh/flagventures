# Editable bilingual lesson; source links and teaching adaptations travel with the data.
format: flag-lesson
version: 1
id: bunch-play-1
kind: offense
title:
  zh: 密集阵型 · 第 1 号战术
  en: BUNCH PLAY 1
summary: 中锋与 Y 先跑较深 Corner，X、Z 稍后展开短 Out。
teaching:
  goal: 先拉深，再提供短区接应。
  cooperation: C、Y 先展开尝试带走防守；X、Z 延后跑短路线，接应较浅区域。
  cue: 队友先跑深，我稍后跑短。
  question: 先出发的是哪两人？稍后出发的两人去深处还是近处？
source:
  title: NFL FLAG Play Book · 英文原书（封面 2020）
  page: 15
  note: 跑位坐标来自用户附件，归一化后重绘，非实际码数；路线称呼与配合讲解补充自 NFL FLAG 官网和视频。儿童口令、提问与播放节奏为教学改写。
  references:
    - title: NFL FLAG · Bunch 战术说明
      url: https://nflflag.com/coaches/flag-football-rules/5-on-5-flag-football-playbook
      locator: Bunch · Play 1
      note: 官网的战术意图和相对先后建议；不作为精确秒表。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 对应战术的原作者讲解；不包含完整传球结局或精确秒数。
    - title: NFL FLAG · Bunch 视频
      url: https://www.youtube.com/watch?v=b1zMoed_ckI&t=26s
      locator: 0:26–0:48
      note: 时间用于定位解说；逐人讲述不表示逐人启动。
      role: primary
      kind: explanation
      publisher: NFL FLAG
      scope: 对应战术的原作者讲解；不包含完整传球结局或精确秒数。
    - url: >-
        https://nflstatic.s3.amazonaws.com/attachments/ckmqis77f02hv0jo0uvaxh5qq-nfl-flag-play-book-formations-prd-2.pdf#page=15
      role: primary
      kind: diagram
      title: NFL FLAG · 原始战术图
      publisher: NFL FLAG
      locator: PDF 第 15 页 · BUNCH PLAY 1
      scope: 原始站位与路线图；图中未注明的球权、先后与秒数不由此推断。
      note: 封面标 2020、文件制作元数据为 2021；已逐图对照用户双语附件的同页站位与线路。两文件的翻译、颜色和版面不同，不称为相同的 2024 版本。
  adaptation: 球路选择、传接时刻、配速与亲子讲解为教学改编；不代表原作者规定的唯一目标或固定 QB 阅读顺序。
