timeline:
  duration: 10
  basis: illustration
  note: 官网建议 C、Y 先展开，X、Z 后跑短路线。本示范设 C、Y 在 0 秒开始、X、Z 在 2 秒开始，均于 10 秒走完。先后依据来源，具体秒数与跑速为教学设置；未指定传球时刻。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。C、Y 先展开尝试带走防守；X、Z 延后跑短路线，接应较浅区域。
  - id: release
    at: 2
    label: 稍后加入
    cue: X、Z 从这里加入；2 秒是本演示的教学设置。先看 C、Y 离开集中站位，X、Z 稍后加入。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 比较 C/Y 的较深路线与 X/Z 的短路线。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 先出发的是哪两人？稍后出发的两人去深处还是近处？
notes:
  - 跑位与可选球路都是教学演示，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p15 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
translations:
  en:
    title.zh: BUNCH PLAY 1
    summary: C and Y go first on deeper Corners; X and Z start later on shorter Outs.
    teaching.goal: Stretch deep before adding short options.
    teaching.cooperation: C and Y go first on deeper Corners; X and Z start later on shorter Outs.
    teaching.cue: Teammates go deep; I follow on a short route.
    teaching.question: Which two go first, and where do the later runners go?
    source.title: NFL FLAG Play Book · English source (2020 cover)
    source.note: >-
      Route geometry follows the supplied PDF, not measured yards. Route names and teamwork
      explanations also use NFL FLAG’s official article and videos. Child-friendly cues, questions
      and animation timing are teaching adaptations.
    source.references.0.title: NFL FLAG · Bunch play explanations
    source.references.0.locator: Bunch · Play 1
    source.references.0.note: Supports the play’s intent and relative timing, not an exact stopwatch.
    source.references.1.title: NFL FLAG · Bunch video
    source.references.1.locator: 0:26–0:48
    source.references.1.note: Timestamps locate the narration; its order does not define player start order.
    timeline.note: >-
      X, Z start after their teammates, following the official explanation. A two-second delay and
      ten-second total are teaching settings, not prescribed game timing or equal running speeds.
    notes.0: >-
      Routes and selectable ball-flow scenarios are teaching demonstrations without simulated
      defenders. Creating space is the play’s intent, not a guaranteed outcome.
    notes.1: >-
      The cues and questions are teaching adaptations. Agree on crossing order before practicing on
      the field.
    notes.2: >-
      Relative positions follow source page 15. Short connections approximate parts hidden beneath
      markers; they are not extra actions or measured yards.
    notes.3: >-
      No complete QB read order, mandatory target or pass timing is specified. Crossing routes do
      not imply a handoff.
    players.Q.label.zh: Movement not specified
    players.Q.label.description: Only Q’s starting position is shown. Later movement is not specified.
    players.Q.coaching.cooperation: >-
      Observe the receiving areas offered by teammates. No fixed read order or mandatory target is
      specified.
    players.Q.coaching.timing: The diagram does not specify Q’s later movement or when to pass.
    players.Q.motion.note: >-
      Only the known starting position is shown. Later movement is unspecified; this does not
      require standing still.
    players.C.label.zh: Corner
    players.C.label.description: >-
      Move diagonally forward-left, then forward, then diagonally forward-right. Left and right
      refer to the diagram.
    players.C.label.note: >-
      Name follows the official NFL FLAG explanation (0:26–0:48); direction and geometry retain the
      supplied diagram on page 15.
    players.C.coaching.cooperation: Run a Corner first with Y to help the short routes of X and Z.
    players.C.coaching.timing: Go first, before the delayed teammate(s). Starting at zero seconds is a teaching setting.
    players.X.label.zh: Out
    players.X.label.description: >-
      Move diagonally forward-left, then diagonally forward-right, then across to the right, then
      diagonally forward-right. Left and right refer to the diagram.
    players.X.label.note: >-
      Name follows the official NFL FLAG explanation (0:26–0:48); direction and geometry retain the
      supplied diagram on page 15.
    players.X.coaching.cooperation: Run a short Out after C and Y spread deep.
    players.X.coaching.timing: Let C, Y spread out first, then join. Starting at two seconds is a teaching setting.
    players.Y.label.zh: Corner
    players.Y.label.description: Move forward, then diagonally forward-left. Left and right refer to the diagram.
    players.Y.label.note: >-
      Name follows the official NFL FLAG explanation (0:26–0:48); direction and geometry retain the
      supplied diagram on page 15.
    players.Y.coaching.cooperation: Run a Corner first, crossing C's route and helping X and Z underneath.
    players.Y.coaching.timing: Go first, before the delayed teammate(s). Starting at zero seconds is a teaching setting.
    players.Z.label.zh: Out
    players.Z.label.description: >-
      Move diagonally forward-right, then forward, then across to the left. Left and right refer to
      the diagram.
    players.Z.label.note: >-
      Name follows the official NFL FLAG explanation (0:26–0:48); direction and geometry retain the
      supplied diagram on page 15.
    players.Z.coaching.cooperation: Run a short Out after C and Y spread out, pairing with X.
    players.Z.coaching.timing: Let C, Y spread out first, then join. Starting at two seconds is a teaching setting.
    keyframes.start.label: Line up · Find teammates
    keyframes.start.cue: >-
      Find Q, C, X, Y and Z. C and Y go first on deeper Corners; X and Z start later on shorter
      Outs.
    keyframes.release.label: Join later
    keyframes.release.cue: >-
      The delayed players join here; two seconds is a teaching setting. C and Y go first on deeper
      Corners; X and Z start later on shorter Outs.
    keyframes.middle.label: Pause · See the teamwork
    keyframes.middle.cue: Pause and compare teammates’ routes. Which two go first, and where do the later runners go?
    keyframes.end.label: Recall · Explain it
    keyframes.end.cue: Which two go first, and where do the later runners go?
    ball.note: >-
      These added teaching scenarios let you pass to C, X, Y or Z; they do not prescribe a unique
      official target or QB read order. The ball leaves C at zero and reaches QB at 0.35 seconds; C
      may run after releasing it. QB stays at the drawn position in this example. Release, flight
      and catch times are animation settings, not game time. After catching, the receiver follows
      the existing route without an invented continuation.
    ball.scenarios.pass-c.title: Pass to C
    ball.scenarios.pass-c.note: >-
      This example selects C to catch while continuing after the break; it does not evaluate
      defenders or guarantee an opening. Release at 5.87 seconds and catch at 6.57 seconds are
      teaching timings. The receiver then continues the existing route.
    ball.scenarios.pass-c.motions.Q.motion.note: >-
      For this ball-flow example, QB holds and throws from the drawn position. The source does not
      prescribe dropback steps; a real QB need not stand still.
    ball.scenarios.pass-c.events.snap.label: C snaps to QB
    ball.scenarios.pass-c.events.snap.cue: >-
      Follow the ball from C to QB. It leaves C at zero, so C may run after the release. The
      0.35-second exchange is an animation setting.
    ball.scenarios.pass-c.events.pass.label: QB passes to C
    ball.scenarios.pass-c.events.pass.cue: >-
      QB leads C to the future catch position. C catches while continuing after the break, then
      continues the existing route. Passing to C is this teaching choice, not the only answer.
