  en: TWINS PLAY 3
summary: Y 用 Chair 连续变向，X、Z 跑较深路线，中锋向左提供短 Out。
teaching:
  goal: 记住 Y 的两次转向与队友的接应点。
  cooperation: X 的 Corner、Z 的 Post 分向展开；Y 通过 Chair 变化方向，C 保留短区选择。
  cue: 向前、向外、再向前，转弯也记住队友。
  question: 谁的路线转了两次？谁提供较短的接应？
