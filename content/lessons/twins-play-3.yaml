timeline:
  duration: 10
  basis: illustration
  note: 有路线的球员从 0 秒展开，各用 10 秒走完已画路径；这是读图教学节奏，不是来源规定的统一跑速、启动先后或传球时刻。视频逐人讲解的顺序不作为启动顺序。
keyframes:
  - id: start
    at: 0
    label: 站好 · 找搭档
    cue: 找到 Q、C、X、Y、Z 的起点。X 的 Corner、Z 的 Post 分向展开；Y 通过 Chair 变化方向，C 保留短区选择。
  - id: spread
    at: 2.5
    label: 展开 · 看方向
    cue: 沿 Y 的 Chair 数出两次转向，再找中锋的短 Out。
  - id: middle
    at: 5.5
    label: 暂停 · 看配合
    cue: 比较 C 与 X/Y/Z 的深浅位置，指出不同接球选择。
  - id: end
    at: 10
    label: 回想 · 说一说
    cue: 谁的路线转了两次？谁提供较短的接应？
notes:
  - 跑位与可选球路都是教学演示，没有自动模拟防守；空当和接球机会是战术意图，不保证比赛结果。
  - 口令与提问是给亲子练习的教学改写；在场上练习前，先约定交叉点的通过次序，避免相撞。
  - 路线坐标保留附件 p29 的相对位置；图上的短连接补全被球员标记遮住的部分，不代表码数或新增动作。
  - 资料未给出完整的 QB 阅读顺序、必传对象或传球时刻；路线相交不代表交球。
  - 官网正文曾将短 Out 的执行者写作 safety；对应视频 1:16 明确说 center，本条按中锋 C 记录。
