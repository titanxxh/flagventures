timeline:
  duration: 10
  basis: illustration
  note: 已画出路线的球员在 0 秒同时开始、各用 10 秒走完。这只是读图教学节奏，不是原书规定的启动先后、跑速或交接球时序。
keyframes:
  - id: start
    at: 0
    label: 起始站位
    cue: 先找 X 和 Z 的起点。今天先扮演其中一位，再换队友的位置试试。
  - id: early
    at: 2.5
    label: 观察前段
    cue: 观察 X 和 Z 的前段；X 的跑法是「Corner」。
  - id: middle
    at: 5.5
    label: 观察中段
    cue: 停在这里：你关注的人去了哪里？Z 又在哪里？用手指同时指出两条路线。
  - id: end
    at: 10
    label: 路线终点
    cue: 回想 X 和 Z 从哪里出发、怎样转向。换一名球员讲一遍，再回到全队。
notes:
  - 球员身份按字母与起点核对，颜色仅作辅助。
  - 路线从 PDF 轮廓取中心线，标记遮挡的短起点作近似连接。没有加入传球目标或球权变化。
