id: trips-stack-play-1
kind: offense
title:
  zh: 三接手同侧叠列阵型 · 第 1 号战术
  en: TRIPS STACK PLAY 1
summary: 叠列的 X、Y、Z 都跑向深处，中锋跑短 Out，形成深浅配合。
teaching:
  goal: 三人跑深，帮助中锋短接应。
  cooperation: X 的 Corner、Y 的 Post、Z 的 Fly 分向深处；C 利用较浅区域跑 Out。
  cue: 我跑向深处，中锋在近处接应。
  question: 如果防守跟着叠列三人跑远，谁有短传机会？
source:
  title: NFL FLAG Play Book · 英文原书（封面 2020）
  page: 23
  note: 跑位坐标来自用户附件，归一化后重绘，非实际码数；路线称呼与配合讲解补充自 NFL FLAG 官网和视频。儿童口令、提问与播放节奏为教学改写。
